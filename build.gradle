plugins {
  id 'com.diffplug.spotless' version "$spotlessVersion" apply false
  id 'net.ltgt.errorprone' version "$errorpronePluginVersion" apply false
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // Lets IDEA's "Build and run using IntelliJ IDEA" option find compiled classes.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

subprojects {
  apply plugin: 'java-library'
  apply plugin: 'com.diffplug.spotless'
  apply plugin: 'net.ltgt.errorprone'

  version = projectVersion
  ext.appName = 'Project-W'

  repositories {
    mavenCentral()
  }

  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(25)
    }
  }

  dependencies {
    // Nullability contracts, enforced at compile time by NullAway.
    api "org.jspecify:jspecify:$jspecifyVersion"

    compileOnly "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"
    testCompileOnly "org.projectlombok:lombok:$lombokVersion"
    testAnnotationProcessor "org.projectlombok:lombok:$lombokVersion"

    errorprone "com.google.errorprone:error_prone_core:$errorproneVersion"
    errorprone "com.uber.nullaway:nullaway:$nullawayVersion"

    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.assertj:assertj-core:$assertjVersion"
    testImplementation "org.mockito:mockito-core:$mockitoVersion"
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.incremental = true
    // -Werror is what makes the warning list above worth having. Warnings printed by a build that
    // still says SUCCESS are warnings nobody reads: eight of them accumulated in one session before
    // anyone noticed, three of them javadocs orphaned by inserting a method above them - the kind of
    // thing a compiler is very good at catching and a human is not.
    options.compilerArgs += ['-Xlint:all', '-Xlint:-processing', '-Xlint:-serial', '-Werror']

    options.errorprone {
      disableWarningsInGeneratedCode = true
      option('NullAway:AnnotatedPackages', 'pl.mzebrows.pwt')
      option('NullAway:JSpecifyMode', 'true')
      error('NullAway')
    }
  }

  // Tests exist to catch our bugs, not Error Prone's opinions about test code.
  tasks.named('compileTestJava') {
    options.errorprone.disable('NullAway')
  }

  tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // Mockito's inline mock maker attaches an agent at runtime; JDK 24+ warns without this.
    jvmArgs '-XX:+EnableDynamicAgentLoading'
    testLogging {
      events 'failed'
      exceptionFormat 'full'
      showStackTraces = true
      // gradle.properties runs the build quiet, and the settings above are only the lifecycle level's:
      // without these a failed test says "1 failed" and nothing about what it asserted.
      quiet {
        events 'failed'
        exceptionFormat 'full'
        showStackTraces = true
      }
    }
  }

  spotless {
    java {
      target 'src/**/*.java'
      palantirJavaFormat("$palantirFormatVersion")
      removeUnusedImports()
      trimTrailingWhitespace()
      endWithNewline()
    }
  }
}

eclipse.project.name = appName + '-net'

// Networking (ADR 0012): the transport port, its Netty adapter, the in-memory test network, the
// connection log and the lockstep session on top of them. No libGDX - NetArchitectureTest fails the build if that changes - and Netty only
// inside the adapter package, so the library stays the replaceable part.
dependencies {
  // The session layer drives a Simulation and writes its snapshots; sim never sees net.
  api project(':sim')
  implementation "io.netty:netty-transport:$nettyVersion"
  implementation "io.netty:netty-codec-base:$nettyVersion"

  testImplementation "com.tngtech.archunit:archunit-junit5:$archunitVersion"
}

tasks.named('test') {
  // Every buffer Netty hands out is tracked, and a leak is reported through its logger, which the
  // Netty tests watch and fail on.
  jvmArgs '-Dio.netty.leakDetection.level=paranoid', '--enable-native-access=ALL-UNNAMED'
}

// The build id two peers must share to play together (ADR 0012): a hash of every source that decides
// what a tick does - map, sim, and the session protocol in net. Tuning is not in it, because the host
// ships its own game.properties. Line endings are dropped before hashing, so a Windows checkout and a
// Linux one of the same commit agree.
def buildIdSources = [
  map: rootProject.file('map/src/main/java'),
  sim: rootProject.file('sim/src/main/java'),
  net: file('src/main/java'),
]
def buildIdDir = layout.buildDirectory.dir('generated/buildId')
def generateBuildId = tasks.register('generateBuildId') {
  description = 'Hashes the sources that decide a tick into pwt-build.properties.'
  buildIdSources.each { module, root -> inputs.dir(root).withPathSensitivity(PathSensitivity.RELATIVE) }
  outputs.dir(buildIdDir)
  doLast {
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    buildIdSources.each { module, root ->
      def files = []
      root.eachFileRecurse(groovy.io.FileType.FILES) { if (it.name.endsWith('.java')) files << it }
      files.collect { [root.toPath().relativize(it.toPath()).toString().replace('\\', '/'), it] }
          .sort { it[0] }
          .each { entry ->
            digest.update((module + '/' + entry[0] + '\n').getBytes('UTF-8'))
            digest.update(entry[1].getText('UTF-8').replace('\r', '').getBytes('UTF-8'))
          }
    }
    def id = digest.digest().encodeHex().toString().substring(0, 16)
    def out = buildIdDir.get().file('pwt-build.properties').asFile
    out.parentFile.mkdirs()
    out.text = "# Generated by :net:generateBuildId - do not edit.\nbuild.id=${id}\n"
  }
}
sourceSets.main.resources.srcDir(generateBuildId)

// The shipped network tunables, compiled in as sim's game.properties is (:sim:generateShippedConfig):
// every key=value line of assets/network.properties as one constant, which NetConfig.defaults() binds.
// So the tests and a missing or broken file all fall back to exactly what ships.
def shippedNetConfigFile = rootProject.file('assets/network.properties')
def shippedNetConfigDir = layout.buildDirectory.dir('generated/sources/shippedNetConfig/java')
def generateShippedNetConfig = tasks.register('generateShippedNetConfig') {
  description = 'Compiles assets/network.properties into the ShippedNetConfig constant.'
  inputs.file(shippedNetConfigFile).withPathSensitivity(PathSensitivity.RELATIVE)
  outputs.dir(shippedNetConfigDir)
  doLast {
    def lines = shippedNetConfigFile.getText('ISO-8859-1').readLines()
        .collect { it.trim() }
        .findAll { it && !it.startsWith('#') && !it.startsWith('!') }
    def body = lines.collect { '            + "' + it.replace('\\', '\\\\').replace('"', '\\"') + '\\n"' }.join('\n')
    def out = shippedNetConfigDir.get().file('pl/mzebrows/pwt/net/ShippedNetConfig.java').asFile
    out.parentFile.mkdirs()
    out.text = """package pl.mzebrows.pwt.net;

/** Generated by {@code :net:generateShippedNetConfig} from {@code assets/network.properties} - do not edit. */
final class ShippedNetConfig {

    /** Every {@code key=value} line of the shipped file, in file order, comments stripped. */
    static final String TEXT = ""
${body};

    private ShippedNetConfig() {}
}
"""
  }
}
sourceSets.main.java.srcDir(generateShippedNetConfig)

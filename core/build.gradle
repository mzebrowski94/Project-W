eclipse.project.name = appName + '-core'

dependencies {
  api project(':sim')
  api project(':ui')
  api project(':net')
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx-controllers:gdx-controllers-core:$gdxControllersVersion"

  if (enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }

  // Same version the sim module already uses; see ClientArchitectureTest for what it guards.
  testImplementation "com.tngtech.archunit:archunit-junit5:$archunitVersion"
}

// UiFontTest reads the shipped font and words; a change to either must rerun it.
tasks.named('test') {
  inputs.dir(rootProject.file('assets/ui')).withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.dir(rootProject.file('assets/i18n')).withPathSensitivity(PathSensitivity.RELATIVE)
}

// Packs assets-raw/ into a single atlas under assets/atlas/. Run manually after
// changing source art: ./gradlew :core:packTextures
configurations {
  texturePacker
}

dependencies {
  texturePacker "com.badlogicgames.gdx:gdx-tools:$gdxVersion"
}

tasks.register('packTextures', JavaExec) {
  group = 'build'
  description = 'Packs assets-raw/ into a texture atlas in assets/atlas/.'
  classpath = configurations.texturePacker
  mainClass = 'com.badlogic.gdx.tools.texturepacker.TexturePacker'
  systemProperty 'java.awt.headless', 'true'
  args = ["$rootDir/assets-raw", "$rootDir/assets/atlas", 'game']
  onlyIf { file("$rootDir/assets-raw").isDirectory() }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

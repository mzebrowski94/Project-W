eclipse.project.name = appName + '-core'

dependencies {
  api project(':sim')
  api project(':ui')
  api project(':net')
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx-controllers:gdx-controllers-core:$gdxControllersVersion"

  if (enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }

  // Same version the sim module already uses; see ClientArchitectureTest for what it guards.
  testImplementation "com.tngtech.archunit:archunit-junit5:$archunitVersion"
}

// UiFontTest reads the shipped font and words, and SourceCitationsTest every module's sources, the shipped
// files and the docs - a comment-only change compiles to the same classes, so each must rerun the tests.
tasks.named('test') {
  inputs.dir(rootProject.file('assets')).withPathSensitivity(PathSensitivity.RELATIVE)
  ['map', 'sim', 'core', 'ui', 'net', 'lwjgl3'].each { module ->
    inputs.dir(rootProject.file("${module}/src/main")).withPathSensitivity(PathSensitivity.RELATIVE)
  }
  inputs.dir(rootProject.file('docs')).withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.dir(rootProject.file('.claude/skills')).withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.files(rootProject.file('CLAUDE.md'), rootProject.file('README.md')).withPathSensitivity(PathSensitivity.RELATIVE)
}

// The shipped graphic and controls tunables, compiled in as network.properties is (:net:generateShippedNetConfig):
// every key=value line of each file as one constant, which GraphicConfig.defaults() and ControlsConfig.defaults()
// bind. So the tests and a missing or broken file all fall back to exactly what ships. Each is generated into its
// record's package, where it stays package-private.
def shippedClientConfigs = [
  ShippedGraphicConfig: [file: rootProject.file('assets/graphic.properties'), pkg: 'pl.mzebrows.pwt.client'],
  ShippedControlsConfig: [file: rootProject.file('assets/controls.properties'), pkg: 'pl.mzebrows.pwt.client.input'],
]
def shippedClientConfigDir = layout.buildDirectory.dir('generated/sources/shippedClientConfig/java')
def generateShippedClientConfig = tasks.register('generateShippedClientConfig') {
  description = 'Compiles assets/graphic.properties and assets/controls.properties into constants.'
  shippedClientConfigs.each { name, shipped -> inputs.file(shipped.file).withPathSensitivity(PathSensitivity.RELATIVE) }
  inputs.property('packages', shippedClientConfigs.collectEntries { name, shipped -> [name, shipped.pkg] })
  outputs.dir(shippedClientConfigDir)
  doLast {
    // A file left from an earlier package would compile beside its successor.
    project.delete(shippedClientConfigDir)
    shippedClientConfigs.each { name, shipped ->
      def file = shipped.file
      def lines = file.getText('ISO-8859-1').readLines()
          .collect { it.trim() }
          .findAll { it && !it.startsWith('#') && !it.startsWith('!') }
      def body = lines.collect { '            + "' + it.replace('\\', '\\\\').replace('"', '\\"') + '\\n"' }.join('\n')
      def out = shippedClientConfigDir.get().file("${shipped.pkg.replace('.', '/')}/${name}.java").asFile
      out.parentFile.mkdirs()
      out.text = """package ${shipped.pkg};

/** Generated by {@code :core:generateShippedClientConfig} from {@code assets/${file.name}} - do not edit. */
final class ${name} {

    /** Every {@code key=value} line of the shipped file, in file order, comments stripped. */
    static final String TEXT = ""
${body};

    private ${name}() {}
}
"""
    }
  }
}
sourceSets.main.java.srcDir(generateShippedClientConfig)

// Packs assets-raw/ into a single atlas under assets/atlas/. Run manually after
// changing source art: ./gradlew :core:packTextures
configurations {
  texturePacker
}

dependencies {
  texturePacker "com.badlogicgames.gdx:gdx-tools:$gdxVersion"
}

tasks.register('packTextures', JavaExec) {
  group = 'build'
  description = 'Packs assets-raw/ into a texture atlas in assets/atlas/.'
  classpath = configurations.texturePacker
  mainClass = 'com.badlogic.gdx.tools.texturepacker.TexturePacker'
  systemProperty 'java.awt.headless', 'true'
  args = ["$rootDir/assets-raw", "$rootDir/assets/atlas", 'game']
  onlyIf { file("$rootDir/assets-raw").isDirectory() }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

eclipse.project.name = appName + '-sim'

// The deterministic simulation. Depends on libGDX only for its math and collection
// types - see ArchitectureTest, which fails the build if rendering or platform APIs
// leak in here.
dependencies {
  // The terrain field. sim reads it; it can never read sim.
  api project(':map')
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.badlogicgames.ashley:ashley:$ashleyVersion"

  testImplementation "com.tngtech.archunit:archunit-junit5:$archunitVersion"
}

// ArchitectureTest checks the Written by column of components.md against the bytecode, and SystemOrderTest the
// order the docs give the systems - an edit to either doc alone changes no class, so each must rerun the tests.
tasks.named('test') {
  inputs.files(rootProject.file('docs/components.md'), rootProject.file('docs/simulation-order.md'))
      .withPathSensitivity(PathSensitivity.RELATIVE)
}

// The shipped tuning, compiled in (ADR 0014's "the simulation reads no files" still holds): every
// key=value line of assets/sim/*.properties, one Java constant per file, which SimConfig.defaults()
// binds as one text in file-name order. So the tests, a missing file and a player's file with a bad key
// all fall back to exactly what ships, and there is no second copy of any number to drift. Comments are
// stripped, and each file is a constant of its own: a Java string constant holds at most 65535 bytes.
// The file list is generated beside the constants, so the loader and the build read the same files. A
// key given in two files fails here, before the binder could report it.
def shippedConfigSource = rootProject.file('assets/sim')
def shippedConfigDir = layout.buildDirectory.dir('generated/sources/shippedConfig/java')
def generateShippedConfig = tasks.register('generateShippedConfig') {
  description = 'Compiles assets/sim/*.properties into the ShippedConfig constants.'
  inputs.dir(shippedConfigSource).withPathSensitivity(PathSensitivity.RELATIVE)
  outputs.dir(shippedConfigDir)
  doLast {
    def files = (shippedConfigSource.listFiles() ?: [] as File[])
        .findAll { it.isFile() && it.name.endsWith('.properties') }
        .sort { it.name }
    if (files.isEmpty()) {
      throw new GradleException("no .properties files in ${shippedConfigSource}")
    }
    def fileOfKey = [:]
    def constants = files.collect { file ->
      def name = file.name - '.properties'
      if (!(name ==~ /[a-z][a-z0-9_]*/)) {
        throw new GradleException("${file.name}: a shipped config file is named in lower case letters, digits and _")
      }
      def lines = file.getText('ISO-8859-1').readLines()
          .collect { it.trim() }
          .findAll { it && !it.startsWith('#') && !it.startsWith('!') }
      lines.each { line ->
        def key = (line.contains('=') ? line.substring(0, line.indexOf('=')) : line).trim()
        if (fileOfKey.containsKey(key)) {
          throw new GradleException("${key} is given in ${fileOfKey[key]} and again in ${file.name}; a key lives in one file")
        }
        fileOfKey[key] = file.name
      }
      def bytes = lines.sum(0) { it.length() + 1 }
      if (bytes > 60000) {
        throw new GradleException("${file.name} has ${bytes} bytes of values; a Java constant holds 65535 - split it")
      }
      def body = lines.collect { '            + "' + it.replace('\\', '\\\\').replace('"', '\\"') + '\\n"' }.join('\n')
      [file: file.name, constant: name.toUpperCase(Locale.ROOT), body: body]
    }
    def fileList = constants.collect { '"' + it.file + '"' }.join(', ')
    def declarations = constants.collect { c ->
      """    /** Every {@code key=value} line of {@code ${c.file}}, in file order, comments stripped. */
    static final String ${c.constant} = ""
${c.body};
"""
    }.join('\n')
    def joined = constants.collect { it.constant }.join(', ')
    def out = shippedConfigDir.get().file('pl/mzebrows/pwt/sim/ShippedConfig.java').asFile
    out.parentFile.mkdirs()
    out.text = """package pl.mzebrows.pwt.sim;

import java.util.List;

/** Generated by {@code :sim:generateShippedConfig} from {@code assets/sim/*.properties} - do not edit. */
final class ShippedConfig {

    /** The files, by name, in the order they are read. */
    static final List<String> FILES = List.of(${fileList});

${declarations}
    /** Every file's lines, in {@link #FILES} order. Joined at run time, since as one constant it would be too long. */
    static final String TEXT = String.join("", ${joined});

    private ShippedConfig() {}
}
"""
  }
}
sourceSets.main.java.srcDir(generateShippedConfig)

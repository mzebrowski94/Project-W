# Every word the interface shows, by key (docs/ui/menu_layout_agent.md). English is the default and
# the only language so far. {0}, {1} are arguments. HUD words are capitals, as in the mock-ups.
# A key missing here draws as #key and is logged once.

# Top bar
ui.hud.planet=PLANET: {0}
ui.hud.mission=MISSION: {0}
ui.hud.goal=CURRENT GOAL: {0}
ui.hud.goal.complete=MISSION COMPLETED
ui.goal.CAPTURE_POINTS=CAPTURE THE CONTROL POINTS {0}/{1}
ui.goal.HOLD_POINT=HOLD THE POST - WAVE {0}/{1}
ui.goal.CLEAR_ENEMIES=CLEAR THE AREA

# Player panel. Weapon names are at most 7 characters: the panel's text column is 19.
ui.hud.player=P{0}
ui.hud.down=DOWN
ui.hud.kia=KIA {0}
ui.hud.aboard=ABOARD
ui.hud.overheat=OVERHEAT
ui.weapon.SIDEARM=SIDEARM
ui.weapon.RAILGUN=RAILGUN
ui.weapon.FLAMER=FLAMER
ui.weapon.SHOTGUN=SHOTGUN
ui.weapon.LASER=LASER
ui.weapon.TURRET_GUN=TURRET

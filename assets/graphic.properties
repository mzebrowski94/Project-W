# Rendering tunables. Changing anything here must never change what the game does.
# World units from the top of the view to the bottom at the near zoom: the camera's distance. The
# view's width is not a setting - it follows the view's shape on this screen (below), so a wider
# screen sees further to the sides.
graphic.virtualHeight=90
graphic.windowWidth=1280
graphic.windowHeight=720
graphic.vsync=true
graphic.backgroundColor=101018ff

# Placeholder colours, one per Look (G0003), keyed by the enum constant's own lowercase name.
# Rendering only - never gameplay. A look with no key here falls back to the hex in GraphicConfig.
graphic.color.commander=6ee7ffff
# One commander colour per player, because identical circles are not a game anybody can play
# (pillar 5). The key with no number is player one - the keyboard - and .1 to .7 follow the slots, up
# to the eight a game holds (G0038): offline .1-.3 are the pads in the order they were plugged in, and
# online the rest are players on other machines. Chosen to stay apart from the red of the aliens and
# from each other at a glance, in motion, on a dark field. .4-.7 are provisional: eight colours that
# can be told apart on a crowded field, and a marker for which one is you, are still open.
graphic.color.commander.1=ffd76eff
graphic.color.commander.2=8bff6eff
graphic.color.commander.3=ff8bd7ff
graphic.color.commander.4=5b7cffff
graphic.color.commander.5=6effc0ff
graphic.color.commander.6=f5f0c8ff
graphic.color.commander.7=d7b4ffff
# Kin to the commander's blue, darker: a squad reads as his without being mistaken for him.
graphic.color.trooper=4fb8d8ff
graphic.color.grunt=ff5d5dff
graphic.color.brute=b53a5aff
# Purple, off both reds: what is coming for you and what is shooting at you want different answers.
graphic.color.spitter=a05cf0ff
# The fast strain. Off both the grunt's red and the spitter's purple: what is coming at you fast and
# will not hold still has to be tellable from what is walking at you in a straight line.
graphic.color.runner=ff9a4aff
# The one that hops and ruins the ground. Green, because everything it does is green - the shot and
# the stain it leaves are the same family, and a player has to learn that one becomes the other.
# Well off the mushroom's pale green: one is food lying still and this comes at you.
graphic.color.frog=4f9e3cff
# Ochre: off every red (what chases you), the purple (what shoots you) and the green (what ruins the
# ground). It is a different problem from all of them - you go round it - so it needs its own colour.
graphic.color.ant=c9a227ff
# The sludger (G0073): the ant's ochre taken a little deeper and browner - kin, because it is the ant turned round,
# and told from it by which segment is dark: its back.
graphic.color.sludger=b5862aff
# The slinger (G0074): brown, a brute's weight in an earth colour off every red, the ant's ochre and the sludger's -
# and its riders on its back drawn in the runner's orange, which is what they are.
graphic.color.slinger=7a5230ff
# The leech (G0083): magenta - the purple asked for, taken warm where the spitter's is blue and bright where the
# searer's pink is dark - and half a spitter's size. What it leaves is venom, but green is the frog's.
graphic.color.leech=d94fc0ff
# The magma spitter (G0091, provisional, for review): the spitter's purple taken deep and dark - kin, because it is a
# spitter, and told from one by being darker and by the barrel-coloured ring it always wears, which a dark body
# shows off where a bright one would swallow it. What it spits is the molten colour, not the body.
graphic.color.magma_spitter=6e30b4ff
# The boss grunt (G0048): a grunt's red taken darker and deeper. Kin to a grunt, because it is one; darker,
# because it is the one that does not come to you. Its size says the rest.
graphic.color.boss_grunt=c8242eff
# The giants (G0071): a brute's colour darkened, and told apart by the colour of what they do - the searer
# towards its beams' pink, the thumper greyed towards the white of its slam.
graphic.color.searer=7a2f62ff
graphic.color.thumper=7a5a66ff
# Dark: a point is ground, drawn under everything standing on it, and must not compete with a unit.
graphic.color.control_point=2b3a52ff
# Ground a level says you must hold. Off the control point's blue: one is somewhere you go and take,
# the other is somewhere you stay, and a player should not have to remember which is which.
graphic.color.post=2f6a3aff
# A nest. Brown, and the only brown on the field: it is dug ground rather than a creature, and it must
# not be mistaken for either side. Drawn as rings darkening inwards (graphic.nest.* below), with what
# comes out of it named on the charge channel in that strain's own colour - so a grunt nest and a
# spitter nest are the same hole with a different thing waiting in it.
graphic.color.nest=6b4a2aff
# The gun on a mount: the player's blue, darker and heavier than a trooper's, because it is equipment
# rather than a man. It is the one thing on the field drawn square.
graphic.color.turret=3f7fa8ff
# A shut door: warmer than the wall it stands in, so the way in reads at a glance (G0069).
graphic.color.door=8a5a32ff
graphic.color.projectile=ffe066ff
graphic.color.slug=fff3c4ff
# A rocket: hot red-orange, the colour of what it is about to be - the barrel's and the blast's family
# - but solid and travelling, so it reads as one thing coming rather than as fire.
graphic.color.rocket=ff5a36ff
# A pulse rifle's bolt: electric violet-white, the shock it builds in the colour of what builds it.
graphic.color.bolt=c8b4ffff
# A disc gun's disc: white-gold, hotter and paler than the sidearm's yellow round, so the one shot that
# comes back off things reads as its own.
graphic.color.disc=fff2a8ff
# One pellet of flame. Orange rather than the sidearm's yellow, and the same orange as the barrel's
# and the blast's family: fire is fire wherever it comes from, and the thing that tells this apart
# from an explosion is that there are a dozen of them and they are travelling.
graphic.color.flame=ff7a2eff
# One pellet of buckshot. Deliberately kin to the sidearm's round rather than a colour of its own -
# it IS a small bullet, and what reads as a shotgun is six of them arriving at once in a fan.
graphic.color.pellet=ffd24dff
# The beam. Almost white, because what the player has to read is the LINE rather than any one shot -
# a saturated colour at this rate reads as a stream of objects instead of as a beam. Paler than the
# turret's blue on purpose: both are the player's and fast, and the one he is holding should be the
# brighter of the two.
#
# Each shot is DRAWN AS A LINE back to the muzzle it came from rather than as a dot, which is what
# makes the stream read as one beam. How far back is a number on the gun in SimConfig rather than
# here, beside the look, because it is what the gun IS rather than what colour it is.
graphic.color.laser=b4f6ffff
# What a turret fires. Blue rather than the sidearm's yellow, and it must be unmistakable at speed:
# it is the fastest thing on the field and the player has to read it as his own at a glance.
graphic.color.turret_shot=7fd8ffff
# Tinted off the spitter that fired it, and nothing like the player's yellow rounds.
graphic.color.spit=d08cffff
# A charged spit, from a spitter that has eaten a barrel. Hot pink, pulled off the spit towards the
# barrel's own orange-red: it is still that creature's shot, and it is still going to explode.
graphic.color.charged_spit=ff8ce0ff
# A magma spit (G0091): molten orange, the colour of the fire it leaves - off the charged spit's pink and the spit's
# lilac, so the shot that will leave the ground burning is told from the two that will not.
graphic.color.magma_spit=ff7a26ff
# Venom in the air, and the ground it leaves. The shot is bright and the stain is the same green a
# long way down, because one is a thing to see coming and the other is ground you have to read. The
# stain is deliberately dark for the reason a control point is: it is drawn under everything
# standing on it and must never hide a man standing in it.
graphic.color.venom=aef23cff
# What the boss throws. Hot rose, pulled off the boss's own red: whose it is at a glance, nothing like the
# player's yellow rounds, and darker and redder than a charged spit's pink so twenty of them read as one
# pattern rather than as a spitter's shots.
graphic.color.spew=ff3d7aff
# A searer's beam: hot pink-white, a laser that is not the player's cyan. A thumper's slam: white.
graphic.color.sear=ff9ad8ff
graphic.color.slam=ffffffff
graphic.color.slick=5c7a1eff
# A sludger's glob in the air, and the glue it leaves (G0073). The same rule as venom's: the shot bright, the ground
# the same family a long way down - dark greyish amber, so it reads as ground that holds you rather than burns you,
# and never hides a man standing in it.
graphic.color.glob=e8b44cff
graphic.color.glue=5e5236ff
graphic.color.strike=ffffffff
# Thrown, and the flash it leaves. The grenade is the darker half of the same amber, so what is in the
# air and what it turns into read as one thing.
graphic.color.grenade=c07820ff
# The flash an explosion leaves. Drawn at the radius that kills, so the ring is the rule.
graphic.color.blast=ffb03aff
# A body being pumped up by the beam, and the flash it leaves when it goes. ONE COLOUR FOR BOTH, on
# purpose: the ring and the explosion are one event, and the flash has to read as that ring's payoff
# rather than as something else going off in the same place. Brighter than the blast's amber, because
# the ring is drawn at half transparency over a creature and still has to be unmistakable, and
# because this is the one explosion the player MADE rather than set off.
graphic.color.bloat=ff8a46ff
# Shock building towards a stun (G0059), on the charge ring: the bolt's violet, saturated, so a body
# about to be held still reads as the gun's work and never as a bloat's orange.
graphic.color.shock=a07cffff
# The ground an explosion leaves burning. The blast's own amber pulled towards the barrel's
# orange-red and darkened, for the reason the venom stain is darker than the shot: one is a thing you
# see happen and the other is ground you have to read, drawn under everything standing on it. It must
# never hide a man who is standing in it, and it must never be mistaken for the flash it came out of -
# the flash is gone in a quarter of a second and this is there for ten.
graphic.color.fire=c4521cff
graphic.color.obstacle=4a4a5eff
# A tree's trunk (G0072): bark brown, drawn over its own foliage so the part that stops a man is always seen.
graphic.color.tree=6b4626ff
graphic.color.mushroom=8fd97fff
graphic.color.flower=e07be0ff
graphic.color.supply_drop=9fd8f0ff
# A medkit: white, the one pickup a wounded man is looking for, and never mistaken for a crate of men.
graphic.color.medkit=f4f4f4ff
# One crate per gun, so what he is walking across a level for is legible before he gets there
# (pillar 5). The amber is the one the single cache always was, kept for the gun the player already
# knows; the flamer's crate is the colour of its own flame, so that pairing is learnt in one go. The
# shotgun's is off both, because its pellets are the sidearm's yellow and a yellow crate would read
# as a gun he is already holding.
graphic.color.armoury_railgun=d8a04aff
graphic.color.armoury_flamer=ff7a2eff
graphic.color.armoury_shotgun=4ad8a0ff
graphic.color.armoury_laser=46c8e6ff
# The bazooka's: a deep red, off the flamer's orange so the two heavy guns are not one colour.
graphic.color.armoury_bazooka=c8323cff
# The pulse rifle's: violet, off the laser's cyan so the two beams-of-a-kind are not one colour.
graphic.color.armoury_pulse=9a6cffff
# The disc gun's: gold, the disc's own colour deepened so it reads on the ground.
graphic.color.armoury_disc=e8c840ff
# A grenade cache's (G0077): the grenade's own brown-orange, so the card reads as what it fills.
graphic.color.armoury_grenades=c07820ff
# A crate (G0056): drab khaki, the colour of no gun, so it never reads as one he knows - and a square
# with a white dot rather than a disc, so it reads as a thing to open rather than a cache to walk over.
graphic.color.crate=a89c84ff
# Orange-red rather than red: a grunt is already red, and a field where some of the red circles chase
# you and the others kill you when shot is exactly the confusion pillar 5 exists to prevent.
graphic.color.barrel=ff3a10ff
# A mine, and the fuse once it has started. The mine is a dark, dull green - close to the ground it
# is lying on, because a mine the other side could obviously see is a mine nothing would walk into,
# and it is the player who is meant to know where he put them. The fuse is near-black and drawn as a
# core inside it: the only thing on the charge channel that is DARKER than what it is drawn on, so
# what is about to kill you cannot be read as something filling up.
graphic.color.mine=2f5d3aff
graphic.color.fuse=0a0a0aff
# A geyser (G0089): scorched brown ground, darker than the cut's rock-dust so it reads as a hole rather than a
# boulder, under everything standing on it. Filling, it wears the fire's own colour as its core, pulsing at
# graphic.geyser.pulseHz - so the warning and what follows are one colour.
graphic.color.geyser=5a3a22ff
# Near-white rather than white: a melee sweep is the white flash, and the two must not read alike.
graphic.color.rabbit=f0f0f0ff
# The core drawn inside whoever is putting a man back on his feet. Green, and the only charge in the
# game that is not the body's own colour brightened - every other thing that fills up is a countdown
# or a threat growing, and this one is the single piece of good news on the field.
graphic.color.mending=4ce88aff
# The pulse on something worth crossing the ground for. White, so it reads as a shine on whatever
# colour the thing underneath it is rather than as a second thing sitting on top of it.
graphic.color.gleam=ffffffff
# A gun getting hot, and one that has stopped itself. The second must not read as the first getting
# worse: it is the moment the player has to do something else.
graphic.color.heat=ffc24aff
graphic.color.overheat=ff4a2aff
graphic.color.none=ff00ffff

# The ground, one colour per Terrain, keyed by the enum constant's own lowercase name. Kept dark:
# the field is the backdrop the units have to read against, not a thing to look at itself.
graphic.terrain.plain=1c2130ff
graphic.terrain.dust=2a2620ff
# The proving ground's floor (G0060): yellow-bronze, and still dark enough to be a backdrop - the ant's
# ochre and the barrel's orange-red have to stand off it. Lower it if they do not.
graphic.terrain.sand=433722ff
graphic.terrain.organic=16241cff
# Standing water, and burnt ground. Both cooler and flatter than the grounds above so that a march
# through them reads as somewhere worse rather than somewhere brighter - the mire towards the blue
# the shading already uses, the ashes towards no colour at all.
graphic.terrain.mire=14222aff
graphic.terrain.ash=231f22ff
# Dense undergrowth: passable, and the one ground worth going round. It has to read as SOMETHING
# GROWING ON the floor rather than as another kind of floor, because the whole of what it says to
# the player is "this will cost you" - so the base is a darker green than the organic ground and the
# hatch drawn over it is what actually carries the message.
graphic.terrain.thicket=15291bff
# ROCK, AND THE RIM ROUND IT. The colour alone is a shade off the floor it stands on, which at the
# pulled-back view is a map you have to squint at to find the walls in - so every face of a wall that
# touches walkable ground is drawn with a lighter edge on it. That is what the eye actually reads a
# wall by: not that it is darker, but that it STOPS. Tiles in the middle of a block draw nothing, so
# a solid mass costs its perimeter and an outcrop costs its outline.
#
# rockEdgeWidth is a fraction of a tile - thin, or the rim eats the wall it is drawn on. Raise
# rockEdgeAlpha towards one if walls still read as a patch of floor; lower it if the level starts to
# look like a wireframe.
graphic.terrain.rock=3f3f52ff
graphic.terrain.rockEdge=8a8aa8ff
graphic.terrain.rockEdgeWidth=0.17
graphic.terrain.rockEdgeAlpha=1.0
# A HOUSE'S WALL: blocks exactly as rock does and is rimmed the same way, so it reads as in the way -
# but warmer and lighter, so a house reads as built rather than as a square of rock (missions ticket
# 12, pillar 5). Move it towards the rock colour if houses shout; away if they read as outcrops.
graphic.terrain.wall=57524aff
# A HOUSE'S FLOOR: the same neutral grey in every biome, so the inside of a house reads as a room rather than
# as the ground outside it with walls round it. Between the plain ground and the wall in brightness; move it
# towards the wall if rooms read as holes, darker if they pull the eye from what stands in them.
graphic.terrain.floor=3d3e42ff
# LAVA (G0091, provisional, for review): ground nothing stands on, a deep dark red - darkened by Mateusz
# after the 2026-11-13 playtest, so it reads as cooling rock rather than a glow; what it says is still
# "not here". Redder and deeper than fire's orange so a fire burning beside a pool reads as on the
# ground, not as more pool; rimmed off its own colour as rock is.
graphic.terrain.lava=6b1c09ff

# THE UNDERGROWTH DRAWN OVER A THICKET. The base colour above says where it is; this says what it is.
# A grid of small marks per tile, each mixed halfway towards the growth colour - half-transparent
# without turning GL blending on, because the colour under every mark is known when the map is bound
# and a global state change made for one kind of tile is one every other draw has to be checked
# against.
#
# cells is how many marks across a tile and dot is how much of its own cell each one fills. Regular
# rather than scattered on purpose: at this size a random texture reads as noise, and what the mark
# has to say is "not open ground" rather than any particular plant. Raise alpha if a thicket does not
# read from the pulled-back view; lower dot if it reads as a solid floor tile again.
graphic.thicket.cells=3
graphic.thicket.dot=0.42
graphic.thicket.tint=7fc46aff
graphic.thicket.alpha=0.5

# Ground mottling. A biome painted in one flat colour reads as a sheet of paper however large it is,
# and a level four screens wide made of four such sheets reads as a spreadsheet - so the ground is
# nudged a little by a hash of where you are. Smaller than the region variance by some way, or the
# regions stop reading as places; zero draws every tile identically.
graphic.tile.variance=0.022
# How many steps that is quantised into. One is no variation at all.
graphic.tile.shades=4
# How many tiles across one patch of a single shade is. THIS IS THE DIAL THAT MATTERS: hashing every
# tile on its own (a patch of 1) is by construction white noise, and the eye reads that as static
# rather than as ground. Three tiles is fifteen world units, which mottles at a scale you can see.
# Larger is calmer and eventually reads as regions; smaller is noisier. Bigger patches also make the
# renderer's run-merging cheaper rather than dearer, because a run can only break at a boundary.
graphic.tile.patch=5

# How far apart two regions of the SAME ground are shaded, as a fraction toward white or black. This
# is what makes the parts of a map visibly different places without inventing a terrain for each one.
# Enough to see a boundary when you look for it, not enough to be mistaken for different ground -
# raise it to see where the regions are while working on generation, and put it back afterwards.
graphic.region.variance=0.06

# How far to shift the colour above for what an entity is doing (Appearance.State). Positive is
# toward white, negative toward black. The wind-up is the loudest because it is the one the player
# has to react to. Grappling is deliberately a smaller shift than dying: for the length of the lock
# both parties look the same, and only when it ends does the loser drop to the dying shade.
# A unit that has not noticed you is the quietest thing on the field; it is not a threat yet.
graphic.state.unaware=-0.4
graphic.state.windingUp=0.85
graphic.state.airborne=0.5
graphic.state.grappling=-0.3
# A shoved unit brightens instead of darkening: it is still a threat, just off balance.
graphic.state.staggered=0.35
# Stunned by something that declares a stun (G0053): a darkening, where a stagger is a flash. It lasts,
# and it is the opening - it must not be read as the flash of a shove.
graphic.state.stunned=-0.55
# A unit with a beam on it, wading. The only state here that LASTS rather than flashing past, so it
# is deliberately the quietest shift on the list: loud enough to tell a creature that is struggling
# from one that is walking at you normally, quiet enough that half a dozen of them at once does not
# read as the whole field changing colour. Dulled rather than flared, because it is neither off
# balance nor out of the fight.
graphic.state.slowed=-0.18

# THE RING ON A THING BEING PUMPED UP BY THE BEAM. The odd one out on the charge channel and
# deliberately so: every other charge is a brighter core INSIDE the body, because every other charge
# is something the thing is doing. This one is being done TO it and is about to kill whatever is
# standing nearby, so it grows OUT past the body instead - the one mark in the game that is bigger
# than what it is drawn on, read as a size rather than as a fill.
#
# scale is how far past the body it reaches at full charge, as a multiple of the body's radius.
# alpha is how much you can see through it: half, because the creature underneath is usually still
# worth looking at and still worth shooting. One would be a solid disc that hides it.
# scale RAMPS FROM THE BODY'S OWN SIZE rather than from nothing: scaled from zero, the ring spends
# everything under two thirds charge inside the creature, which on a runner is a dot you cannot see
# and on everything else reads as the mechanic not working. From one it is a halo from the first shot.
graphic.bloat.scale=1.5
graphic.bloat.alpha=0.5
graphic.state.dying=-0.7
# A casualty brightens, hard, in the opposite direction from a corpse. The two are the states most
# expensive to confuse: one is a man to run to and the other is ground not worth crossing.
graphic.state.casualty=0.6
# A gun with somebody on it, against one standing empty. Bright enough to read from across the level:
# which turrets are manned is what a player decides where to run by.
graphic.state.crewed=0.45
# A man in an ant's jaws (G0045). Brightened like a casualty, a little less: he is on his feet and a
# man to run to, and his clock is on him.
graphic.state.gripped=0.3

# How a creature in two segments is drawn (the ant, the sludger): a body behind and a head in front, along its
# facing, both inside the circle that is actually hit. The armoured segment is darker because it is the hard end -
# the end a bullet glances off: the ant's head, the sludger's back (G0073) - and which end that is has to be
# readable at a glance (pillar 5).
# Offsets and scales are fractions of the body's radius; an offset plus its scale may not pass one.
graphic.segments.bodyOffset=0.35
graphic.segments.bodyScale=0.65
graphic.segments.headOffset=0.5
graphic.segments.headScale=0.5
graphic.segments.headShade=0.35

# How the view follows the things it is watching. Rendering only: nothing here can change what the
# simulation does, and aim is a direction rather than a distance, so zooming out never adds range.
# deadZone is how far a target may drift before the view follows it at all - without one the view
# jitters on every step. smoothing and zoomSmoothing are how fast it closes on its goal, per second,
# eased so the feel is the same at 30 and 144 frames per second. lookAhead leans the view the way the
# player is walking (never the way they are aiming - that would chase its own tail).
#
# leadSmoothing is how fast that lean builds and decays, and it must stay well below smoothing. Taking
# the movement input raw makes the view snap the whole lookAhead distance the moment you reverse, and
# tapping left and right then shakes it badly. Easing it over about half a second means a flick
# averages out to nothing while a sustained run still earns the full lean. If the view still feels
# twitchy, lower this before touching anything else; if it feels sluggish to turn around, raise it.
graphic.camera.deadZone=6
graphic.camera.smoothing=8
graphic.camera.lookAhead=14
graphic.camera.leadSmoothing=2
graphic.camera.zoomSmoothing=7

# The two views Tab swaps between, as multiples of the viewport above. farZoom is also the widest the
# camera will ever go to frame several players at once; past that it stops rather than pulling out
# forever. fitMargin is the slack left around them when it does.
graphic.camera.nearZoom=1
graphic.camera.farZoom=2.2
graphic.camera.fitMargin=1.25

# What the view does about something violent going off near the player. The simulation says how hard
# the ground moved, in world units, and how far it is felt; everything here is the look of it, so
# turning shakeScale down to zero removes the effect and changes nothing about what the game does.
# There is deliberately no separate dial for zoom: the offset is in world units, so the pulled-back
# view divides it by the zoom on its own and a blast that rocks the close view is a twitch in the
# overview. shakeCycles is how many times the view swings over a whole shake - more reads as a rattle,
# fewer as a shove.
graphic.camera.shakeScale=1
graphic.camera.shakeCycles=3

# How a nest is drawn: rings darkening inwards, which is the one thing a renderer with no textures
# can say about a HOLE rather than a body. shells is how many rings, including the outermost; darken
# is how far toward black the innermost one is, with the rest spaced evenly along it - so raising it
# deepens the hole rather than adding to it. One shell is a plain filled circle.
graphic.nest.shells=4
graphic.nest.darken=0.55

# The mark drawn inside a unit that is filling up towards something - an enemy part-way to evolving
# (Appearance.charge). Scale is how much of the body the mark covers when it is full; tint is how far
# it is shifted toward white, so it reads as a core rather than as a second unit.
graphic.charge.scale=0.55
graphic.charge.tint=0.8

# The spoke drawn out of a unit's centre showing which way it is pointing (Appearance.facing). This
# is a tell, not decoration: a trooper engages what is inside its arc, so its front has to be
# visible. Length is a multiple of the body's radius and is above one on purpose - a spoke that stops
# at the rim disappears into the circle at small sizes.
graphic.facing.length=1.35
graphic.facing.width=0.34
graphic.facing.tint=0.55

# The ring drawn round a creature whose gun goes off where its shots land - a spitter that has
# swallowed a barrel. Outline rather than fill, and in a colour of its own rather than a shift of the
# body's: it has to be findable at a glance in a line of otherwise identical creatures, and the shots
# alone are a tell you learn by being caught in one. The default is the barrel's own orange-red, so
# the ring is the colour of the thing it swallowed. Sits inside the order ring, which is wider.
graphic.charged.scale=1.35
graphic.charged.color=ff3a10ff

# The ring drawn round a unit that is acting on an order rather than on its own judgement. Outline
# rather than fill, so it never hides the unit inside it. This is how the player learns how far his
# voice actually carries instead of guessing at it.
graphic.order.scale=1.55
graphic.order.tint=0.75

# One red disc in the middle of a man on his feet who carries a wound (G0053): size is its
# radius at one wound, as a multiple of his radius, and each further wound adds growth, up to maxSize
# so it never covers him. Filled and in a colour of its own - a wound asks for a reaction, a medkit or
# cover, that nothing else drawn on a man does. The exact count is on his panel.
graphic.wound.size=0.35
graphic.wound.growth=0.12
graphic.wound.maxSize=0.7
graphic.wound.color=e8453cff

# A thumper's slam (G0071): the circle its shots covered, drawn for the moment after it lands as a white outline
# over a pale fill, both fading out. Pale enough that what is standing in it still reads.
graphic.burst.fillAlpha=0.25
graphic.burst.outlineAlpha=0.9
graphic.burst.color=ffffffff

# A declared stun (G0053, G0071): a see-through white disc round the stunned body, scale times its radius when the
# stun lands, shrinking onto it as the stun runs out - how long the window has left, on top of the darkening.
graphic.daze.scale=2.2
graphic.daze.alpha=0.3
graphic.daze.color=ffffffff

# A tree's foliage (G0072), both discs scaled from the trunk and drawn over everything else on the field: the inner
# one dark green and opaque - whatever stands beneath it is hidden, the fen's ambush - the outer one a lighter green
# at outerAlpha, which half hides it, so the edge of the cover reads before you are under it.
graphic.tree.innerScale=2.2
graphic.tree.outerScale=3.5
graphic.tree.outerAlpha=0.5
graphic.tree.inner=1f4a22ff
graphic.tree.outer=3f8a3aff

# A slinger's riders (G0074): discs riderScale of its radius, in a row across its back riderOffset behind its middle,
# riderSpread apart - three fit inside the body.
graphic.sling.riderScale=0.28
graphic.sling.riderOffset=0.45
graphic.sling.riderSpread=0.5
# The shadow under whatever is off the ground - a slung rider (G0074) and a thrown grenade (G0077), one look for
# both: scale of its size, offset of its radius below and right of it, at alpha.
graphic.shadow.offset=2.0
graphic.shadow.scale=0.9
graphic.shadow.alpha=0.6
graphic.shadow.color=000000ff
# A pop (G0078): what the player's side has just taken by touch, in its own look, rising rise of its radius off the
# taker over sim.pop.seconds and fading from alpha to nothing.
graphic.pop.rise=3
graphic.pop.alpha=0.85
# A geyser filling (G0089, provisional, for review): the fire mark at its core, growing as it fills and pulsing
# pulseHz times a second between graphic.color.fire and light - the warning before it erupts. Raise pulseHz if the
# warning is missed in a fight; at most 3.
graphic.geyser.light=ffb03aff
graphic.geyser.pulseHz=3

# A boulder's shading: steps discs over its colour, each lighter and nearer the north-west, the last light of the way
# to white and shift of the radius towards the light - a stepped gradient so a boulder reads as round rock.
graphic.boulder.steps=2
graphic.boulder.light=0.1
graphic.boulder.shift=0.3

# A shield in front of a man (G0053): an outline ring outside the order ring, drawn as much of a ring
# as it has left, so a respawn shield is seen running down. Pale blue - the one colour on the field
# that says "the next hit is taken for you".
graphic.shield.scale=1.85
graphic.shield.segments=24
graphic.shield.color=7fd8ffff
# The dot on a crate (G0056): its radius as a share of the crate's, and its colour.
graphic.crate.dot=0.35
graphic.crate.dotColor=ffffffff

# How hot the gun a unit is holding has become: an arc over its head, filling left to right. It is
# deliberately not the core every other fraction is drawn as - a core says "something is happening to
# this" and heat is the one bar that fills up because of what the player did. The two colours are in
# the palette, under graphic.color.heat and graphic.color.overheat.
graphic.heat.scale=1.7
graphic.heat.width=0.28
graphic.heat.spreadDegrees=150
graphic.heat.segments=14

# A door being opened (G0069): a loading circle on the door itself, filling clockwise from straight up. Its
# colour is graphic.color.mending, the one clock the player is winning. scale is the ring's radius in tiles -
# a little over half a tile reads as just wider than one tile; width is how thick, in tiles.
graphic.door.scale=0.65
graphic.door.width=0.12
graphic.door.segments=32

# A post (G0027): an outline just round the point it was taken from, under everything standing on it, pulsing
# gently between graphic.color.post and light. width is a share of the point's radius; pulseHz at most 3.
# Raise pulseHz if it reads as a static ring; lower light towards the dark green if it pulls the eye.
graphic.post.width=0.18
graphic.post.segments=40
graphic.post.light=9ff0b0ff
graphic.post.pulseHz=0.6

# The letterbox: the screen is a top bar, the view and a bottom bar (docs/ui/). Rendering only.
# The view's width over its height is kept between these two. Wider sees further left and right;
# equal values pin its shape. A screen wider than the maximum gets black pillars beside the view; one
# narrower than the minimum gives the extra height to the bars. Refused if min > max.
graphic.view.aspectMin=1.6
graphic.view.aspectMax=2.39
# Share of the bars' height beyond what they need that goes to the top bar.
graphic.view.topShare=0.5
# UI pixels from the top of the screen to the bottom. The largest whole scale at which this many fit
# decides how big a UI pixel is; smaller means chunkier UI. 360 divides 720, 1080, 1440 and 2160.
graphic.ui.canvasHeight=360
# UI size: 0 is the largest whole scale that fits. A smaller whole number gives a smaller HUD and a
# bigger view; never a fraction, so text is never blurred.
graphic.ui.scale=0
# UI pixels between a bar's edge and what is in it.
graphic.ui.padding=4
# A line of text: capitals and descenders (monogram: 7 + 2), and UI pixels between lines - room for
# the accents above a capital (3), so Polish never collides with the line above. Both decide how
# tall the bars are.
graphic.ui.fontSize=9
graphic.ui.leading=3
# Lines the terminal shows in the top bar. Each one makes the top bar a line taller.
graphic.hud.terminal.lines=2
# The terminal (UI:hud/top/terminal): the battlefield's voice, newest line at the bottom, typed out
# at charsPerSecond. A high line - an alarm: a commander down or lost, the mission started - at
# highCharsPerSecond, where 0 shows it whole at once. A typed line stays newest at least minHoldSeconds
# before a waiting one pushes it up (lower = busier); a normal or low line still waiting after
# maxAgeSeconds is dropped as stale news (a high one always waits). queue lines wait at most. A repeat of
# the same line inside coalesceSeconds merges into it. The cursor blinks every blinkSeconds while a line
# types and for cursorLingerSeconds after - then nothing in the bar moves until something happens.
graphic.hud.terminal.charsPerSecond=45
graphic.hud.terminal.highCharsPerSecond=0
graphic.hud.terminal.minHoldSeconds=1.2
graphic.hud.terminal.maxAgeSeconds=4
graphic.hud.terminal.queue=8
graphic.hud.terminal.coalesceSeconds=2
graphic.hud.terminal.blinkSeconds=0.5
graphic.hud.terminal.cursorLingerSeconds=1
# The terminal says the squad is down to a few once, as troopers standing falls below this.
graphic.hud.terminal.fewTroopers=5
# The toast (UI:hud/view/toast): an upgrade earned, passed on or taken, or the swarm adapting, typed over the top of
# the view where the paused banner goes, in that player's colour or the swarm's, at charsPerSecond (0 shows it
# whole at once), then held holdSeconds and gone. The terminal says it too; this is what is not missed.
# queue toasts wait at most, the oldest dropped. Held, not shown, while a menu or the banner is up.
graphic.hud.toast.charsPerSecond=30
graphic.hud.toast.holdSeconds=4
graphic.hud.toast.queue=4
# The portrait's side in UI pixels. Decides how tall the bottom bar is.
graphic.hud.portrait.size=32
# Share of the top bar the dev overlay (F1) takes, on the right.
graphic.hud.overlay.widthShare=0.34
# HUD colours. Text is neutral - every hue already means something in the world; a player's colour
# and the heat colours are the world's own keys, not repeated here. Alert is the only warning colour,
# drawn only inside the bars as black text on it, and only for DOWN, KIA and OVERHEAT.
graphic.hud.color.text=e8e8e8ff
graphic.hud.color.textDim=8a8a8aff
graphic.hud.color.alert=ff3030ff
graphic.hud.color.overlayFrame=e02020ff
graphic.hud.color.bar=000000ff
# A wound he carries, filled on his panel as a narrow diamond; one he could still take is a hollow one
# in textDim. Soft red-pink: the one hue on a panel besides his own and the alert, because a wound is
# the one thing there that asks for a reaction - a medkit or cover - and white read as nothing.
graphic.hud.color.wound=f0788aff
# What the swarm's adaptations are written in - in the top bar's aside, the pause menu's list and their
# toast - so what the aliens took never reads as what the side holds. The swarm's red, a grunt's own.
graphic.hud.color.swarm=ff5d5dff
# Every UI duration and amplitude is multiplied by motionScale: 0 is reduced motion. flashScale 0 turns
# every UI flash and pulse into a steady change. Both are accessibility options once Options exists.
graphic.ui.motionScale=1
graphic.ui.flashScale=1
# As a player goes down, dies or overheats, his panel's frame flashes and shakes this long, this many
# UI pixels. Feedback for the moment it happens, not for being hurt - a commander has no chip damage.
graphic.hud.panel.alarmSeconds=0.15
graphic.hud.panel.alarmShake=1
# How fast DOWN, KIA and OVERHEAT pulse, and a completed goal's two pulses. Refused above 3.
graphic.hud.alert.pulseHz=2
# The UPGRADE tell on a panel: a backing glow in the player's colour, glow its brightness as a share of
# that colour, and text that breathes towards white by lift at pulseHz - slow on purpose, it is an
# offer, not an alarm. flashScale 0 holds it lit and still. pulseHz is refused above 3.
graphic.hud.upgrade.glow=0.3
graphic.hud.upgrade.lift=0.5
graphic.hud.upgrade.pulseHz=0.8
# The least time a goal stays on the goal line before another may replace it, so a one-tick flip
# never flickers.
graphic.hud.goal.minHoldSeconds=1.0
# Reticles: the game's own aim mark, in each player's colour, drawn at the UI scale. The keyboard
# player's sits on the mouse and hides the system pointer; a pad player's sits padDistance world units
# along his aim. Both off by default - on is the more arcade look; off leaves the gun and the pointer.
graphic.hud.reticle.size=9
graphic.hud.reticle.keyboard=false
graphic.hud.reticle.pads=false
graphic.hud.reticle.padDistance=24
# Whether a level opens with the bottom bar on the roll call instead of the players' panels. The
# roll call key (controls.key.rollCall) swaps it either way. A placeholder for now.
graphic.hud.rollCall=false
# The pause. Under a menu the view is dimmed by scrimAlpha - the frozen fight stays readable, so the
# player can re-orient before he resumes; lower shows more of it. Paused with no menu open here (another
# machine paused, or the harness's P) it is dimmed by bannerScrimAlpha under a one-line banner. The scrim
# comes and goes in scrimSeconds, times graphic.ui.motionScale.
graphic.ui.scrimAlpha=0.55
graphic.ui.bannerScrimAlpha=0.25
graphic.ui.motion.scrimSeconds=0.08
# A level with an objective, won or lost (G0066): the world runs on and the goal line pulses for
# resultHoldSeconds of the world's time - the same both ways, no press skips it, a pause holds it too -
# and then the result screen opens over the scrim. Long enough to see the finale fall, or the last man.
graphic.ui.resultHoldSeconds=3
# A page arriving slides pageSlide UI pixels in the direction of travel as it fades up, in pageSeconds
# times graphic.ui.motionScale. Any press finishes it at once - a menu never makes input wait.
graphic.ui.motion.pageSeconds=0.12
graphic.ui.motion.pageSlide=6
# How many characters wide every page's panel is - the same on every page and for every device, so a
# panel never changes width as its selection or its hint changes. Longer lines wrap; 34 is about the
# left third of a 16:9 view, where the pause menu docks.
graphic.ui.page.columns=60
# Whether the menu lists the Adventures - the alpha's scenarios - under CAMPAIGN, and under HOST GAME
# after its missions. Off for a build that goes to playtesters: CAMPAIGN then says it is not open yet and
# points at the daily missions, and HOST GAME hosts missions only. Turn it on to play a scenario.
graphic.ui.page.scenarios=false

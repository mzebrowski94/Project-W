# Rendering tunables. Changing anything here must never change what the game does.
graphic.virtualWidth=160
graphic.virtualHeight=90
graphic.windowWidth=1280
graphic.windowHeight=720
graphic.vsync=true
graphic.backgroundColor=101018ff

# Placeholder colours, one per Look (G0003), keyed by the enum constant's own lowercase name.
# Rendering only - never gameplay. A look with no key here falls back to the hex in GraphicConfig.
graphic.color.commander=6ee7ffff
# Kin to the commander's blue, darker: a squad reads as his without being mistaken for him.
graphic.color.trooper=4fb8d8ff
graphic.color.grunt=ff5d5dff
graphic.color.brute=b53a5aff
# Dark: a point is ground, drawn under everything standing on it, and must not compete with a unit.
graphic.color.control_point=2b3a52ff
graphic.color.projectile=ffe066ff
graphic.color.slug=fff3c4ff
graphic.color.strike=ffffffff
# Thrown, and the flash it leaves. The grenade is the darker half of the same amber, so what is in the
# air and what it turns into read as one thing.
graphic.color.grenade=c07820ff
# The flash an explosion leaves. Drawn at the radius that kills, so the ring is the rule.
graphic.color.blast=ffb03aff
graphic.color.obstacle=4a4a5eff
graphic.color.mushroom=8fd97fff
graphic.color.flower=e07be0ff
graphic.color.frozen_trooper=9fd8f0ff
graphic.color.armoury=d8a04aff
# Orange-red rather than red: a grunt is already red, and a field where some of the red circles chase
# you and the others kill you when shot is exactly the confusion pillar 5 exists to prevent.
graphic.color.barrel=ff3a10ff
# Near-white rather than white: a melee sweep is the white flash, and the two must not read alike.
graphic.color.rabbit=f0f0f0ff
graphic.color.none=ff00ffff

# The ground, one colour per Terrain, keyed by the enum constant's own lowercase name. Kept dark:
# the field is the backdrop the units have to read against, not a thing to look at itself.
graphic.terrain.plain=1c2130ff
graphic.terrain.dust=2a2620ff
graphic.terrain.organic=16241cff
graphic.terrain.rock=343442ff

# How far apart two regions of the SAME ground are shaded, as a fraction toward white or black. This
# is what makes the parts of a map visibly different places without inventing a terrain for each one.
# Enough to see a boundary when you look for it, not enough to be mistaken for different ground -
# raise it to see where the regions are while working on generation, and put it back afterwards.
graphic.region.variance=0.06

# How far to shift the colour above for what an entity is doing (Appearance.State). Positive is
# toward white, negative toward black. The wind-up is the loudest because it is the one the player
# has to react to. Grappling is deliberately a smaller shift than dying: for the length of the lock
# both parties look the same, and only when it ends does the loser drop to the dying shade.
# A unit that has not noticed you is the quietest thing on the field; it is not a threat yet.
graphic.state.unaware=-0.4
graphic.state.windingUp=0.85
graphic.state.airborne=0.5
graphic.state.grappling=-0.3
# A shoved unit brightens instead of darkening: it is still a threat, just off balance.
graphic.state.staggered=0.35
graphic.state.dying=-0.7

# How the view follows the things it is watching. Rendering only: nothing here can change what the
# simulation does, and aim is a direction rather than a distance, so zooming out never adds range.
# deadZone is how far a target may drift before the view follows it at all - without one the view
# jitters on every step. smoothing and zoomSmoothing are how fast it closes on its goal, per second,
# eased so the feel is the same at 30 and 144 frames per second. lookAhead leans the view the way the
# player is walking (never the way they are aiming - that would chase its own tail).
#
# leadSmoothing is how fast that lean builds and decays, and it must stay well below smoothing. Taking
# the movement input raw makes the view snap the whole lookAhead distance the moment you reverse, and
# tapping left and right then shakes it badly. Easing it over about half a second means a flick
# averages out to nothing while a sustained run still earns the full lean. If the view still feels
# twitchy, lower this before touching anything else; if it feels sluggish to turn around, raise it.
graphic.camera.deadZone=6
graphic.camera.smoothing=8
graphic.camera.lookAhead=14
graphic.camera.leadSmoothing=2
graphic.camera.zoomSmoothing=7

# The two views Tab swaps between, as multiples of the viewport above. farZoom is also the widest the
# camera will ever go to frame several players at once; past that it stops rather than pulling out
# forever. fitMargin is the slack left around them when it does.
graphic.camera.nearZoom=1
graphic.camera.farZoom=2.2
graphic.camera.fitMargin=1.25

# What the view does about something violent going off near the player. The simulation says how hard
# the ground moved, in world units, and how far it is felt; everything here is the look of it, so
# turning shakeScale down to zero removes the effect and changes nothing about what the game does.
# There is deliberately no separate dial for zoom: the offset is in world units, so the pulled-back
# view divides it by the zoom on its own and a blast that rocks the close view is a twitch in the
# overview. shakeCycles is how many times the view swings over a whole shake - more reads as a rattle,
# fewer as a shove.
graphic.camera.shakeScale=1
graphic.camera.shakeCycles=3

# The mark drawn inside a unit that is filling up towards something - an enemy part-way to evolving
# (Appearance.charge). Scale is how much of the body the mark covers when it is full; tint is how far
# it is shifted toward white, so it reads as a core rather than as a second unit.
graphic.charge.scale=0.55
graphic.charge.tint=0.8

# The spoke drawn out of a unit's centre showing which way it is pointing (Appearance.facing). This
# is a tell, not decoration: a trooper engages what is inside its arc, so its front has to be
# visible. Length is a multiple of the body's radius and is above one on purpose - a spoke that stops
# at the rim disappears into the circle at small sizes.
graphic.facing.length=1.35
graphic.facing.width=0.34
graphic.facing.tint=0.55

# The ring drawn round a unit that is acting on an order rather than on its own judgement. Outline
# rather than fill, so it never hides the unit inside it. This is how the player learns how far his
# voice actually carries instead of guessing at it.
graphic.order.scale=1.55
graphic.order.tint=0.75

# Simulation tunables. Changing anything here changes what the game does.
sim.seed=20260906
sim.tickSeconds=0.0166666667
sim.maxTicksPerFrame=5

# The rectangle a level is played inside, in world units.
sim.arena.width=160
sim.arena.height=90

# The player-controlled unit.
sim.commander.radius=2.0
sim.commander.speed=28

# The units that chase it. Slower than the commander on purpose.
sim.enemy.radius=1.8
sim.enemy.speed=14
sim.enemy.count=12

# The commander's gun.
sim.weapon.cooldownSeconds=0.18
sim.weapon.projectileSpeed=70
sim.weapon.projectileRadius=0.6

# Static circles that block movement and projectiles.
sim.obstacle.radius=3.5
sim.obstacle.count=8

# How many times per tick overlaps and arena bounds are resolved together.
sim.collision.passes=3

# Simulation tunables. Changing anything here changes what the game does.
sim.seed=20260906
sim.tickSeconds=0.0166666667
sim.maxTicksPerFrame=5

# The grid a level is laid out on. The arena is exactly what this adds up to - 32 x 18 tiles of 5
# world units is the 160 x 90 the game has always been played in - so a map and an arena can never
# disagree about how big a level is. A tile is roughly one unit wide: a brute is 5.2 across, so it
# needs two tiles of clearance to get through a gap, which is what makes a corridor read deliberately.
# Regions are the areas the ground is partitioned into; they are tinted apart so a level reads as
# places rather than as one flat sheet.
sim.map.cols=32
sim.map.rows=18
sim.map.tileSize=5
sim.map.regions=6

# The player-controlled unit.
# ---------------------------------------------------------------------------------------------
# PACE. Everything that moves was slowed by roughly a third on 2026-09-10, and the guns' rate of
# fire with it, because the game read as too fast to think in. The ratios between units were kept:
# the commander still outruns a trooper, a trooper outruns a grunt, and a brute is the slow one.
# If it needs another pass, scale this whole block rather than one number - a single unit retuned
# on its own is how a chase stops working.
# ---------------------------------------------------------------------------------------------
sim.commander.radius=2.0
sim.commander.speed=19
sim.commander.health=100
# How long the body lies on the field after a killing blow, before it is taken away. The window the
# dying animation will play in; the respawn countdown starts after it, not alongside it.
sim.commander.deathThroesSeconds=1.5
sim.commander.respawnDelaySeconds=3
# Where it comes back: this far in from the left edge, vertically centred.
sim.commander.respawnMargin=6
sim.commander.respawnInvulnerableSeconds=2

# The squad. A trooper is not a strain: it has no evolution, no leap and no contact damage, so it
# gets its own block rather than a sim.unit.* one. Speed is below the commander's on purpose - a
# squad following him strings out behind rather than crowding him.
sim.trooper.radius=1.6
sim.trooper.speed=13.5
sim.trooper.health=100
sim.trooper.deathThroesSeconds=1
# How many spawn with him. Scenarios usually override this; it is here so a build has a squad.
sim.trooper.squadSize=4
sim.trooper.avoidance.enabled=true
sim.trooper.avoidance.scanRange=7
sim.trooper.avoidance.lookaheadSeconds=0.35
sim.trooper.avoidance.weight=1.6
# How much heading for the objective beats looking around, in [0, 1]. THIS IS THE GAME'S PACE DIAL.
# One is a beeline; zero is a squad that weaves so hard it barely advances. It is deliberately not a
# speed - "forward" is the order that changes speed, and one dial doing both would hide that order.
sim.trooper.urgency=0.55
# How far off the route a full lean carries a trooper, and how long a lean lasts before it sweeps
# back. The two seconds are a range so a squad does not sweep in lockstep, which reads as a chorus
# line rather than as men each watching their own arc.
sim.trooper.scanSpread=0.8
sim.trooper.scanMinSeconds=0.7
sim.trooper.scanMaxSeconds=1.6
sim.trooper.arriveRadius=3
# What a trooper can notice. This is the unit G0015 exists for: it declares all three tests, where an
# alien declares only a range. arcDegrees is the cone it engages within - the facing spoke on screen
# is what makes that arc something the player can read. requiresClearLine stops it firing into rock.
sim.trooper.perception.alwaysAggressive=false
sim.trooper.perception.losesInterest=true
sim.trooper.perception.detectionRange=22
sim.trooper.perception.loseRange=28
sim.trooper.perception.secondaryRange=0
sim.trooper.perception.arcDegrees=100
sim.trooper.perception.requiresClearLine=true
# How far the commander's voice carries. This is the whole of who hears an order (G0017): wide enough
# that a squad walking with him all hear it, short enough that a stray one has to be gone and fetched.
sim.trooper.orderRadius=22
# What "forward" buys: a distance rather than a countdown, so a squad pinned by a fight still gets
# its full push once the shooting stops.
sim.trooper.forwardDistance=40
sim.trooper.forwardSpeedFactor=1.6
# How close a following trooper tries to stay. Loose on purpose - a squad glued to him is a squad he
# cannot see past.
sim.trooper.followDistance=7
# How far from the post the squad roams on a level that names one. Its own patch, and the answer to
# "what does a squad do on a level whose whole instruction is stay here": with nothing in front of
# them they stay around the thing they were told to hold rather than wandering off across the level.
# It costs the player nothing - "forward" still pushes the line out past it, and a fight outranks
# both. Levels with no post are unaffected: there, roaming is still the whole map.
sim.trooper.patchRadius=30

# ---- AI CHANCES --------------------------------------------------------------------------------
# Everything the AI does only SOMETIMES, in one block. One key per constant in AiChance, and that
# enum is the index: if a unit does something occasionally, it has a line here, so the conditional
# behaviour in the game can be read off one list instead of found by searching the systems.
#
# Every number is a chance PER SECOND OF OPPORTUNITY - the clock runs only while the thing is
# actually possible - never per tick. Zero switches a behaviour off and draws no random number at
# all, so turning one off cannot reshuffle what the others roll.
#
# A strain that needs its own number overrides it under sim.unit.<kind>.chance.<name>; only the
# numbers it differs on need restating.
#
# The sweep is very small on purpose: answering a leap is the commander's moment and the whole
# reason the clinch rule exists (G0013). Aiding the commander is far likelier than aiding a trooper
# because a man who has to choose between two bodies on the ground should be seen to choose.
sim.ai.chance.swing_at_a_leap=0.5
sim.ai.chance.bite_a_barrel=0.8
sim.ai.chance.aid_a_trooper=0.4
sim.ai.chance.aid_the_commander=1.5
# High: a gun nobody is on is a gun the level might as well not have put down. It is only ever rolled
# with something already inside that gun's reach, so it is not a man wandering off to sit down.
sim.ai.chance.man_a_turret=2

# Where the player's side starts: a rectangle of tiles on the left, centred vertically. Units are
# jittered inside those tiles and never stood at a tile centre (G0009). A stand-in until generated
# map fragments can say where their own entrances are.
sim.spawn.col=1
sim.spawn.width=2
sim.spawn.height=5

# The strains that chase it. Every strain is one block under sim.unit.<kind>, with the same keys;
# adding a strain is a constant in UnitKind, a default in SimConfig, and a block here.
# The basic strain. Slower than the commander on purpose.
sim.unit.grunt.radius=1.8
sim.unit.grunt.speed=7.5
sim.unit.grunt.count=12
sim.unit.grunt.health=100
# One touch kills a commander outright at these numbers.
sim.unit.grunt.contactDamage=100
# How wide an arc in front of it its claws reach into, centred on the way it is going. Below 360, so
# there is a blind spot behind it and walking into the back of something that has not turned round is
# no longer instant death - which read as the game cheating, because nothing on screen warned you.
# GENEROUS ON PURPOSE: a lunging creature is not precise, and a blind spot narrow enough to rely on
# would turn every fight into a dance round behind things. Set it to 360 for a strain that bites
# anything it touches.
sim.unit.grunt.attackArcDegrees=200
sim.unit.grunt.attackCooldownSeconds=1.3
sim.unit.grunt.victimInvulnerableSeconds=0.6
# How long a landed blow holds both the enemy and its victim still. Matches the commander's death
# throes above, so the kill reads as one beat rather than two - change them together or it will not.
sim.unit.grunt.lockSeconds=1.5
# How long its body lies there afterwards. Matches the commander's melee lock, so a lethal answer to
# a leap holds the two of them together for exactly as long as the commander is held by it - which is
# the clinch. A dying body becomes an obstacle: solid, and immovable, so it stays where it fell.
sim.unit.grunt.deathThroesSeconds=1.0
# How much it must consume before it turns into the next strain. What it turns into is structure
# rather than tuning and lives in SimConfig, not here.
sim.unit.grunt.feedToEvolve=3

# What it can notice. alwaysAggressive is the switch that gives back the standing fight every arena
# built before detection existed was tuned around: on, it hunts from the first tick and the two ranges
# below are ignored. loseRange is deliberately wider than detectionRange - one range would flicker a
# unit standing exactly on the boundary between hunting and idling every tick - but only for something
# that can lose interest at all. Giving up leaves a unit idling where it stood when it gave up, not
# walking back to where it spawned - its patch follows it while it has something better to do. Him
# going down releases everything regardless, whatever these say.
sim.unit.grunt.perception.alwaysAggressive=true
sim.unit.grunt.perception.losesInterest=true
sim.unit.grunt.perception.detectionRange=30
sim.unit.grunt.perception.loseRange=45

# How it passes the time before it has noticed anybody: pick a spot in its patch, walk there slowly,
# stand a moment, pick again. The patch is centred where the unit was spawned, so losing the commander
# means walking home. speedFactor is well below one on purpose - an ambling unit must not read like
# one that has seen you. waypointTimeoutSeconds is what stops a unit wedged behind a rock leaning into
# it for the rest of the level.
sim.unit.grunt.wander.enabled=true
sim.unit.grunt.wander.radius=12
sim.unit.grunt.wander.speedFactor=0.45
sim.unit.grunt.wander.arriveRadius=1.5
sim.unit.grunt.wander.pauseMinSeconds=0.4
sim.unit.grunt.wander.pauseMaxSeconds=1.4
sim.unit.grunt.wander.waypointTimeoutSeconds=4

# How far ahead it looks for things in its way. Both it and the hazard are projected forward by
# lookaheadSeconds before the gap is measured, which is the whole of what makes the avoidance
# predictive rather than a reaction to a collision that already happened. It never steers around the
# other side - that is what it is trying to reach. weight is how heavily a dangerous direction counts
# against how much it wanted to go that way; far above one and it flinches at everything and never
# arrives.
sim.unit.grunt.avoidance.enabled=true
sim.unit.grunt.avoidance.scanRange=7
sim.unit.grunt.avoidance.lookaheadSeconds=0.35
sim.unit.grunt.avoidance.weight=1.6

# How an enemy closes the last of the distance. The hesitation is the only part of the leap the
# player gets to answer, so it is short: read the tell, or wear it.
sim.unit.grunt.leap.enabled=true
sim.unit.grunt.leap.triggerRange=16
sim.unit.grunt.leap.speed=29
sim.unit.grunt.leap.airborneSeconds=0.28
sim.unit.grunt.leap.sequenceLength=2
sim.unit.grunt.leap.betweenSeconds=0.18
sim.unit.grunt.leap.cooldownSeconds=1.6
sim.unit.grunt.leap.hesitationMinSeconds=0.08
sim.unit.grunt.leap.hesitationMaxSeconds=0.22

# The fast one. Smaller and thinner than a grunt, and it notices you from most of the way across a
# level - it is the strain that comes to find you rather than the one you walk into. What makes it a
# different problem is its line rather than its speed: it weaves as it closes and steps aside from
# shots it sees coming, so it is a target you have to lead.
sim.unit.runner.radius=1.4
sim.unit.runner.speed=9.5
sim.unit.runner.count=6
sim.unit.runner.health=60
sim.unit.runner.contactDamage=100
sim.unit.runner.attackArcDegrees=200
sim.unit.runner.attackCooldownSeconds=1.1
sim.unit.runner.victimInvulnerableSeconds=0.6
sim.unit.runner.lockSeconds=1.5
sim.unit.runner.deathThroesSeconds=0.8
sim.unit.runner.feedToEvolve=0

# Twice a grunt's reach. This is the number that makes it the strain that finds you.
sim.unit.runner.perception.alwaysAggressive=true
sim.unit.runner.perception.losesInterest=true
sim.unit.runner.perception.detectionRange=60
sim.unit.runner.perception.loseRange=80

sim.unit.runner.wander.enabled=true
sim.unit.runner.wander.radius=16
sim.unit.runner.wander.speedFactor=0.5
sim.unit.runner.wander.arriveRadius=1.5
sim.unit.runner.wander.pauseMinSeconds=0.3
sim.unit.runner.wander.pauseMaxSeconds=1.0
sim.unit.runner.wander.waypointTimeoutSeconds=4

sim.unit.runner.avoidance.enabled=true
sim.unit.runner.avoidance.scanRange=7
sim.unit.runner.avoidance.lookaheadSeconds=0.35
sim.unit.runner.avoidance.weight=1.6

# A shorter, faster dash than a grunt's, with barely any wind-up: it is already on you.
sim.unit.runner.leap.enabled=true
sim.unit.runner.leap.triggerRange=14
sim.unit.runner.leap.speed=34
sim.unit.runner.leap.airborneSeconds=0.24
sim.unit.runner.leap.sequenceLength=2
sim.unit.runner.leap.betweenSeconds=0.14
sim.unit.runner.leap.cooldownSeconds=1.2
sim.unit.runner.leap.hesitationMinSeconds=0.06
sim.unit.runner.leap.hesitationMaxSeconds=0.16

# How hard it refuses to walk straight at you. amplitude is how far it leans off its course, as a
# fraction of forwards; wavelength is how far it travels through one full left-right-left. Both are
# functions of GROUND COVERED rather than of the clock, so a runner held up by a wall does not weave
# on the spot and a slowed one does not weave faster. Nothing here is rolled (G0012).
sim.unit.runner.weave.enabled=true
sim.unit.runner.weave.amplitude=0.55
sim.unit.runner.weave.wavelength=9

# It steps aside from a shot it sees coming, exactly as a rabbit does - the same definition and the
# same system. reactionRange is what decides whether it has time to think about a shot from across
# the arena; commitSeconds is what makes a second shot the answer to the first.
sim.unit.runner.dodge.enabled=true
sim.unit.runner.dodge.reactionRange=22
sim.unit.runner.dodge.speed=26
sim.unit.runner.dodge.durationSeconds=0.26
sim.unit.runner.dodge.commitSeconds=0.7
sim.unit.runner.dodge.margin=1.4

# The heavy units. Slow, tough, and the reason the hand strike needs a stun: a brute survives one.
sim.unit.brute.radius=2.6
sim.unit.brute.speed=4.75
sim.unit.brute.count=3
sim.unit.brute.health=250
sim.unit.brute.contactDamage=100
# The same arc as a grunt. A brute turns more slowly than one, which is punishment enough.
sim.unit.brute.attackArcDegrees=200
sim.unit.brute.attackCooldownSeconds=1.5
sim.unit.brute.victimInvulnerableSeconds=0.6
sim.unit.brute.lockSeconds=1.5
sim.unit.brute.deathThroesSeconds=1.0
# Zero: a brute has nowhere further to go by eating.
sim.unit.brute.feedToEvolve=0

# Heavier and duller: it notices later than a grunt and gives up sooner.
sim.unit.brute.perception.alwaysAggressive=true
sim.unit.brute.perception.losesInterest=true
sim.unit.brute.perception.detectionRange=24
sim.unit.brute.perception.loseRange=36

# A brute keeps a smaller patch and rests in it longer. Heavy things do not pace.
sim.unit.brute.wander.enabled=true
sim.unit.brute.wander.radius=8
sim.unit.brute.wander.speedFactor=0.35
sim.unit.brute.wander.arriveRadius=2
sim.unit.brute.wander.pauseMinSeconds=0.8
sim.unit.brute.wander.pauseMaxSeconds=2.4
sim.unit.brute.wander.waypointTimeoutSeconds=5

# A brute is wider and slower to turn, so it looks further ahead and commits earlier.
sim.unit.brute.avoidance.enabled=true
sim.unit.brute.avoidance.scanRange=9
sim.unit.brute.avoidance.lookaheadSeconds=0.5
sim.unit.brute.avoidance.weight=1.3

# A brute telegraphs harder and travels further. Its extra health would be unfair otherwise.
sim.unit.brute.leap.enabled=true
sim.unit.brute.leap.triggerRange=22
sim.unit.brute.leap.speed=24
sim.unit.brute.leap.airborneSeconds=0.42
sim.unit.brute.leap.sequenceLength=3
sim.unit.brute.leap.betweenSeconds=0.26
sim.unit.brute.leap.cooldownSeconds=2.4
sim.unit.brute.leap.hesitationMinSeconds=0.18
sim.unit.brute.leap.hesitationMaxSeconds=0.42

# The shooting unit. Purple, and a different problem from the two above: it holds ground at a
# distance instead of coming at you, so it has to be gone and dealt with rather than survived.
# Fragile - two sidearm rounds - because a shooter that also soaked damage would just be a wall.
sim.unit.spitter.radius=1.7
sim.unit.spitter.speed=6
sim.unit.spitter.count=4
sim.unit.spitter.health=70
sim.unit.spitter.contactDamage=100
sim.unit.spitter.attackArcDegrees=200
sim.unit.spitter.attackCooldownSeconds=1.3
sim.unit.spitter.victimInvulnerableSeconds=0.6
sim.unit.spitter.lockSeconds=1.5
sim.unit.spitter.deathThroesSeconds=1.0
sim.unit.spitter.feedToEvolve=0

# It notices at a grunt's range and shoots at well under half of it. The gap between the two is the
# ground you cross while it watches you come.
#
# NOT always aggressive, unlike everything that chases. It has to notice you first, and that is what
# gives it a life before the fight: a unit that has noticed nobody ambles and goes for what it can
# eat, and the commander outranks food absolutely, so a spitter that hunted from the first tick could
# never walk over to a barrel. Once it has noticed you it holds its ground and shoots, which is the
# behaviour the always-aggressive switch was hiding the front half of.
sim.unit.spitter.perception.alwaysAggressive=false
sim.unit.spitter.perception.losesInterest=true
sim.unit.spitter.perception.detectionRange=30
sim.unit.spitter.perception.loseRange=45

# A SHOOTER AMBLES WHILE IT FIGHTS. It will not follow you, so with nothing else driving its legs it
# stood perfectly still for a whole fight and read as a turret. It keeps ambling inside this patch
# while it shoots - and the patch is what "working the ground" looks like, so it is wider and busier
# than a shuffle: short pauses, a fair walk between waypoints, and a new bearing to look along every
# time it picks one. It must stay inside the gap between closeRange and range above, or it would
# amble out of its own reach between shots.
sim.unit.spitter.wander.enabled=true
sim.unit.spitter.wander.radius=7
sim.unit.spitter.wander.speedFactor=0.4
sim.unit.spitter.wander.arriveRadius=0.8
sim.unit.spitter.wander.pauseMinSeconds=0.2
sim.unit.spitter.wander.pauseMaxSeconds=0.7
sim.unit.spitter.wander.waypointTimeoutSeconds=3

sim.unit.spitter.avoidance.enabled=true
sim.unit.spitter.avoidance.scanRange=7
sim.unit.spitter.avoidance.lookaheadSeconds=0.35
sim.unit.spitter.avoidance.weight=1.6

# It does not leap. Nothing that keeps its distance also throws itself at you.
sim.unit.spitter.leap.enabled=false

# How it shoots. The cone is the whole mechanic: at fourteen degrees a shot meant for the commander
# still reaches a man standing beside him, so a firing line hurts a squad rather than one man, and
# no single shot is ever quite aimed. haltsToFire is what makes it hold a line instead of closing.
sim.unit.spitter.ranged.enabled=true
sim.unit.spitter.ranged.range=18
sim.unit.spitter.ranged.spreadDegrees=14
sim.unit.spitter.ranged.haltsToFire=true
# It NEVER advances on what it is hunting. A spitter is a place on the field you have to get past,
# not a thing that comes for you - you are driven off and never followed, which is a different
# problem from everything else on the alien side and the reason the two want different answers.
sim.unit.spitter.ranged.holdsGround=true
# Its field of view, and how fast it swings onto you. Wider than a trooper's hundred degrees, because
# a creature built around a gun should be harder to get behind than a man is - but not all round, so
# stepping past one is a real move. turnRate is a fraction of the remaining angle per second: at
# three it has covered most of a wide swing inside a second, which is long enough to feel and short
# enough that flanking one is a moment rather than a strategy.
sim.unit.spitter.ranged.arcDegrees=150
sim.unit.spitter.ranged.turnRate=3
# THE DISTANCE IT WANTS TO BE AT, and therefore the distance it walks to once it has noticed you.
# Inside it the thing fires faster and straighter by the same factor - it has you at point-blank
# range, and that is one idea rather than two. Half its firing range, so a spitter that has taken its
# position is dangerous and you get half its reach as warning. It has to stay comfortably inside the
# range above, or the amble below carries it back out of its own reach between shots.
sim.unit.spitter.ranged.closeRange=9
sim.unit.spitter.ranged.closeFactor=0.6
# How long it takes to walk its aim in. The first shot is the wild one and by the third the cone is
# down to a third of what it was, so standing in a spitter's sights is the mistake rather than being
# shot at once. Break its line, leave its range or step out of its arc and it starts again.
sim.unit.spitter.ranged.settleShots=3
sim.unit.spitter.ranged.settledSpreadFactor=0.35
# It is far hungrier for a barrel than anything that closes and claws, because a barrel is what turns
# its gun into an artillery piece. Standing one next to a barrel is a decision a level makes.
sim.unit.spitter.chance.bite_a_barrel=8

# Every gun, one block per kind under sim.weapon.<kind>. The sidearm is what the commander starts
# and respawns with; anything else is found on the field and lost with him. What a gun's shots look
# like is not a number to balance and stays in SimConfig.
# The sidearm: two hits kill a grunt.
sim.weapon.sidearm.cooldownSeconds=0.30
sim.weapon.sidearm.projectileSpeed=42
sim.weapon.sidearm.projectileRadius=0.6
sim.weapon.sidearm.damage=50

# The railgun: slow enough to punish a miss, heavy enough to drop a brute in one.
# It also runs hot, which is the whole of what stops a found gun being a straight upgrade: five
# shots and it takes itself away for five seconds. coolPerSecond is deliberately below what the
# cooldown gives back between shots, or the bar could never fill at all.
sim.weapon.railgun.cooldownSeconds=1.2
sim.weapon.railgun.projectileSpeed=85
sim.weapon.railgun.projectileRadius=1.0
sim.weapon.railgun.damage=300
sim.weapon.railgun.heat.perShot=0.34
sim.weapon.railgun.heat.coolPerSecond=0.12
sim.weapon.railgun.heat.resumeBelow=0.4

# What a spitter fires. Slow in the air on purpose - far slower than anything of the player's - so a
# shot is something you watch coming and step out of rather than something that has already hit you.
# ONE HUNDRED IS ONE SHOT: a spit empties any man's bar, so being hit at all is being off your feet.
# Raised from fifty on 2026-09-17. Two shots read as a wall to be worn down rather than a line to be
# respected, and the casualty rule is what makes one shot survivable - he goes down with a clock
# running instead of dying, and somebody can come for him. It one-shots a trooper too, which is what
# makes a firing line thin a squad rather than annoy it.
sim.weapon.spit.cooldownSeconds=1.1
sim.weapon.spit.projectileSpeed=30
sim.weapon.spit.projectileRadius=0.7
sim.weapon.spit.damage=100

# What a spitter fires once it has eaten a barrel. The same slow shot, and it goes off where it stops
# - on whatever it hits, or at the edge of the arena. blastRadius is small against the barrel's own
# eleven: the point is that the ground BESIDE a shot stops being safe, not that one shot ends the
# fight. Any gun with a blastRadius above zero explodes; every other gun in this file leaves it out.
sim.weapon.charged_spit.cooldownSeconds=1.1
sim.weapon.charged_spit.projectileSpeed=30
sim.weapon.charged_spit.projectileRadius=0.8
sim.weapon.charged_spit.damage=100
sim.weapon.charged_spit.blastRadius=5

# What a turret fires. The opposite trade to every gun a man carries: a third of a sidearm's damage,
# three times its rate, and a shot that crosses the arena faster than anything can walk out of the
# way. What it buys you is volume from a place you have to stand still in. muzzleOffset is what makes
# it read as a twin mount - shots leave from alternate sides of the line of fire, and nothing else in
# this file names one, which is what keeps it a property of the gun rather than of the turret.
sim.weapon.turret_gun.cooldownSeconds=0.16
sim.weapon.turret_gun.projectileSpeed=150
sim.weapon.turret_gun.projectileRadius=0.45
sim.weapon.turret_gun.damage=30
sim.weapon.turret_gun.muzzleOffset=0.9
# About three and a half seconds of holding the trigger down, then a second of nothing. resumeBelow is
# what makes the stop a cost rather than a stutter: it comes back at six tenths, not at full.
# RETUNED WITH THE RATE OF FIRE, 2026-09-18. perShot is a fraction per SHOT, so halving the rate of
# fire doubles how long the bar takes to fill unless this moves with it - at the old 0.055 the gun
# could no longer overheat at all, because cooling outran it.
sim.weapon.turret_gun.heat.perShot=0.1
sim.weapon.turret_gun.heat.coolPerSecond=0.35
sim.weapon.turret_gun.heat.resumeBelow=0.6

# The commander's hand strike: short, fast, and lethal to an enemy but not to a brute. Every value
# here is what will differ between melee weapons - a heavier one winds up, sweeps wider and shoves
# harder, and no code changes.
sim.melee.cooldownSeconds=0.6
sim.melee.windupSeconds=0
sim.melee.activeSeconds=0.12
# Short on purpose. A commander is 2.0 across the middle and an enemy 1.8, so they touch at 3.8 apart;
# this reaches 4.4, which means the sweep cannot land until whatever it is answering is all but on
# him. The window the player gets is activeSeconds above - the sweep lingers and the leap flies into
# it - so this number decides when he must press, not how long he has to press it.
sim.melee.reach=1.2
sim.melee.radius=1.4
sim.melee.damage=120
sim.melee.arcDegrees=180
# What a connecting sweep costs. It is spent only when the sweep kills - then both of them are held
# and tangled together. A target that survives is staggered for this long and the commander is not
# held at all: he shoved something away rather than grappling with it, and is free to follow up.
# Spent only on a target that had already committed to attacking - answering a leap tangles the two of
# them together, and swatting something that was only walking costs him nothing but the cooldown.
sim.melee.locksCommittedOnly=true
sim.melee.lockSeconds=1.0
# How a lethal answer to a leap finishes. The body keeps going along the line it died on, decaying,
# and the solver does the rest: a corpse is immovable and the commander is not, so the body arriving
# shoves him back and the two travel the last of it together. It must carry further than the sweep
# out-reaches a touch - about 0.6 units at these numbers - or the clinch ends with a gap in it.
sim.melee.clinchCarrySpeed=14
sim.melee.clinchCarryDecay=100
sim.melee.knockbackSpeed=45
sim.melee.knockbackDecay=120

# What an explosion does, wherever it came from. The radius is deliberately not here: a grenade and a
# barrel make blasts of different sizes and each names its own. Damage is far above any unit's health
# on purpose - a blast is fatal inside one circle and harmless outside it, and a number that left a
# brute standing would quietly turn one readable rule into a damage curve the player cannot see.
# durationSeconds is only the flash; a blast is dangerous for exactly one tick, on the tick it appears.
sim.blast.damage=1000
sim.blast.durationSeconds=0.25
# How hard the ground moves, in world units, and how far past the killing circle that is felt. The
# simulation says how violent the event was and stops there; what the view does about it is entirely
# the client's, under graphic.camera.shake* - which is why a number here is a distance rather than a
# number of pixels. The reach is well over one on purpose: hearing an explosion you were not close
# enough to be killed by is most of what tells you one went off where you were not looking.
sim.blast.shakeStrength=3
sim.blast.shakeRadiusFactor=2.5

# Things lying on the field for the first unit that touches them. Only the size is here: what a
# pickup gives each side is structure rather than tuning and lives in SimConfig, next to which strain
# grows into which. The number that balances an eating evolution is sim.unit.<kind>.feedToEvolve.
sim.pickup.mushroom.radius=0.9
sim.pickup.flower.radius=0.9
# Bigger than the growths: a body on the ground reads as a body, not as a dot.
sim.pickup.frozen_trooper.radius=1.6
# Small: a rabbit is a dot with legs, and a hard target on purpose.
sim.pickup.rabbit.radius=0.8
sim.pickup.armoury.radius=1.2
# A barrel is a target, not cover. Small, and standing in the open.
sim.pickup.barrel.radius=1.0

# The rabbit: alien food that walks. Taking one works exactly like any other pickup - what each side
# gets is in SimConfig, and the commander is offered nothing, so his only interest in one is denying
# it. These are the numbers for the half of it that moves.
sim.rabbit.speed=15
sim.rabbit.health=1
sim.rabbit.deathThroesSeconds=0.4
sim.rabbit.wander.enabled=true
sim.rabbit.wander.radius=18
sim.rabbit.wander.speedFactor=0.7
sim.rabbit.wander.arriveRadius=1
sim.rabbit.wander.pauseMinSeconds=0.3
sim.rabbit.wander.pauseMaxSeconds=1.1
sim.rabbit.wander.waypointTimeoutSeconds=3
# The dodge is deterministic on purpose: perpendicular to the shot, to the side it is already on, the
# same every time, so a player can learn to lead it. commitSeconds is what keeps that from making it
# trivial - once it has broken one way it cannot answer anything else until this runs out, so the
# counter to a dodge is a second shot rather than a perfect first one. margin is how wide of it a shot
# may pass and still count as coming at it; at zero it would only dodge shots that were dead on, which
# reads as clairvoyance rather than as nerves.
sim.rabbit.dodge.enabled=true
sim.rabbit.dodge.reactionRange=26
sim.rabbit.dodge.speed=32
sim.rabbit.dodge.durationSeconds=0.32
sim.rabbit.dodge.commitSeconds=0.9
sim.rabbit.dodge.margin=1.2
# Rabbits are content: a scenario spawns them, so there is no count here.

# What the commander throws. range is a DISTANCE and not a countdown: a bounce changes a grenade's
# direction and never its speed, so every throw covers the same ground however many walls it comes
# off - which is what makes banking one off a corner worth learning. It is spent along the aim
# direction and never towards the aim point, so pulling the view back with Tab can never reach
# further. range is comfortably longer than blastRadius, or every throw would be suicide; the two
# together are what decide how close the commander has to be standing when it goes off.
sim.grenade.cooldownSeconds=1.2
sim.grenade.speed=38
sim.grenade.range=34
sim.grenade.radius=0.55
sim.grenade.blastRadius=12

# The explosive barrel. It is a pickup rather than an obstacle on purpose: avoidance steers a unit
# around anything solid EXCEPT a pickup, so as an obstacle the aliens would carefully walk round it.
# Health is one because a barrel is a trigger standing in the open, not something to grind down -
# anything that touches it at all sets it off. blastRadius is the number that decides whether one is
# scenery or a reason to move: it is well over five times the barrel itself.
sim.barrel.health=1
sim.barrel.blastRadius=11
# How wide it goes off when something BIT INTO it rather than shooting it. Far smaller, on purpose:
# whatever set it off that way had its mouth on the thing and takes most of the blast itself, so a
# barrel the aliens blunder into is a gift rather than a disaster. Shooting one is still the full
# circle above, which is what keeps a barrel worth aiming at instead of worth waiting beside.
sim.barrel.bittenBlastRadius=4

# ---- CASUALTY ----------------------------------------------------------------------------------
# What happens to a man shot off his feet. Gunfire and blasts leave a casualty; claws, a sweep and a
# leap kill outright. The bleed-out is the window the player has to reach him, so it is really a
# distance: at the commander's 19 units per second, eight seconds is most of the way across a level
# and back. Shorten it and only men who go down beside you are worth going for.
sim.casualty.bleedOutSeconds=8
# Under a second standing still in the open. Brought down from a second and a half on 2026-09-13:
# the price was reading as a commitment the player could not afford to make at all, so men were being
# left rather than fetched. Still long enough that where you do it matters, which is the whole point
# of the number - short enough is not the same as free.
sim.casualty.stabiliseSeconds=0.8
# He gets up hurt. Picking a man up is not the same as getting him out.
sim.casualty.reviveHealthFraction=0.4
sim.casualty.reviveInvulnerableSeconds=1.0
# How fast his clock runs while he is being hauled. Zero stops it: crossing the ground with him over
# your shoulder is free, and what you pay for it is the far longer patch-up below. Raise it if
# hauling turns out to be the answer to everything.
sim.casualty.draggedBleedFactor=0
# What having been hauled costs at the other end. Above one, so taking a man somewhere quiet is a
# decision against treating him where he fell rather than a strictly better one - but brought down
# from two and a half with the number above, or hauling would have been the branch nobody takes.
sim.casualty.hauledStabiliseFactor=1.6

# ---- ACTIONS -----------------------------------------------------------------------------------
# How close the commander must be, surface to surface, to do anything with his hands. One number for
# every action there is: learning one distance should be enough.
sim.action.reach=2.5
# Hauling. He backs away and nothing else: the part of a step that points at what he is dragging is
# thrown away, the sideways part is kept at a third, and what is left is slowed to well under half
# his pace. That, and having no hand free for the gun, is the whole price of not leaving a man.
sim.action.dragSpeedFactor=0.45
sim.action.dragLateralFactor=0.35
sim.action.dragGap=0.4

# The gun on a mount. health is three times a trooper's: a turret is somewhere a level tells you to
# stand, and the other side should have to work to take it away. turnRate is a fraction of the angle
# left per second rather than degrees - it is the same shape as a spitter's, so the two read alike -
# and firingTurnFactor is the number that makes holding the trigger cost you the ability to track,
# which is the whole of what a mount trades for its rate of fire. blastRadius is deliberately far
# short of a barrel's eleven: losing one is an event, not a hole in the level.
sim.turret.radius=2.2
sim.turret.health=300
sim.turret.blastRadius=6
sim.turret.turnRate=2.5
sim.turret.firingTurnFactor=0.3
# What it is worth to a trooper. range is far past a man's own sight - on a gun he answers things that
# are still crossing the ground towards the squad. crewRadius is how far he will divert to get on one,
# and quietSeconds is how long he will sit on it with nothing in reach before he goes back to the
# squad: a man on a quiet gun is a man missing from it.
sim.turret.range=55
sim.turret.crewRadius=26
sim.turret.quietSeconds=6

# Static circles that block movement and projectiles.
sim.obstacle.radius=3.5
sim.obstacle.count=8

# How many times per tick overlaps and arena bounds are resolved together.
sim.collision.passes=3

# What it takes to hold a control point. captureSeconds is the number that decides whether a point is
# a formality or a fight: it is the window the level gets to answer the squad with. aggroRadius is
# much longer than a unit's own detection range on purpose - taking a point is meant to bring the
# level to you rather than let you take it quietly, so this reaches well past what a grunt could
# have noticed for itself.
sim.controlPoint.radius=6
sim.controlPoint.captureSeconds=5
sim.controlPoint.aggroRadius=48

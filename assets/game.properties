# Simulation tunables. Changing anything here changes what the game does.
#
# This file is the whole of SimConfig: every key is a record component, read by ConfigBinder by name.
# A key no record has, or a value no key gives, fails the build (ShippedConfigTest) - so a typo is an
# error, not a silent fallback. Values: numbers and true/false as written; a kind of thing by its name
# in lower case (look=grunt, gun=spit), and "none" where there may be nothing; a grant as its name and
# argument (feed 1, mutate brute, arm railgun, reinforce 3, detonate, none). A whole ability block the
# file leaves out - no sim.unit.grunt.ranged.* at all - is that ability switched off.
sim.seed=20260906
sim.tickSeconds=0.0166666667
sim.maxTicksPerFrame=5

# The grid a level is laid out on. The arena is exactly what this adds up to - 32 x 18 tiles of 5
# world units is the 160 x 90 the game has always been played in - so a map and an arena can never
# disagree about how big a level is. A tile is roughly one unit wide: a brute is 5.2 across, so it
# needs two tiles of clearance to get through a gap, which is what makes a corridor read deliberately.
# Regions are the areas the ground is partitioned into; they are tinted apart so a level reads as
# places rather than as one flat sheet.
sim.map.cols=32
sim.map.rows=18
sim.map.tileSize=5
sim.map.regions=6

# The player-controlled unit.
# ---------------------------------------------------------------------------------------------
# PACE. Everything that moves was slowed by roughly a third on 2026-09-10, and the guns' rate of
# fire with it, because the game read as too fast to think in. The ratios between units were kept:
# the commander still outruns a trooper, a trooper outruns a grunt, and a brute is the slow one.
# If it needs another pass, scale this whole block rather than one number - a single unit retuned
# on its own is how a chase stops working.
# ---------------------------------------------------------------------------------------------
sim.commander.radius=2.0
sim.commander.speed=19
sim.commander.health=100
# How long he lies on the ground shot off his feet before he is gone. HIS OWN, and deliberately not
# sim.casualty.bleedOutSeconds, which is his men's: what a player actually sits out is this window
# plus the throes plus the respawn below, and three windows sized for a trooper added up to most of a
# fight. Shortening the shared one instead would have shortened every rescue on the field, which is a
# decision about a different mechanic. Still long enough that somebody has to decide whether to come.
sim.commander.bleedOutSeconds=5
# How long the body lies on the field after a killing blow, before it is taken away. The window the
# dying animation will play in; the respawn countdown starts after it, not alongside it.
sim.commander.deathThroesSeconds=1.5
# Brought down from three on 2026-09-18. Being shot off your feet already costs the bleed-out above
# and the throes beside it, and the wait after all of that was being served twice.
sim.commander.respawnDelaySeconds=1.5
# Where it comes back when nobody else is left standing: this far in from the left edge, vertically
# centred. With another commander still on his feet he comes back beside him instead, so this is the
# single-player case and the wipe.
sim.commander.respawnMargin=6
sim.commander.respawnInvulnerableSeconds=2
# How far a commander may walk from the middle of the commanders. Past this the step outwards is
# refused - never a shove inwards, so nobody is ever pushed and a man at the end of the rope walks
# home himself. Zero switches it off.
#
# Deliberately FAR wider than the view: a player may go off screen, and this is a backstop against
# two players ending up a level apart rather than a frame the camera has to hold. It started at 30,
# which capped a pair at 60 apart inside the 160x90 the viewport shows - correct for pillar 4 and
# much too tight to play. What that leaves open is what the view does with a player it cannot frame;
# see the open questions in docs/design/README.md.
#
# Still not read from the camera, and that part is not a preference: zoom is a rendering setting and
# a leash that grew with it would make pulling the view back into extra rope.
sim.commander.leashRadius=120

# The squad. A trooper is not a strain: it has no evolution, no leap and no contact damage, so it
# gets its own block rather than a sim.unit.* one. Speed is below the commander's on purpose - a
# squad following him strings out behind rather than crowding him.
sim.trooper.radius=1.6
sim.trooper.speed=13.5
sim.trooper.health=100
sim.trooper.deathThroesSeconds=1
# How many spawn with him. Scenarios usually override this; it is here so a build has a squad.
sim.trooper.squadSize=4
# How many men beyond the ones he starts with the field will hold: the squad's maximum is squadSize
# plus this, and a reinforcement past it is wasted. Headroom rather than a ceiling so that a scenario
# raising squadSize cannot configure a maximum below its own starting squad. Zero is a level where a
# rescue only ever replaces a man you lost. Well above what one crate is worth, so a crate is somewhere
# for men to go rather than a thing that is already full the first time you take one.
sim.trooper.squadGrowth=8
# How far from the commander a rescued trooper is put down. Close enough that the men you won are in
# the fight you won them in.
sim.trooper.reinforcementRadius=7
sim.trooper.avoidance.enabled=true
sim.trooper.avoidance.scanRange=7
sim.trooper.avoidance.lookaheadSeconds=0.35
sim.trooper.avoidance.weight=1.6
# How much heading for the objective beats looking around, in [0, 1]. THIS IS THE GAME'S PACE DIAL.
# One is a beeline; zero is a squad that weaves so hard it barely advances. It is deliberately not a
# speed - "forward" is the order that changes speed, and one dial doing both would hide that order.
sim.trooper.urgency=0.55
# How far off the route a full lean carries a trooper, and how long a lean lasts before it sweeps
# back. The two seconds are a range so a squad does not sweep in lockstep, which reads as a chorus
# line rather than as men each watching their own arc.
sim.trooper.scanSpread=0.8
sim.trooper.scanMinSeconds=0.7
sim.trooper.scanMaxSeconds=1.6
sim.trooper.arriveRadius=3
# What a trooper can notice. This is the unit G0015 exists for: it declares all three tests, where an
# alien declares only a range. arcDegrees is the cone it engages within - the facing spoke on screen
# is what makes that arc something the player can read. requiresClearLine stops it firing into rock.
sim.trooper.perception.alwaysAggressive=false
sim.trooper.perception.losesInterest=true
# Raised from 22/28 on 2026-09-24: nests sit 30-47 from the middle of the Adventure's points and a frog's
# gun reaches 26, so a squad holding a point was outranged by the thing it was there to clear. It is
# also how far a man will go to pick somebody up - "a man he could see go down" is the rule.
sim.trooper.perception.detectionRange=34
sim.trooper.perception.loseRange=40
sim.trooper.perception.secondaryRange=0
sim.trooper.perception.arcDegrees=100
sim.trooper.perception.requiresClearLine=true
# How far the commander's voice carries. This is the whole of who hears an order (G0017): wide enough
# that a squad walking with him all hear it, short enough that a stray one has to be gone and fetched.
sim.trooper.orderRadius=22
# What "forward" buys: a distance rather than a countdown, so a squad pinned by a fight still gets
# its full push once the shooting stops.
sim.trooper.forwardDistance=40
sim.trooper.forwardSpeedFactor=1.6
# How close a following trooper tries to stay. Loose on purpose - a squad glued to him is a squad he
# cannot see past.
sim.trooper.followDistance=7
# How far from the post the squad roams on a level that names one. Its own patch, and the answer to
# "what does a squad do on a level whose whole instruction is stay here": with nothing in front of
# them they stay around the thing they were told to hold rather than wandering off across the level.
# It costs the player nothing - "forward" still pushes the line out past it, and a fight outranks
# both. Levels with no post are unaffected: there, roaming is still the whole map.
sim.trooper.patchRadius=30
# How wide of where it is going a trooper walks - the pack's own spread (G0033), for walking to a point
# and keeping up with him (G0041). Which side is seeded from where the man was put down. Full swing past
# twice closeRange, straight at it again by closeRange; wider than an alien's because a point is a place
# to stand round rather than a man to arrive at. Terrain still has the last word: out of a clear line,
# the route answers and a corridor still files.
sim.trooper.approach.enabled=true
sim.trooper.approach.offset=8
sim.trooper.approach.closeRange=10
# How far ahead of the commander a follower aims, in seconds of his walking. Walking at where he will be
# brings a squad alongside him when he turns; walking at where he is strings it out behind. Zero aims at him.
sim.trooper.followAheadSeconds=1
# A point taken is held, and the squad moves on by itself only to catch up with a commander who has gone
# on ahead (G0040) - never ahead of one. holdSeconds is how long they hold before following him, give or
# take holdJitterSeconds per man so they peel off rather than leave in step. rallyRadius is how near a
# point he has to be to count as at it: at the next one, they set off at once; at this one, they stay.
# "Forward" still sends them at once, whatever this says.
sim.trooper.holdSeconds=10
sim.trooper.holdJitterSeconds=2
sim.trooper.rallyRadius=30
# The safety net for a man who has walked into somewhere he cannot get out of - a slot between a boulder
# and rock, a pocket of bodies. Asking the route again gives the same route, so instead: a man walking
# who covers less than blockDistance in blockSeconds backs off to one side for detourSeconds, his own
# side first and the other side next time. Slow is not stuck: a man in a thicket still clears the
# distance. Zero blockSeconds switches it off.
sim.trooper.blockSeconds=1.5
sim.trooper.blockDistance=2
sim.trooper.detourSeconds=0.8
# Being hit turns a man round: for alertSeconds he looks all round for what hit him instead of only
# inside his arc, and turns to face where the shot came from - a place, as an alien's provocation is.
sim.trooper.alertSeconds=3
# Who a man shoots, as a distance he would rather it were. Something coming for somebody counts as
# threatBonus nearer than something that is not (a nest, an alien that has not noticed anyone), and
# every man already shooting at a thing this tick makes it sharedTargetPenalty further - so a squad
# spreads its fire. Zero on both is every man for the nearest thing, which is what it did before.
sim.trooper.threatBonus=12
sim.trooper.sharedTargetPenalty=8
sim.trooper.weapon=sidearm

# ---- AI CHANCES --------------------------------------------------------------------------------
# Everything the AI does only SOMETIMES, in one block. One key per constant in AiChance, and that
# enum is the index: if a unit does something occasionally, it has a line here, so the conditional
# behaviour in the game can be read off one list instead of found by searching the systems.
#
# Every number is a chance PER SECOND OF OPPORTUNITY - the clock runs only while the thing is
# actually possible - never per tick. Zero switches a behaviour off and draws no random number at
# all, so turning one off cannot reshuffle what the others roll.
#
# A strain that needs its own number overrides it under sim.unit.<kind>.chances.<name>; only the
# numbers it differs on need restating.
#
# The sweep is very small on purpose: answering a leap is the commander's moment and the whole
# reason the clinch rule exists (G0013). Aiding the commander is far likelier than aiding a trooper
# because a man who has to choose between two bodies on the ground should be seen to choose.
sim.ai.chance.swing_at_a_leap=0.5
sim.ai.chance.bite_a_barrel=0.8
sim.ai.chance.aid_a_trooper=0.4
sim.ai.chance.aid_the_commander=1.5
# High: a gun nobody is on is a gun the level might as well not have put down. It is only ever rolled
# with something already inside that gun's reach, so it is not a man wandering off to sit down.
sim.ai.chance.man_a_turret=2
# How every chance above is DEALT: the longest a unit waits for a behaviour it has the opportunity
# for, as a multiple of the average wait. Each unit carries a budget drawn after every occurrence,
# averaging one, and each tick of opportunity spends it down - so the average above is kept to
# exactly, but luck cannot run long. 2: it can come at once, never later than twice the average.
# 1: always exactly the average, a metronome. 0: no limit, a coin tossed every tick (streaky - a
# once-every-two-seconds chance fails for six seconds one time in twenty).
sim.ai.chance.longestGap=2

# Where the player's side starts: a rectangle of tiles on the left, centred vertically. Units are
# jittered inside those tiles and never stood at a tile centre (G0009). A stand-in until generated
# map fragments can say where their own entrances are.
sim.spawn.col=1
sim.spawn.width=2
sim.spawn.height=5

# The strains that chase it. Every strain is one block under sim.unit.<kind>, with the same keys;
# adding a strain is a constant in UnitKind, a default in SimConfig, and a block here.
# The basic strain. Slower than the commander on purpose.
sim.unit.grunt.radius=1.8
# Raised from 7.5 on 2026-09-18. A grunt that a walking commander could stroll away from was a threat
# only where it had numbers or a corner. Every ratio in the PACE block above survives it: still under
# a runner's 9.5, still well under a trooper's 13.5, still far under his own 19.
sim.unit.grunt.speed=8.25
sim.unit.grunt.count=12
sim.unit.grunt.health=150
# One touch kills a commander outright at these numbers.
sim.unit.grunt.contactDamage=100
# How wide an arc in front of it its claws reach into, centred on the way it is going. Below 360, so
# there is a blind spot behind it and walking into the back of something that has not turned round is
# no longer instant death - which read as the game cheating, because nothing on screen warned you.
# GENEROUS ON PURPOSE: a lunging creature is not precise, and a blind spot narrow enough to rely on
# would turn every fight into a dance round behind things. Set it to 360 for a strain that bites
# anything it touches.
sim.unit.grunt.attackArcDegrees=200
sim.unit.grunt.attackCooldownSeconds=1.3
sim.unit.grunt.victimInvulnerableSeconds=0.6
# How long a landed blow holds both the enemy and its victim still. Matches the commander's death
# throes above, so the kill reads as one beat rather than two - change them together or it will not.
sim.unit.grunt.lockSeconds=1.5
# How long its body lies there afterwards. Matches the commander's melee lock, so a lethal answer to
# a leap holds the two of them together for exactly as long as the commander is held by it - which is
# the clinch. A dying body becomes an obstacle: solid, and immovable, so it stays where it fell.
sim.unit.grunt.deathThroesSeconds=1.0
# How much it must consume before it turns into the next strain. What it turns into is structure
# rather than tuning and lives in SimConfig, not here.
sim.unit.grunt.feedToEvolve=3

# What it can notice. alwaysAggressive is the switch that gives back the standing fight every arena
# built before detection existed was tuned around: on, it hunts from the first tick and the two ranges
# below are ignored. loseRange is deliberately wider than detectionRange - one range would flicker a
# unit standing exactly on the boundary between hunting and idling every tick - but only for something
# that can lose interest at all. Giving up leaves a unit idling where it stood when it gave up, not
# walking back to where it spawned - its patch follows it while it has something better to do. Him
# going down releases everything regardless, whatever these say.
sim.unit.grunt.perception.alwaysAggressive=true
sim.unit.grunt.perception.losesInterest=true
sim.unit.grunt.perception.detectionRange=30
sim.unit.grunt.perception.loseRange=45
sim.unit.grunt.perception.secondaryRange=14
sim.unit.grunt.perception.arcDegrees=360
sim.unit.grunt.perception.requiresClearLine=false

# How it passes the time before it has noticed anybody: pick a spot in its patch, walk there slowly,
# stand a moment, pick again. The patch is centred where the unit was spawned, so losing the commander
# means walking home. speedFactor is well below one on purpose - an ambling unit must not read like
# one that has seen you. waypointTimeoutSeconds is what stops a unit wedged behind a rock leaning into
# it for the rest of the level.
sim.unit.grunt.wander.enabled=true
sim.unit.grunt.wander.radius=12
sim.unit.grunt.wander.speedFactor=0.45
sim.unit.grunt.wander.arriveRadius=1.5
sim.unit.grunt.wander.pauseMinSeconds=0.4
sim.unit.grunt.wander.pauseMaxSeconds=1.4
sim.unit.grunt.wander.waypointTimeoutSeconds=4

# How far ahead it looks for things in its way. Both it and the hazard are projected forward by
# lookaheadSeconds before the gap is measured, which is the whole of what makes the avoidance
# predictive rather than a reaction to a collision that already happened. It never steers around the
# other side - that is what it is trying to reach. weight is how heavily a dangerous direction counts
# against how much it wanted to go that way; far above one and it flinches at everything and never
# arrives.
sim.unit.grunt.avoidance.enabled=true
sim.unit.grunt.avoidance.scanRange=7
sim.unit.grunt.avoidance.lookaheadSeconds=0.35
sim.unit.grunt.avoidance.weight=1.6

# How an enemy closes the last of the distance. The hesitation is the only part of the leap the
# player gets to answer, so it is short: read the tell, or wear it.
sim.unit.grunt.leap.enabled=true
sim.unit.grunt.leap.triggerRange=16
sim.unit.grunt.leap.speed=29
sim.unit.grunt.leap.airborneSeconds=0.28
sim.unit.grunt.leap.sequenceLength=2
sim.unit.grunt.leap.betweenSeconds=0.18
sim.unit.grunt.leap.cooldownSeconds=1.6
sim.unit.grunt.leap.hesitationMinSeconds=0.08
sim.unit.grunt.leap.hesitationMaxSeconds=0.22

# HOW WIDE OF YOU IT CLOSES. Everything hunting one man used to be steered at the same point, and a
# flow field's gradient in the open is grid-shaped, so a pack crossing open ground converged onto his
# row and came down it in single file. Each creature now walks at a point of its own beside him.
# Which side and how much is taken from where it was spawned rather than rolled (G0012's argument,
# applied to an approach), so a pack fans out the same way on every run.
#
# offset is how far to either side of the line, in world units, at full swing - sized against the
# body, or it reads as a wobble rather than as a creature taking its own line. closeRange is where
# the swing has run out and it is walking straight at him again: it is at full swing past twice this
# and closed by this, so the fan is open while the ground is being crossed and shut by the time
# anything arrives. Something that held its offset all the way in would orbit rather than arrive.
# Keep it comfortably inside the detection range above, or a strain spends the whole approach wide.
sim.unit.grunt.approach.enabled=true
sim.unit.grunt.approach.offset=7
sim.unit.grunt.approach.closeRange=12
sim.unit.grunt.evolvesTo=brute
sim.unit.grunt.look=grunt

# The fast one. Smaller and thinner than a grunt, and it notices you from most of the way across a
# level - it is the strain that comes to find you rather than the one you walk into. What makes it a
# different problem is its line rather than its speed: it weaves as it closes and steps aside from
# shots it sees coming, so it is a target you have to lead.
sim.unit.runner.radius=1.4
sim.unit.runner.speed=9.5
sim.unit.runner.count=6
sim.unit.runner.health=60
sim.unit.runner.contactDamage=100
sim.unit.runner.attackArcDegrees=200
sim.unit.runner.attackCooldownSeconds=1.1
sim.unit.runner.victimInvulnerableSeconds=0.6
sim.unit.runner.lockSeconds=1.5
sim.unit.runner.deathThroesSeconds=0.8
sim.unit.runner.feedToEvolve=0

# Twice a grunt's reach. This is the number that makes it the strain that finds you.
sim.unit.runner.perception.alwaysAggressive=true
sim.unit.runner.perception.losesInterest=true
sim.unit.runner.perception.detectionRange=60
sim.unit.runner.perception.loseRange=80
sim.unit.runner.perception.secondaryRange=14
sim.unit.runner.perception.arcDegrees=360
sim.unit.runner.perception.requiresClearLine=false

sim.unit.runner.wander.enabled=true
sim.unit.runner.wander.radius=16
sim.unit.runner.wander.speedFactor=0.5
sim.unit.runner.wander.arriveRadius=1.5
sim.unit.runner.wander.pauseMinSeconds=0.3
sim.unit.runner.wander.pauseMaxSeconds=1.0
sim.unit.runner.wander.waypointTimeoutSeconds=4

sim.unit.runner.avoidance.enabled=true
sim.unit.runner.avoidance.scanRange=7
sim.unit.runner.avoidance.lookaheadSeconds=0.35
sim.unit.runner.avoidance.weight=1.6

# A shorter, faster dash than a grunt's, with barely any wind-up: it is already on you.
sim.unit.runner.leap.enabled=true
sim.unit.runner.leap.triggerRange=14
sim.unit.runner.leap.speed=34
sim.unit.runner.leap.airborneSeconds=0.24
sim.unit.runner.leap.sequenceLength=2
sim.unit.runner.leap.betweenSeconds=0.14
sim.unit.runner.leap.cooldownSeconds=1.2
sim.unit.runner.leap.hesitationMinSeconds=0.06
sim.unit.runner.leap.hesitationMaxSeconds=0.16

# Narrower than a grunt's, because it weaves on top of it: two wide answers to the same question read
# as a creature that cannot make its mind up rather than as one taking a line.
sim.unit.runner.approach.enabled=true
sim.unit.runner.approach.offset=5
sim.unit.runner.approach.closeRange=10

# How hard it refuses to walk straight at you. amplitude is how far it leans off its course, as a
# fraction of forwards; wavelength is how far it travels through one full left-right-left. Both are
# functions of GROUND COVERED rather than of the clock, so a runner held up by a wall does not weave
# on the spot and a slowed one does not weave faster. Nothing here is rolled (G0012).
sim.unit.runner.weave.enabled=true
sim.unit.runner.weave.amplitude=0.55
sim.unit.runner.weave.wavelength=9

# It steps aside from a shot it sees coming, exactly as a rabbit does - the same definition and the
# same system. reactionRange is what decides whether it has time to think about a shot from across
# the arena; commitSeconds is what makes a second shot the answer to the first.
sim.unit.runner.dodge.enabled=true
sim.unit.runner.dodge.reactionRange=22
sim.unit.runner.dodge.speed=26
sim.unit.runner.dodge.durationSeconds=0.26
sim.unit.runner.dodge.commitSeconds=0.7
sim.unit.runner.dodge.margin=1.4
sim.unit.runner.evolvesTo=none
sim.unit.runner.look=runner

# The heavy units. Slow, tough, and the reason the hand strike needs a stun: a brute survives one.
sim.unit.brute.radius=2.6
sim.unit.brute.speed=4.75
sim.unit.brute.count=3
sim.unit.brute.health=250
sim.unit.brute.contactDamage=100
# The same arc as a grunt. A brute turns more slowly than one, which is punishment enough.
sim.unit.brute.attackArcDegrees=200
sim.unit.brute.attackCooldownSeconds=1.5
sim.unit.brute.victimInvulnerableSeconds=0.6
sim.unit.brute.lockSeconds=1.5
sim.unit.brute.deathThroesSeconds=1.0
# Zero: a brute has nowhere further to go by eating.
sim.unit.brute.feedToEvolve=0

# Heavier and duller: it notices later than a grunt and gives up sooner.
sim.unit.brute.perception.alwaysAggressive=true
sim.unit.brute.perception.losesInterest=true
sim.unit.brute.perception.detectionRange=24
sim.unit.brute.perception.loseRange=36
sim.unit.brute.perception.secondaryRange=10
sim.unit.brute.perception.arcDegrees=360
sim.unit.brute.perception.requiresClearLine=false

# A brute keeps a smaller patch and rests in it longer. Heavy things do not pace.
sim.unit.brute.wander.enabled=true
sim.unit.brute.wander.radius=8
sim.unit.brute.wander.speedFactor=0.35
sim.unit.brute.wander.arriveRadius=2
sim.unit.brute.wander.pauseMinSeconds=0.8
sim.unit.brute.wander.pauseMaxSeconds=2.4
sim.unit.brute.wander.waypointTimeoutSeconds=5

# A brute is wider and slower to turn, so it looks further ahead and commits earlier.
sim.unit.brute.avoidance.enabled=true
sim.unit.brute.avoidance.scanRange=9
sim.unit.brute.avoidance.lookaheadSeconds=0.5
sim.unit.brute.avoidance.weight=1.3

# A brute telegraphs harder and travels further. Its extra health would be unfair otherwise.
sim.unit.brute.leap.enabled=true
sim.unit.brute.leap.triggerRange=22
sim.unit.brute.leap.speed=24
sim.unit.brute.leap.airborneSeconds=0.42
sim.unit.brute.leap.sequenceLength=3
sim.unit.brute.leap.betweenSeconds=0.26
sim.unit.brute.leap.cooldownSeconds=2.4
sim.unit.brute.leap.hesitationMinSeconds=0.18
sim.unit.brute.leap.hesitationMaxSeconds=0.42

# Wider and started further out than a grunt's. A brute is 5.2 across and turns slowly, so two of them
# on lines a grunt's width apart are still shoulder to shoulder by the time they arrive.
sim.unit.brute.approach.enabled=true
sim.unit.brute.approach.offset=9
sim.unit.brute.approach.closeRange=14
sim.unit.brute.evolvesTo=none
sim.unit.brute.look=brute

# The shooting unit. Purple, and a different problem from the two above: it holds ground at a
# distance instead of coming at you, so it has to be gone and dealt with rather than survived.
# Fragile - two sidearm rounds - because a shooter that also soaked damage would just be a wall.
sim.unit.spitter.radius=1.7
sim.unit.spitter.speed=6
sim.unit.spitter.count=4
sim.unit.spitter.health=70
sim.unit.spitter.contactDamage=100
sim.unit.spitter.attackArcDegrees=200
sim.unit.spitter.attackCooldownSeconds=1.3
sim.unit.spitter.victimInvulnerableSeconds=0.6
sim.unit.spitter.lockSeconds=1.5
sim.unit.spitter.deathThroesSeconds=1.0
sim.unit.spitter.feedToEvolve=0

# It notices at a grunt's range and shoots at well under half of it. The gap between the two is the
# ground you cross while it watches you come.
#
# NOT always aggressive, unlike everything that chases. It has to notice you first, and that is what
# gives it a life before the fight: a unit that has noticed nobody ambles and goes for what it can
# eat, and the commander outranks food absolutely, so a spitter that hunted from the first tick could
# never walk over to a barrel. Once it has noticed you it holds its ground and shoots, which is the
# behaviour the always-aggressive switch was hiding the front half of.
sim.unit.spitter.perception.alwaysAggressive=false
sim.unit.spitter.perception.losesInterest=true
sim.unit.spitter.perception.detectionRange=30
sim.unit.spitter.perception.loseRange=45
sim.unit.spitter.perception.secondaryRange=14
sim.unit.spitter.perception.arcDegrees=360
sim.unit.spitter.perception.requiresClearLine=false

# A SHOOTER AMBLES WHILE IT FIGHTS. It will not follow you, so with nothing else driving its legs it
# stood perfectly still for a whole fight and read as a turret. It keeps ambling inside this patch
# while it shoots - and the patch is what "working the ground" looks like, so it is wider and busier
# than a shuffle: short pauses, a fair walk between waypoints, and a new bearing to look along every
# time it picks one. It must stay inside the gap between closeRange and range above, or it would
# amble out of its own reach between shots.
sim.unit.spitter.wander.enabled=true
sim.unit.spitter.wander.radius=7
sim.unit.spitter.wander.speedFactor=0.4
sim.unit.spitter.wander.arriveRadius=0.8
sim.unit.spitter.wander.pauseMinSeconds=0.2
sim.unit.spitter.wander.pauseMaxSeconds=0.7
sim.unit.spitter.wander.waypointTimeoutSeconds=3

sim.unit.spitter.avoidance.enabled=true
sim.unit.spitter.avoidance.scanRange=7
sim.unit.spitter.avoidance.lookaheadSeconds=0.35
sim.unit.spitter.avoidance.weight=1.6

# It does not leap. Nothing that keeps its distance also throws itself at you.
# No sim.unit.spitter.leap block: a block the file leaves out is off.

# How it shoots. The cone is the whole mechanic: at fourteen degrees a shot meant for the commander
# still reaches a man standing beside him, so a firing line hurts a squad rather than one man, and
# no single shot is ever quite aimed. haltsToFire is what makes it hold a line instead of closing.
sim.unit.spitter.ranged.enabled=true
sim.unit.spitter.ranged.range=18
sim.unit.spitter.ranged.spreadDegrees=14
sim.unit.spitter.ranged.haltsToFire=true
# It NEVER advances on what it is hunting. A spitter is a place on the field you have to get past,
# not a thing that comes for you - you are driven off and never followed, which is a different
# problem from everything else on the alien side and the reason the two want different answers.
sim.unit.spitter.ranged.holdsGround=true
# Its field of view, and how fast it swings onto you. Wider than a trooper's hundred degrees, because
# a creature built around a gun should be harder to get behind than a man is - but not all round, so
# stepping past one is a real move. turnRate is a fraction of the remaining angle per second: at
# three it has covered most of a wide swing inside a second, which is long enough to feel and short
# enough that flanking one is a moment rather than a strategy.
sim.unit.spitter.ranged.arcDegrees=150
sim.unit.spitter.ranged.turnRate=3
# THE DISTANCE IT WANTS TO BE AT, and therefore the distance it walks to once it has noticed you.
# Inside it the thing fires faster and straighter by the same factor - it has you at point-blank
# range, and that is one idea rather than two. Half its firing range, so a spitter that has taken its
# position is dangerous and you get half its reach as warning. It has to stay comfortably inside the
# range above, or the amble below carries it back out of its own reach between shots.
sim.unit.spitter.ranged.closeRange=9
sim.unit.spitter.ranged.closeFactor=0.6
# How long it takes to walk its aim in. The first shot is the wild one and by the third the cone is
# down to a third of what it was, so standing in a spitter's sights is the mistake rather than being
# shot at once. Break its line, leave its range or step out of its arc and it starts again.
sim.unit.spitter.ranged.settleShots=3
sim.unit.spitter.ranged.settledSpreadFactor=0.35
sim.unit.spitter.ranged.gun=spit
sim.unit.spitter.ranged.chargedGun=charged_spit
# Off: it takes its own ground and holds it rather than closing on him, so there is no queue for a
# spread to break up. What keeps two spitters apart is the patch each ambles around.
# No sim.unit.spitter.approach block: a block the file leaves out is off.
# It is far hungrier for a barrel than anything that closes and claws, because a barrel is what turns
# its gun into an artillery piece. Standing one next to a barrel is a decision a level makes.
sim.unit.spitter.chances.bite_a_barrel=8
sim.unit.spitter.evolvesTo=none
sim.unit.spitter.look=spitter

# THE FROG. A shooter like a spitter and a different problem from one: what it throws is not a shot
# to be hit by but a spatter to be standing in, so what the player has to read is the ground rather
# than the creature. Green, and everything it does is green - the shot and the stain are the same
# family, which is the whole of what has to be learnt about it.
sim.unit.frog.radius=1.6
sim.unit.frog.speed=7.5
sim.unit.frog.count=4
sim.unit.frog.health=60
sim.unit.frog.contactDamage=100
sim.unit.frog.attackArcDegrees=200
sim.unit.frog.attackCooldownSeconds=1.3
sim.unit.frog.victimInvulnerableSeconds=0.6
sim.unit.frog.lockSeconds=1.5
sim.unit.frog.deathThroesSeconds=1.0
sim.unit.frog.feedToEvolve=0

# IT GIVES UP EASILY, and this pair of numbers is the whole of how. Everything else on the field
# keeps hunting you fifteen world units past the range it noticed you at; a frog keeps hunting you
# four. Back off half a dozen strides and it loses you - which makes it the one creature worth
# leaving alone rather than clearing, and the only lever the player has against it that is not a
# gun. The gap is still a gap on purpose: with one number a frog standing exactly on the boundary
# would flicker between hunting and idling every tick.
sim.unit.frog.perception.alwaysAggressive=false
sim.unit.frog.perception.losesInterest=true
sim.unit.frog.perception.detectionRange=26
sim.unit.frog.perception.loseRange=30
sim.unit.frog.perception.secondaryRange=12
sim.unit.frog.perception.arcDegrees=360
sim.unit.frog.perception.requiresClearLine=false

# It ambles inside a patch while it fights, like every other shooter - and the patch has to stay
# inside the gap between closeRange and range, or it would amble out of its own reach between shots.
sim.unit.frog.wander.enabled=true
sim.unit.frog.wander.radius=9
sim.unit.frog.wander.speedFactor=0.5
sim.unit.frog.wander.arriveRadius=1.5
sim.unit.frog.wander.pauseMinSeconds=0.5
sim.unit.frog.wander.pauseMaxSeconds=1.6
sim.unit.frog.wander.waypointTimeoutSeconds=4

sim.unit.frog.avoidance.enabled=true
sim.unit.frog.avoidance.scanRange=7
sim.unit.frog.avoidance.lookaheadSeconds=0.35
sim.unit.frog.avoidance.weight=1.6

# It does not leap AT you. The hop below is how it gets about, which is a different thing entirely.
# No sim.unit.frog.leap block: a block the file leaves out is off.

# THE GAIT. A quarter of a second in the air and rather more than that sitting, so what a player
# reads is a creature that is repeatedly not going anywhere - which is when it is worth shooting.
# It is NOT a speed change: over one whole hop-and-sit it covers exactly what speed above says, so a
# frog can be tuned against a grunt without arithmetic. Shorten restSeconds and it becomes a nervous
# thing that is always moving; lengthen it and it becomes a statue that lurches.
sim.unit.frog.hop.enabled=true
sim.unit.frog.hop.hopSeconds=0.26
sim.unit.frog.hop.restSeconds=0.42

# How it shoots. Middle range - well past a spitter's eighteen and well short of a runner's sixty -
# and it does NOT hold its ground: it walks up to the distance it likes and keeps working the ground
# from there, which is what makes the hop worth watching. settleShots is zero because its aim hardly
# matters: it is throwing at a piece of floor, not at a man.
sim.unit.frog.ranged.enabled=true
sim.unit.frog.ranged.range=26
sim.unit.frog.ranged.spreadDegrees=10
sim.unit.frog.ranged.haltsToFire=true
sim.unit.frog.ranged.holdsGround=false
sim.unit.frog.ranged.arcDegrees=160
sim.unit.frog.ranged.turnRate=3
sim.unit.frog.ranged.closeRange=16
sim.unit.frog.ranged.closeFactor=0.7
sim.unit.frog.ranged.settleShots=0
sim.unit.frog.ranged.settledSpreadFactor=1
sim.unit.frog.evolvesTo=none
sim.unit.frog.ranged.gun=venom
sim.unit.frog.ranged.chargedGun=none
sim.unit.frog.look=frog
# Off: it shoots at ground rather than at a man, so there is no queue for a spread to break up.
# No sim.unit.frog.approach block: a block the file leaves out is off.

# Every gun, one block per kind under sim.weapon.<kind>. The sidearm is what the commander starts
# and respawns with; anything else is found on the field and lost with him. What a gun's shots look
# like is not a number to balance and stays in SimConfig.
# The sidearm: two hits kill a grunt.
sim.weapon.sidearm.cooldownSeconds=0.30
sim.weapon.sidearm.projectileSpeed=42
sim.weapon.sidearm.projectileRadius=0.6
sim.weapon.sidearm.damage=50
sim.weapon.sidearm.projectileRange=0
sim.weapon.sidearm.pellets=1
sim.weapon.sidearm.spreadDegrees=0
sim.weapon.sidearm.projectileLook=projectile
sim.weapon.sidearm.blastRadius=0
sim.weapon.sidearm.muzzleOffset=0
sim.weapon.sidearm.pierceIntervalSeconds=0
sim.weapon.sidearm.slowFactor=1
sim.weapon.sidearm.slowSeconds=0
sim.weapon.sidearm.selfSlowFactor=1
sim.weapon.sidearm.selfSlowSeconds=0
sim.weapon.sidearm.trailLength=0
sim.weapon.sidearm.bloatPerShot=0

# The railgun: slow enough to punish a miss, heavy enough to drop a brute in one, and it goes
# THROUGH what it drops. pierceIntervalSeconds above zero is what makes a shot pass through anything
# alive; scenery still stops it, and so does rock, so what a slug rewards is a line rather than a
# target. The interval is how long one slug waits between the blows it lands: a shot 1 across
# crossing a body at 85 a second is over it in well under a tenth, so this is what keeps one slug
# from landing on one grunt once a tick while it passes through.
# It also runs hot, which is the whole of what stops a found gun being a straight upgrade - seven
# shots now rather than five, because a gun that hits a line of them should be allowed to find one.
# coolPerSecond is deliberately below what the cooldown gives back between shots, or the bar could
# never fill at all.
sim.weapon.railgun.cooldownSeconds=1.2
sim.weapon.railgun.projectileSpeed=85
sim.weapon.railgun.projectileRadius=1.0
sim.weapon.railgun.damage=300
sim.weapon.railgun.pierceIntervalSeconds=0.05
sim.weapon.railgun.heat.perShot=0.28
sim.weapon.railgun.heat.coolPerSecond=0.12
sim.weapon.railgun.heat.resumeBelow=0.4
sim.weapon.railgun.projectileRange=0
sim.weapon.railgun.pellets=1
sim.weapon.railgun.spreadDegrees=0
sim.weapon.railgun.projectileLook=slug
sim.weapon.railgun.blastRadius=0
sim.weapon.railgun.muzzleOffset=0
sim.weapon.railgun.slowFactor=1
sim.weapon.railgun.slowSeconds=0
sim.weapon.railgun.selfSlowFactor=1
sim.weapon.railgun.selfSlowSeconds=0
sim.weapon.railgun.trailLength=0
sim.weapon.railgun.bloatPerShot=0

# The flamethrower. A wall of fire a few strides long: four fat, short-lived pellets per pull thrown
# into a wide cone, so it covers GROUND rather than a point. projectileRange is what makes it
# short - the flame goes out - and it is a property of the SHOT rather than of the aim, which is the
# same number a grenade has carried since G0019 and does not touch the rule that aim is a direction.
# damage is per pellet, so what it does depends entirely on how many of them land, which is how close
# he was willing to get. The heat is the whole of what stops it being the answer to everything: it is
# the gun most likely to be held down, and held down it takes itself away for about two seconds.
sim.weapon.flamer.cooldownSeconds=0.09
sim.weapon.flamer.projectileSpeed=34
sim.weapon.flamer.projectileRadius=1.1
sim.weapon.flamer.projectileRange=17
sim.weapon.flamer.damage=9
sim.weapon.flamer.pellets=4
sim.weapon.flamer.spreadDegrees=34
sim.weapon.flamer.heat.perShot=0.035
sim.weapon.flamer.heat.coolPerSecond=0.3
sim.weapon.flamer.heat.resumeBelow=0.45
sim.weapon.flamer.projectileLook=flame
sim.weapon.flamer.blastRadius=0
sim.weapon.flamer.muzzleOffset=0
sim.weapon.flamer.pierceIntervalSeconds=0
sim.weapon.flamer.slowFactor=1
sim.weapon.flamer.slowSeconds=0
sim.weapon.flamer.selfSlowFactor=1
sim.weapon.flamer.selfSlowSeconds=0
sim.weapon.flamer.trailLength=0
sim.weapon.flamer.bloatPerShot=0

# ---- THE LASER ---------------------------------------------------------------------------------
# The beam. Forty shots a second worth seven each, so about a hundred and forty a second against one
# body - a little under the sidearm's - and it STOPS AT THE FIRST THING IT TOUCHES. What it rewards
# is staying on one target, which is what the slow and what it does to a corpse both want anyway.
#
# IT USED TO PIERCE, AND IT ONLY LOOKED LIKE IT DID. pierceIntervalSeconds is how long one shot waits
# between the blows it may land - a guard against a single slug hitting one body once per tick while
# it crosses it - and at 0.1s and 190 units a second that is NINETEEN WORLD UNITS of flight during
# which the shot passes through everything and lands nothing. Two touching grunts are 3.6 units
# apart. So the line was drawn through the whole crowd and exactly one of them was ever hit, which
# is not a subtle difference and read as the gun being broken. The railgun's window is 4.25 units,
# shorter than one body, which is why the same mechanism works there and not here.
#
# It cannot be tuned out either: the window would have to be longer than the time to cross a brute
# (0.031s) and shorter than the time to cross the gap between two touching grunts (0.019s). Doing it
# properly means the shot remembering which body it last hit, and a pooled component may not hold an
# entity across ticks (G0010, G0016). So the beam stops, and the picture and the gun agree.
#
# EVERY GOOD THING ABOUT IT COMES OUT OF THE SAME BAR. A gun cools whether or not it is firing, so
# what fills the bar is the NET rate: twenty shots a second at 0.0275 each is 0.55, less the 0.3 that
# comes off, so about four seconds of holding the trigger fills it. resumeBelow then means it does
# not come back until it has fallen under half, which is another second and five sixths. Four on and
# nearly two off is the rhythm of the gun, and it is the hottest thing a man can carry by a long way:
# the flamethrower takes eleven seconds to do the same and the railgun nine.
#
# THIS IS THE DIFFICULTY KNOB. Everything else the beam does - the slow, the pace it costs him, a
# corpse inflated until it goes off - is bought out of those four seconds. Raise perShot and it
# becomes a burst weapon; lower it and it becomes the answer to everything.
#
# projectileRange is where the beam dissipates: comfortably past the shotgun's reach and well short
# of the railgun's, which has none. It is also what the drawn line measures itself against, so the
# beam reaches that far into empty air and no further.
#
# pierceIntervalSeconds ZERO is a shot that stops at the first thing it touches, which is what every
# gun in this file but the railgun declares. The drawn line ends where the shots end, so it now
# terminates on whatever is being burnt - no renderer change was needed for that, which is the point
# of drawing the beam from the shots rather than inventing a line.
sim.weapon.laser.cooldownSeconds=0.05
sim.weapon.laser.projectileSpeed=190
sim.weapon.laser.projectileRadius=0.3
sim.weapon.laser.projectileRange=38
sim.weapon.laser.damage=7
sim.weapon.laser.pierceIntervalSeconds=0
# WHAT IT DOES BESIDES DAMAGE. slowFactor is how much of its speed a creature the beam lands on
# keeps, and slowSeconds is how long that lasts after the LAST hit - refreshed rather than added to,
# so what buys the slow is keeping the beam on something instead of sweeping it across a crowd.
# Under a second on purpose: a slow the player cannot see running out is a slow he cannot plan
# around, and the beam is meant to be a thing you hold rather than a thing you apply.
#
# This is most of what makes the laser worth carrying against a brute: it cannot out-damage a
# railgun, and it does not have to - a brute at half pace is a brute the squad gets a second shot at.
sim.weapon.laser.slowFactor=0.4
sim.weapon.laser.slowSeconds=0.8
# AND IT SLOWS THE MAN HOLDING IT. That is the other half of the trade: the gun that stops things
# coming at you is also the gun that makes them worth being afraid of, because you cannot hold it on
# something and get out of the way at the same time. selfSlowSeconds is a few cooldowns rather than
# a second, so it is continuous while the trigger is down and gone almost at once when it is not -
# a self-slow that outlived the burst would be a punishment rather than a cost.
sim.weapon.laser.selfSlowFactor=0.72
sim.weapon.laser.selfSlowSeconds=0.16
# WHAT IT DOES TO SOMETHING ALREADY DEAD. bloatPerShot is how much of a body one shot pumps up, and
# at twenty shots a second it fills one in a shade under three seconds - which is about three
# quarters of a heat bar. THAT RATIO IS THE BALANCE. Turning a body into a bomb is most of a bar not
# spent on what is still walking at you, and there is no way to have both.
#
# It builds on the LIVING as well, and is drawn there, so the player can watch the thing he is
# burning fill up and decide whether to hold the beam on it through the kill. Only something already
# dying bursts: a gun that killed by inflation would be a gun with two ways of killing and one bar,
# and health would stop deciding anything.
#
# What one shot is worth is divided by how big the body is (see sim.bloat.referenceRadius), so the
# number below is what it is worth against an ordinary chasing strain and proportionally less
# against anything larger.
sim.weapon.laser.bloatPerShot=0.06
sim.weapon.laser.heat.perShot=0.0275
sim.weapon.laser.heat.coolPerSecond=0.3
sim.weapon.laser.heat.resumeBelow=0.45
sim.weapon.laser.pellets=1
sim.weapon.laser.spreadDegrees=0
sim.weapon.laser.projectileLook=laser
sim.weapon.laser.blastRadius=0
sim.weapon.laser.muzzleOffset=0
sim.weapon.laser.trailLength=40

# The shotgun. Six pellets thrown wide, slowly. The cone is the same width at every distance - it is
# applied by turning each pellet rather than by aiming it somewhere else - so how much of a pull lands
# is entirely how close he got: all six kill a grunt outright, and one or two at range annoy it.
# It stays cold; what it costs is the wait, which is long enough that a miss is a decision to live
# with. Its reach is short but comfortably past the flamer's: the two are the same trade at different
# distances, and a gap between them would leave a band nothing covers.
sim.weapon.shotgun.cooldownSeconds=0.75
sim.weapon.shotgun.projectileSpeed=60
sim.weapon.shotgun.projectileRadius=0.5
sim.weapon.shotgun.projectileRange=26
sim.weapon.shotgun.damage=22
sim.weapon.shotgun.pellets=6
sim.weapon.shotgun.spreadDegrees=26
sim.weapon.shotgun.projectileLook=pellet
sim.weapon.shotgun.blastRadius=0
sim.weapon.shotgun.muzzleOffset=0
sim.weapon.shotgun.pierceIntervalSeconds=0
sim.weapon.shotgun.slowFactor=1
sim.weapon.shotgun.slowSeconds=0
sim.weapon.shotgun.selfSlowFactor=1
sim.weapon.shotgun.selfSlowSeconds=0
sim.weapon.shotgun.trailLength=0
sim.weapon.shotgun.bloatPerShot=0

# What a spitter fires. Slow in the air on purpose - far slower than anything of the player's - so a
# shot is something you watch coming and step out of rather than something that has already hit you.
# ONE HUNDRED IS ONE SHOT: a spit empties any man's bar, so being hit at all is being off your feet.
# Raised from fifty on 2026-09-17. Two shots read as a wall to be worn down rather than a line to be
# respected, and the casualty rule is what makes one shot survivable - he goes down with a clock
# running instead of dying, and somebody can come for him. It one-shots a trooper too, which is what
# makes a firing line thin a squad rather than annoy it.
sim.weapon.spit.cooldownSeconds=1.1
sim.weapon.spit.projectileSpeed=30
sim.weapon.spit.projectileRadius=0.7
sim.weapon.spit.damage=100
sim.weapon.spit.projectileRange=0
sim.weapon.spit.pellets=1
sim.weapon.spit.spreadDegrees=0
sim.weapon.spit.projectileLook=spit
sim.weapon.spit.blastRadius=0
sim.weapon.spit.muzzleOffset=0
sim.weapon.spit.pierceIntervalSeconds=0
sim.weapon.spit.slowFactor=1
sim.weapon.spit.slowSeconds=0
sim.weapon.spit.selfSlowFactor=1
sim.weapon.spit.selfSlowSeconds=0
sim.weapon.spit.trailLength=0
sim.weapon.spit.bloatPerShot=0

# What a spitter fires once it has eaten a barrel. The same slow shot, and it goes off where it stops
# - on whatever it hits, or at the edge of the arena. blastRadius is small against the barrel's own
# eleven: the point is that the ground BESIDE a shot stops being safe, not that one shot ends the
# fight. Any gun with a blastRadius above zero explodes; every other gun in this file leaves it out.
sim.weapon.charged_spit.cooldownSeconds=1.1
sim.weapon.charged_spit.projectileSpeed=30
sim.weapon.charged_spit.projectileRadius=0.8
sim.weapon.charged_spit.damage=100
sim.weapon.charged_spit.blastRadius=5
sim.weapon.charged_spit.projectileRange=0
sim.weapon.charged_spit.pellets=1
sim.weapon.charged_spit.spreadDegrees=0
sim.weapon.charged_spit.projectileLook=charged_spit
sim.weapon.charged_spit.muzzleOffset=0
sim.weapon.charged_spit.pierceIntervalSeconds=0
sim.weapon.charged_spit.slowFactor=1
sim.weapon.charged_spit.slowSeconds=0
sim.weapon.charged_spit.selfSlowFactor=1
sim.weapon.charged_spit.selfSlowSeconds=0
sim.weapon.charged_spit.trailLength=0
sim.weapon.charged_spit.bloatPerShot=0

# WHAT A FROG THROWS. The shot itself does NOTHING - its damage is zero on purpose, because what a
# frog does to you is the ground and not the hit. projectileRange is what makes it a middle-range
# weapon: a miss bursts short of you rather than flying on, so standing in the wrong place is the
# mistake rather than failing to dodge.
#
# THE SLICK IS THE WEAPON. blobs circles of radius, thrown inside spread of where it burst, lying
# there for seconds. spread below radius is what makes them read as one ruined shape rather than as
# a rosette of puddles. damage is far above any health in the game, exactly as a blast's is - it is
# a blow that puts a man down rather than one he can walk off - and because it is a GUNFIRE-kind
# blow it leaves a casualty rather than a corpse.
#
# victimInvulnerableSeconds is the number to reach for if a man going down in venom reads as a
# death: it is how long he is protected from the rest of the spatter after one circle has put him
# down. Too short and the next circle finishes him on the same tick; too long and lying in the stuff
# costs nothing.
#
# A slick belongs to the side that fired it, unlike a blast, which is on nobody's. Frogs walk
# through their own venom.
sim.weapon.venom.cooldownSeconds=2.4
sim.weapon.venom.projectileSpeed=26
sim.weapon.venom.projectileRadius=0.9
sim.weapon.venom.projectileRange=30
sim.weapon.venom.damage=0
sim.weapon.venom.slicks.blobs=5
sim.weapon.venom.slicks.radius=2.2
sim.weapon.venom.slicks.spread=2.6
sim.weapon.venom.slicks.seconds=7
sim.weapon.venom.slicks.damage=1000
sim.weapon.venom.slicks.victimInvulnerableSeconds=1.6
# IT DRIES UP. fadeFraction is how much of its life a circle spends collapsing again, and THE BODY IS
# THE DRAWING - so the circle that catches you is the circle on the screen at that instant, and venom
# that is shrinking is letting go of the ground as fast as it is losing its picture. The same rule
# fire has had since G0035, asked of the stuff a frog spits. It grows not at all: venom lands at full
# size, because a puddle that swelled would read as something arriving rather than as something spilt.
# Raise this if a spatter reads as snapping out of existence; lower it if the ground round a drying
# slick reads as safe before it is.
sim.weapon.venom.slicks.growFraction=0
sim.weapon.venom.slicks.fadeFraction=0.3
sim.weapon.venom.pellets=1
sim.weapon.venom.spreadDegrees=0
sim.weapon.venom.projectileLook=venom
sim.weapon.venom.blastRadius=0
sim.weapon.venom.slicks.secondsMax=7
sim.weapon.venom.slicks.look=slick
sim.weapon.venom.muzzleOffset=0
sim.weapon.venom.pierceIntervalSeconds=0
sim.weapon.venom.slowFactor=1
sim.weapon.venom.slowSeconds=0
sim.weapon.venom.selfSlowFactor=1
sim.weapon.venom.selfSlowSeconds=0
sim.weapon.venom.trailLength=0
sim.weapon.venom.bloatPerShot=0

# What a turret fires. The opposite trade to every gun a man carries: a third of a sidearm's damage,
# three times its rate, and a shot that crosses the arena faster than anything can walk out of the
# way. What it buys you is volume from a place you have to stand still in. muzzleOffset is what makes
# it read as a twin mount - shots leave from alternate sides of the line of fire, and nothing else in
# this file names one, which is what keeps it a property of the gun rather than of the turret.
sim.weapon.turret_gun.cooldownSeconds=0.16
sim.weapon.turret_gun.projectileSpeed=150
sim.weapon.turret_gun.projectileRadius=0.45
sim.weapon.turret_gun.damage=30
sim.weapon.turret_gun.muzzleOffset=0.9
# About three and a half seconds of holding the trigger down, then a second of nothing. resumeBelow is
# what makes the stop a cost rather than a stutter: it comes back at six tenths, not at full.
# RETUNED WITH THE RATE OF FIRE, 2026-09-18. perShot is a fraction per SHOT, so halving the rate of
# fire doubles how long the bar takes to fill unless this moves with it - at the old 0.055 the gun
# could no longer overheat at all, because cooling outran it.
sim.weapon.turret_gun.heat.perShot=0.1
sim.weapon.turret_gun.heat.coolPerSecond=0.35
sim.weapon.turret_gun.heat.resumeBelow=0.6
sim.weapon.turret_gun.projectileRange=0
sim.weapon.turret_gun.pellets=1
sim.weapon.turret_gun.spreadDegrees=0
sim.weapon.turret_gun.projectileLook=turret_shot
sim.weapon.turret_gun.blastRadius=0
sim.weapon.turret_gun.pierceIntervalSeconds=0
sim.weapon.turret_gun.slowFactor=1
sim.weapon.turret_gun.slowSeconds=0
sim.weapon.turret_gun.selfSlowFactor=1
sim.weapon.turret_gun.selfSlowSeconds=0
sim.weapon.turret_gun.trailLength=0
sim.weapon.turret_gun.bloatPerShot=0

# The commander's hand strike: short, fast, and lethal to an enemy but not to a brute. Every value
# here is what will differ between melee weapons - a heavier one winds up, sweeps wider and shoves
# harder, and no code changes.
sim.melee.cooldownSeconds=0.6
sim.melee.windupSeconds=0
sim.melee.activeSeconds=0.12
# Short on purpose. A commander is 2.0 across the middle and an enemy 1.8, so they touch at 3.8 apart;
# this reaches 4.4, which means the sweep cannot land until whatever it is answering is all but on
# him. The window the player gets is activeSeconds above - the sweep lingers and the leap flies into
# it - so this number decides when he must press, not how long he has to press it.
sim.melee.reach=1.2
sim.melee.radius=1.4
sim.melee.damage=120
sim.melee.arcDegrees=180
# What a connecting sweep costs. It is spent only when the sweep kills - then both of them are held
# and tangled together. A target that survives is staggered for this long and the commander is not
# held at all: he shoved something away rather than grappling with it, and is free to follow up.
# Spent only on a target that had already committed to attacking - answering a leap tangles the two of
# them together, and swatting something that was only walking costs him nothing but the cooldown.
sim.melee.locksCommittedOnly=true
sim.melee.lockSeconds=1.0
# How a lethal answer to a leap finishes. The body keeps going along the line it died on, decaying,
# and the solver does the rest: a corpse is immovable and the commander is not, so the body arriving
# shoves him back and the two travel the last of it together. It must carry further than the sweep
# out-reaches a touch - about 0.6 units at these numbers - or the clinch ends with a gap in it.
sim.melee.clinchCarrySpeed=14
sim.melee.clinchCarryDecay=100
sim.melee.knockbackSpeed=45
sim.melee.knockbackDecay=120

# What an explosion does, wherever it came from. The radius is deliberately not here: a grenade and a
# barrel make blasts of different sizes and each names its own. Damage is far above any unit's health
# on purpose - a blast is fatal inside one circle and harmless outside it, and a number that left a
# brute standing would quietly turn one readable rule into a damage curve the player cannot see.
# durationSeconds is only the flash; a blast is dangerous for exactly one tick, on the tick it appears.
sim.blast.damage=1000
sim.blast.durationSeconds=0.25
# How hard the ground moves, in world units, and how far past the killing circle that is felt. The
# simulation says how violent the event was and stops there; what the view does about it is entirely
# the client's, under graphic.camera.shake* - which is why a number here is a distance rather than a
# number of pixels. The reach is well over one on purpose: hearing an explosion you were not close
# enough to be killed by is most of what tells you one went off where you were not looking.
sim.blast.shakeStrength=3
sim.blast.shakeRadiusFactor=2.5

# Things lying on the field for the first unit that touches them. Only the size and the glow are here:
# what a pickup gives each side is structure rather than tuning and lives in SimConfig, next to which
# strain grows into which. The number that balances an eating evolution is sim.unit.<kind>.feedToEvolve.
#
# shineSeconds is how long one pulse of a pickup's glow takes, and ZERO MEANS IT DOES NOT SHINE, which
# is what most of them say. It is what lets a small thing be findable without a marker drawn over it:
# the things worth crossing a level for catch the eye, and everything else is scenery you notice when
# you are standing on it.
sim.pickup.mushroom.radius=0.9
sim.pickup.mushroom.look=mushroom
sim.pickup.mushroom.playerGrant=none
sim.pickup.mushroom.alienGrant=feed 1
sim.pickup.mushroom.shineSeconds=0
sim.pickup.flower.radius=0.9
sim.pickup.flower.look=flower
sim.pickup.flower.playerGrant=none
sim.pickup.flower.alienGrant=mutate brute
sim.pickup.flower.shineSeconds=0
# Small, because it has to be found rather than avoided, and it glows instead of being big. A crate
# the size of a body read as an obstacle and took up the ground beside a point that men stand on.
sim.pickup.supply_drop.radius=0.9
sim.pickup.supply_drop.shineSeconds=1.8
sim.pickup.supply_drop.look=supply_drop
sim.pickup.supply_drop.playerGrant=reinforce 3
sim.pickup.supply_drop.alienGrant=none
# Small: a rabbit is a dot with legs, and a hard target on purpose.
sim.pickup.rabbit.radius=0.8
sim.pickup.rabbit.look=rabbit
sim.pickup.rabbit.playerGrant=none
sim.pickup.rabbit.alienGrant=feed 1
sim.pickup.rabbit.shineSeconds=0
# One crate per gun, all the same size and all pulsing alike - only the colour says what is inside,
# and that colour is in graphic.properties because it is not a number anybody balances. The pulse is
# slower than a supply drop's: a gun is worth noticing and never worth running past a fight for.
sim.pickup.armoury_railgun.radius=1.2
sim.pickup.armoury_railgun.shineSeconds=2.6
sim.pickup.armoury_railgun.look=armoury_railgun
sim.pickup.armoury_railgun.playerGrant=arm railgun
sim.pickup.armoury_railgun.alienGrant=none
sim.pickup.armoury_flamer.radius=1.2
sim.pickup.armoury_flamer.shineSeconds=2.6
sim.pickup.armoury_flamer.look=armoury_flamer
sim.pickup.armoury_flamer.playerGrant=arm flamer
sim.pickup.armoury_flamer.alienGrant=none
sim.pickup.armoury_shotgun.radius=1.2
sim.pickup.armoury_shotgun.shineSeconds=2.6
sim.pickup.armoury_shotgun.look=armoury_shotgun
sim.pickup.armoury_shotgun.playerGrant=arm shotgun
sim.pickup.armoury_shotgun.alienGrant=none
sim.pickup.armoury_laser.radius=1.2
sim.pickup.armoury_laser.shineSeconds=2.6
sim.pickup.armoury_laser.look=armoury_laser
sim.pickup.armoury_laser.playerGrant=arm laser
sim.pickup.armoury_laser.alienGrant=none
# A barrel is a target, not cover. Small, and standing in the open.
sim.pickup.barrel.radius=1.0
sim.pickup.barrel.look=barrel
sim.pickup.barrel.playerGrant=none
sim.pickup.barrel.alienGrant=detonate
sim.pickup.barrel.shineSeconds=0

# The rabbit: alien food that walks. Taking one works exactly like any other pickup - what each side
# gets is in SimConfig, and the commander is offered nothing, so his only interest in one is denying
# it. These are the numbers for the half of it that moves.
sim.rabbit.speed=15
sim.rabbit.health=1
sim.rabbit.deathThroesSeconds=0.4
sim.rabbit.wander.enabled=true
sim.rabbit.wander.radius=18
sim.rabbit.wander.speedFactor=0.7
sim.rabbit.wander.arriveRadius=1
sim.rabbit.wander.pauseMinSeconds=0.3
sim.rabbit.wander.pauseMaxSeconds=1.1
sim.rabbit.wander.waypointTimeoutSeconds=3
# The dodge is deterministic on purpose: perpendicular to the shot, to the side it is already on, the
# same every time, so a player can learn to lead it. commitSeconds is what keeps that from making it
# trivial - once it has broken one way it cannot answer anything else until this runs out, so the
# counter to a dodge is a second shot rather than a perfect first one. margin is how wide of it a shot
# may pass and still count as coming at it; at zero it would only dodge shots that were dead on, which
# reads as clairvoyance rather than as nerves.
sim.rabbit.dodge.enabled=true
sim.rabbit.dodge.reactionRange=26
sim.rabbit.dodge.speed=32
sim.rabbit.dodge.durationSeconds=0.32
sim.rabbit.dodge.commitSeconds=0.9
sim.rabbit.dodge.margin=1.2
# Rabbits are content: a scenario spawns them, so there is no count here.

# What the commander throws. range is a DISTANCE and not a countdown: a bounce changes a grenade's
# direction and never its speed, so every throw covers the same ground however many walls it comes
# off - which is what makes banking one off a corner worth learning. It is spent along the aim
# direction and never towards the aim point, so pulling the view back with Tab can never reach
# further. range is comfortably longer than blastRadius, or every throw would be suicide; the two
# together are what decide how close the commander has to be standing when it goes off.
sim.grenade.cooldownSeconds=1.2
sim.grenade.speed=38
sim.grenade.range=34
sim.grenade.radius=0.55
sim.grenade.blastRadius=6

# ---- FIRE --------------------------------------------------------------------------------------
# What an explosion leaves burning where it was. One block for every fire in the game: what makes a
# barrel's fire worse than a grenade's is that the barrel's blast was wider, because every size here
# is a FRACTION of the blast's own radius. A new explosive therefore gets fire without naming a
# single number, and the flamethrower gets none, because it leaves no blast at all.
#
# It is ruined ground with a different declaration rather than a second mechanic (G0035), so all the
# slick rules hold: each circle is an ordinary body carrying an ordinary blow, the blow is the
# wounding kind, and the circle that burns you is the circle you can see. The one difference from
# venom is the side - a blast is on nobody's, so its fire catches the commander as readily as it
# catches what he threw it at, and everything steers round it.
#
# blobs is what makes it read as a fire rather than as a second explosion; one circle would be walked
# round. spreadFactor is well under one on purpose: the fire has to sit INSIDE the ground the blast
# already took, or an explosion would be reaching further after it was over.
sim.fire.blobs=5
sim.fire.radiusFactor=0.3
sim.fire.spreadFactor=0.65
# How long the ground burns. Drawn per circle between the two, so a fire goes out in patches rather
# than all at once - and long enough that a grenade thrown at your own feet fences you in for a
# while, which is the whole cost of the mechanic.
sim.fire.minSeconds=5
sim.fire.maxSeconds=10
# Far above any health in the game, exactly as a blast's is: walking into fire puts a man down rather
# than hurting him. Wounding, so he is a casualty somebody can come and get.
sim.fire.damage=1000
sim.fire.victimInvulnerableSeconds=1.6
# How much of its life a circle spends swelling, and how much collapsing again. THE BODY IS THE
# DRAWING, so these are reach as well as picture: a fire that is still growing has not reached you
# yet, and one that is dying lets go of the ground as it shrinks. Raise growFraction if fire catches
# people who thought they were clear; raise fadeFraction if it reads as snapping out of existence.
sim.fire.growFraction=0.15
sim.fire.fadeFraction=0.45

# The explosive barrel. It is a pickup rather than an obstacle on purpose: avoidance steers a unit
# around anything solid EXCEPT a pickup, so as an obstacle the aliens would carefully walk round it.
# Health is one because a barrel is a trigger standing in the open, not something to grind down -
# anything that touches it at all sets it off. blastRadius is the number that decides whether one is
# scenery or a reason to move: it is well over five times the barrel itself.
sim.barrel.health=1
sim.barrel.blastRadius=11
# How wide it goes off when something BIT INTO it rather than shooting it. Far smaller, on purpose:
# whatever set it off that way had its mouth on the thing and takes most of the blast itself, so a
# barrel the aliens blunder into is a gift rather than a disaster. Shooting one is still the full
# circle above, which is what keeps a barrel worth aiming at instead of worth waiting beside.
sim.barrel.bittenBlastRadius=4

# ---- MINE --------------------------------------------------------------------------------------
# The barrel's opposite number. A barrel is a thing standing in the open that the player sets off at
# the right moment; a mine is a thing lying in the open that decides for itself, so what one is worth
# is entirely where it was put. ONLY THE OTHER SIDE ARMS ONE - a commander and his troopers walk over
# them - but the blast, like every blast, is on nobody's side, so standing beside one when it goes is
# still his own doing.
#
# radius is small because it has to read as a dot on the ground rather than as something standing on
# it. triggerRadius is barely past the thing itself: a mine that reached out would be a grenade the
# player did not have to aim, and a creature is meant to nearly stand on one. blastRadius is well
# under a barrel's, because a level lays these in numbers.
sim.mine.radius=0.7
sim.mine.triggerRadius=2.0
# The moment. Long enough that the player sees it start and something nearby might still walk clear,
# short enough that whatever set it off is usually still standing on it. This is the number to turn
# if minefields read as free kills or as free warnings.
#
# Raised from 1.1 on 2026-09-20: at that length a mine read as going off the instant anything came
# near, so the fuse was a thing you were told about afterwards rather than a moment you got to watch.
# It is still a trap rather than a fence - much past this and whatever armed one has walked out of
# the blast before it goes, which makes a minefield ground nobody can cross rather than ground the
# other side dies on. triggerRadius came down with it: a longer fuse reaching further out would let
# a creature arm one from a stride away and be gone, so now it has to nearly stand on the thing.
sim.mine.fuseSeconds=2.5
sim.mine.health=1
sim.mine.blastRadius=9
# How long one flash of the fuse lasts at the start and at the end. It QUICKENS, and that acceleration
# is the whole tell - the number it is counting is never shown, because a player doing arithmetic
# mid-fight is pillar 1's problem.
# Widened with the fuse: the tell is the QUICKENING, and over two and a half seconds a flash that
# starts at a third of a second has barely anywhere to accelerate from.
sim.mine.flashFromSeconds=0.55
sim.mine.flashToSeconds=0.08

# ---- BLOAT -------------------------------------------------------------------------------------
# What a beam held on a body does to it. One block for every unit in the game rather than a number
# per strain, because what already varies between a grunt and a brute is the BODY: the same rise
# applied to a bigger corpse makes a bigger thing with nothing said about either.
#
# WHAT FILLS IS DRAWN ON IT, NOT DONE TO IT. The tell is a bright ring growing over the thing, sized
# in graphic.properties; the body itself is never touched. A corpse that physically swelled shoved
# everything standing near it around and quietly changed what a doorway was worth, which is a great
# deal of consequence for a tell.
#
# livingFactor is where "partly charged beforehand and finished later" lives: a thing still on its
# feet banks only this fraction of each shot. One would mean anything burnt to death arrives nearly
# full and there is no decision left about the body; too little and the kill counts for nothing and
# every corpse starts from scratch. At 0.6, burning a grunt down banks about four tenths of a ring
# and finishing it costs about another second of beam.
#
# settlePerSecond is what LETTING GO costs, and it runs only on a tick nothing was pointed at it - a
# thing being charged does not settle. Draining it while the beam was on it was the bug that made
# this read as broken: a grunt's corpse gained two hundredths of a ring per second and a brute's,
# whose bigger body takes the beam more slowly, actually went DOWN while it was being burnt.
#
# referenceRadius is the body a gun's bloatPerShot is quoted against, so A BIGGER THING TAKES LONGER
# in proportion to its radius. Set to the grunt's 1.8: one shot against a grunt is worth exactly what
# the gun says, and a brute is proportionally more work. In proportion to the radius rather than to
# the area on purpose - squaring it would make a brute four times the job rather than half again,
# and what the player has to feel is that a bigger creature is A BIT dearer, not that it is a
# different mechanic.
#
# settlePerSecond is what letting go costs: from full it takes about three seconds to come back to
# nothing, so walking away really is walking away and coming back is still worth it. holdSeconds is
# the least a charged body has left to lie there, refreshed every tick while there is any charge at
# all - it is what makes a half-filled corpse something to come back to rather than something you
# had to finish in one go.
#
# blastFactor is how wide the circle is as a MULTIPLE OF THE BODY'S OWN RADIUS, so a brute leaves a
# bigger bang than a grunt for the same reason it took longer to fill. Five puts a grunt's corpse at
# a mine's nine and a brute's at thirteen, past a barrel - raised from four because at twice the
# body's diameter a grunt's flash was smaller than the ring that charged it and went unnoticed. It
# is drawn in the RING'S OWN COLOUR rather than an explosion's, so the flash reads as that ring's
# payoff rather than as something else going off in the same place, and it leaves nothing burning,
# which no other explosion in the game can say - a corpse bomb that fenced off the ground it went
# off on is a tool you cannot use twice in the same place. Zero turns the mechanic off entirely.
#
# HOW LONG the flash lasts is sim.blast.durationSeconds, shared with every other explosion.
sim.bloat.referenceRadius=1.8
sim.bloat.livingFactor=0.6
sim.bloat.settlePerSecond=0.15
sim.bloat.blastFactor=5
sim.bloat.holdSeconds=1.2

# ---- GROUND ------------------------------------------------------------------------------------
# What standing on a kind of ground costs whatever is standing on it. ONE MEANS NOTHING HAPPENS,
# which is what every terrain here declares but one - the same "not for me" the rest of this file
# says with a zero, said with a number whose neutral value happens to be one. A kind of ground is
# otherwise a colour and a mood; these two numbers are the only thing that makes one a decision.
#
# THE TWO SIDES FEEL IT DIFFERENTLY, AND THAT IS THE MECHANIC. A thicket that slowed everybody
# equally would be scenery: both sides arrive at the fight in the same order they would have on open
# ground and the only thing that changed is how long the walk took. Slowing the player's side
# harder is what makes it ground he has to decide about - going round costs seconds, going through
# costs the seconds AND the exchange he has to have while wading - and it is the first thing on the
# field that is worse for him than for them by declaration.
#
# Nothing is closed off: a thicket is passable ground and every route, every flow field and every
# reachability check treats it as the open ground it is. What it changes is the pace and never the
# course, exactly as a slow from the beam does, and the two multiply.
#
# playerFactor is the number to turn if the thicket reads as a wall rather than as a decision; raise
# alienFactor towards one if it reads as somewhere the aliens are also stuck, which is not what it
# is for.
sim.ground.thicket.playerFactor=0.45
sim.ground.thicket.alienFactor=0.82

# ---- CASUALTY ----------------------------------------------------------------------------------
# What happens to a man shot off his feet. Gunfire and blasts leave a casualty; claws, a sweep and a
# leap kill outright. The bleed-out is the window the player has to reach him, so it is really a
# distance: at the commander's 19 units per second, eight seconds is most of the way across a level
# and back. Shorten it and only men who go down beside you are worth going for.
sim.casualty.bleedOutSeconds=8
# Under a second standing still in the open. Brought down from a second and a half on 2026-09-13:
# the price was reading as a commitment the player could not afford to make at all, so men were being
# left rather than fetched. Still long enough that where you do it matters, which is the whole point
# of the number - short enough is not the same as free.
sim.casualty.stabiliseSeconds=0.8
# He gets up hurt. Picking a man up is not the same as getting him out.
sim.casualty.reviveHealthFraction=0.4
sim.casualty.reviveInvulnerableSeconds=1.0
# How fast his clock runs while he is being hauled. Zero stops it: crossing the ground with him over
# your shoulder is free, and what you pay for it is the far longer patch-up below. Raise it if
# hauling turns out to be the answer to everything.
sim.casualty.draggedBleedFactor=0
# What having been hauled costs at the other end. Above one, so taking a man somewhere quiet is a
# decision against treating him where he fell rather than a strictly better one - but brought down
# from two and a half with the number above, or hauling would have been the branch nobody takes.
sim.casualty.hauledStabiliseFactor=1.6

# ---- ACTIONS -----------------------------------------------------------------------------------
# How close the commander must be, surface to surface, to do anything with his hands. One number for
# every action there is: learning one distance should be enough.
sim.action.reach=2.5
# Hauling. He backs away and nothing else: the part of a step that points at what he is dragging is
# thrown away, the sideways part is kept at a third, and what is left is slowed to well under half
# his pace. That, and having no hand free for the gun, is the whole price of not leaving a man.
sim.action.dragSpeedFactor=0.45
sim.action.dragLateralFactor=0.35
sim.action.dragGap=0.4

# The gun on a mount. health is comfortably over three times a trooper's - raised from 300 on
# 2026-09-20, when a level started putting four of them round ground the player has to hold and a
# wave was taking one apart faster than he could get off the last one. A turret is somewhere a level
# tells you to stand, and the other side should have to work to take it away. turnRate is a fraction of the angle
# left per second rather than degrees - it is the same shape as a spitter's, so the two read alike -
# and firingTurnFactor is the number that makes holding the trigger cost you the ability to track,
# which is the whole of what a mount trades for its rate of fire. blastRadius is deliberately far
# short of a barrel's eleven: losing one is an event, not a hole in the level.
sim.turret.radius=2.2
sim.turret.health=360
sim.turret.blastRadius=6
sim.turret.turnRate=2.5
sim.turret.firingTurnFactor=0.3
# What it is worth to a trooper. range is far past a man's own sight - on a gun he answers things that
# are still crossing the ground towards the squad. crewRadius is how far he will divert to get on one,
# and quietSeconds is how long he will sit on it with nothing in reach before he goes back to the
# squad: a man on a quiet gun is a man missing from it.
sim.turret.range=55
sim.turret.crewRadius=26
sim.turret.quietSeconds=6
sim.turret.weapon=turret_gun

# Static circles that block movement and projectiles.
sim.obstacle.radius=3.5
sim.obstacle.count=8

# How many times per tick overlaps and arena bounds are resolved together.
sim.collision.passes=3

# ---- NESTS -------------------------------------------------------------------------------------
# A hole in the ground that keeps sending more of ONE strain out of it. The third way a level puts
# creatures on the field, after "everything is here from the first tick" and a wave schedule - and
# the only one that is a PLACE, so ground you have cleared stays cleared only if you dealt with what
# was filling it in. What comes out of a particular nest is named where the nest is put down, not
# here: one nest is different from another only in that.
#
# health is a JOB, not a stray round. Raised from 200 to 600 on 2026-09-19: at two hundred a nest was
# four sidearm rounds, which made the whole mechanic something you deleted in passing rather than
# something you had to decide to take on. At six hundred it is twelve sidearm rounds - about three and
# a half seconds of holding the trigger with nothing else happening, which never happens - two railgun
# slugs, or five shotgun pulls with the muzzle against it. Twice a turret's three hundred on purpose:
# a turret is yours and losing one is an event, a nest is theirs and leaving one is a decision.
sim.nest.radius=2.4
sim.nest.health=600
sim.nest.periodSeconds=30
# How many come out at a time, drawn between the two from the level seed. A range rather than a
# number, for the reason a control point's crates are: walking up to one to see is worth something.
sim.nest.broodMin=2
sim.nest.broodMax=3
# AND HOW MANY COME OUT WHEN IT DIES. A nest is at its worst the moment you kill it, which is what
# makes destroying one a decision about when rather than a chore you get through.
sim.nest.deathBroodMin=2
sim.nest.deathBroodMax=3
# How far around the hole a brood is put down. Outside its own body, so nothing is hatched inside the
# thing that hatched it, and jittered inside those tiles like everything else (G0009).
sim.nest.hatchRadius=6
# HOW CLOSE SOMEBODY HAS TO COME BEFORE IT STARTS WORKING. Deliberately large, and not a detection
# range: it is the answer to a long level. A nest working from the first tick on a map four screens
# wide would have sent twenty creatures at empty ground before anybody arrived, and the player would
# meet the pile rather than the nest. Waking LATCHES - backing off does not stop it - or a nest would
# be a thing you could wait out from just outside this.
#
# Raised from 60 to 140 on 2026-09-19. Sixty was under half a biome, so a nest woke roughly when it
# came on screen and the first brood was still thirty seconds off - the player arrived before the
# level did. A hundred and forty is most of a biome ahead, so a nest is working by the time you reach
# it and what you walk into is a nest that has been busy rather than a nest about to start. It is
# still nowhere near the whole level: the point of the number survives, and the far biomes are quiet
# until the march gets there.
sim.nest.wakeRadius=140
# How far its cry carries when it is attacked. The same idea as a point's aggroRadius and sized like
# one: taking a nest away should bring the neighbourhood rather than be done quietly from range.
sim.nest.rouseRadius=48

# What it takes to hold a control point. captureSeconds is the number that decides whether a point is
# a formality or a fight: it is the window the level gets to answer the squad with. aggroRadius is
# much longer than a unit's own detection range on purpose - taking a point is meant to bring the
# level to you rather than let you take it quietly, so this reaches well past what a grunt could
# have noticed for itself.
sim.controlPoint.radius=6
sim.controlPoint.captureSeconds=5
sim.controlPoint.aggroRadius=48
# How far from a point the level lays its reinforcements. Outside the point's own radius, so fetching
# one is a step off the ground you are holding rather than something collected by standing still.
sim.controlPoint.reinforcementRadius=12
# How many crates a point is worth, drawn between the two from the level seed. A fixed number makes
# every point on a level worth exactly the same; a range means walking in to see what is there.
sim.controlPoint.reinforcementsMin=2
sim.controlPoint.reinforcementsMax=3

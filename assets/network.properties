# Networking tunables (ADR 0012). Changing anything here changes how machines talk to each other, never
# what the game does - that is game.properties, and the host sends its own to everyone who joins.
#
# The port a host listens on, TCP and UDP both. When it is taken the host tries the next portSearch
# ports in turn, which is how a second instance on the same machine finds one of its own; the port
# actually used is in the log.
net.port=47100
net.portSearch=8

# How long a link may take to open - the handshake included - before it is given up, and how long an
# open link may go without hearing anything before it counts as dropped. A dropped link is an unplugged
# pad (G0038): the player's commander stays on the field.
net.connectTimeoutMillis=5000
net.linkTimeoutMillis=10000

# How often a quiet link says it is still there. The same message measures round trip, so this is also
# how fresh the ping in the log is.
net.heartbeatMillis=250

# The largest unreliable message, kept under a typical path MTU so nothing is fragmented. The largest
# reliable one is not tuning but the wire format's, the same on every machine.
net.maxDatagramBytes=1200

# Simulated network conditions on top of the real ones, for playing two instances on one machine as if
# they were across a city. Applied to a copy that joins, both ways - what it sends and what it hears -
# so the round trip is twice latencyMillis; the host's own links stay clean. Zero is off, key by key.
# Latency and jitter apply to every message; loss and duplication only to unreliable ones. A spike stops
# the link for spikeMillis about every spikeEveryMillis and then lets everything held go at once, as a
# relay like Hamachi or a busy radio does. The seed
# makes a bad network misbehave the same way twice. latencySteps are the one-way latencies F3 steps a
# joining copy through during a latency playtest; the rest of the conditions stay as set here.
net.conditions.latencyMillis=0
net.conditions.jitterMillis=0
net.conditions.loss=0
net.conditions.duplicate=0
net.conditions.spikeEveryMillis=0
net.conditions.spikeMillis=0
net.conditions.seed=1
net.conditions.latencySteps=0,25,50,100

# The connection log: one file per running instance. The directory is relative to where the game runs;
# the Gradle run task points it at the repo's ai/logs/net instead. traceSize is how many per-message
# events are kept to dump when a link drops - a power of two. statsSeconds is how often each link's
# numbers, and each session's, are written while it runs; zero is never. A link to this same machine -
# the host's own game - writes none, and a paused session writes no session numbers.
net.log.dir=logs/net
net.log.level=INFO
net.log.traceSize=4096
net.log.statsSeconds=1

# How this copy paces its part of a session, in ticks (60 a second) - its own, never sent. Each peer tags
# its input a lead of ticks ahead and adapts the lead - between leadMin and leadMax - so its input reaches
# the sequencer marginTicks before that tick is sealed; the lead is the input delay a player feels. A peer
# holding more than bufferTicks sealed ticks plays one extra a frame to catch up, and never skips one;
# one further behind than leadMaxTicks - a world that came late, a game that stopped - plays as many as
# catchUpTicks a frame, or one more than its frames are worth on a machine drawing fewer frames than the
# world has ticks. catchUpTicks is how fast such a machine gets back: 4 plays a 215-tick backlog in 1.7 s
# at 60 frames a second and 4.2 s at 30, for that many ticks' work a frame. A peer that runs dry keeps as
# many ticks in hand as that cost, up to cushionMaxTicks, and gives one back after cushionCalmTicks
# without running dry: a link that delivers unevenly is played smoothly that much later, on screen and
# for its input; an even one keeps nothing. 8 took a 145-frame joiner over a spiky 45 +-40 ms link from
# frozen 12% of the time to 1.3%, for about 90 ms more delay while the link stayed bad; zero keeps none.
# The last three are read only where the sequencer runs - the host. It keeps historyTicks of sealed ticks,
# which bounds how far behind a peer being handed a snapshot may be. Every bundle datagram repeats the
# newest redundantTicks unacknowledged ticks, so a lost datagram costs nothing, and an older tick is sent
# again only once a round trip has passed without its acknowledgement; every copy after a datagram's first
# carries only the held input that changed, so each costs little - 8 seats always moving cost 8.8 kB a
# second per machine at 2 and 9.7 at 3. A peer that goes silent for spikeTicks longer than its usual gap
# and then sends a burst was held by a stalling link: that input is late and repeated, but its lead does
# not rise to cover the spike, so a spiky link costs a moment's delay at each spike rather than all the
# time; zero covers every spike.
net.pacing.leadMinTicks=2
net.pacing.leadMaxTicks=30
net.pacing.marginTicks=1
net.pacing.bufferTicks=2
net.pacing.catchUpTicks=4
net.pacing.historyTicks=600
net.pacing.redundantTicks=2
net.pacing.cushionMaxTicks=8
net.pacing.cushionCalmTicks=180
net.pacing.spikeTicks=3

# The session config: what every peer of a session must agree on, so the host's holds for all - it
# sends it to each peer that joins, and a joiner's own line here is not read. Every checksumTicks the
# peers compare worlds and keep a keyframe for a desync dump.
net.session.checksumTicks=60

# Finding a session on the local network - a LAN, or Hamachi, which carries broadcasts. A host announces
# itself every announceMillis to every network interface's broadcast address, and to this PC for a copy
# beside it; a joiner listens on port, which several copies on one PC can share, and forgets a host it
# has not heard from in forgetMillis. Windows Firewall asks about this port the first time a copy listens.
net.lan.port=47099
net.lan.announceMillis=1000
net.lan.forgetMillis=3500

# The relay (G0103, ADR 0023): read only where the relay runs, from its own copy of this file, never sent.
# roomsMax is how many rooms it holds at once - what one shared CPU seals on time is measured later - and
# a host who asks for one more is refused. A room closes when its last link has gone.
net.relay.roomsMax=32

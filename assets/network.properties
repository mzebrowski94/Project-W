# Networking tunables (ADR 0012). Changing anything here changes how machines talk to each other, never
# what the game does - that is game.properties, and the host sends its own to everyone who joins.
#
# The port a host listens on, TCP and UDP both. When it is taken the host tries the next portSearch
# ports in turn, which is how a second instance on the same machine finds one of its own; the port
# actually used is in the log.
net.port=47100
net.portSearch=8

# How long a link may take to open - the handshake included - before it is given up, and how long an
# open link may go without hearing anything before it counts as dropped. A dropped link is an unplugged
# pad (G0038): the player's commander stays on the field.
net.connectTimeoutMillis=5000
net.linkTimeoutMillis=10000

# How often a quiet link says it is still there. The same message measures round trip, so this is also
# how fresh the ping in the log is.
net.heartbeatMillis=250

# The largest unreliable message, kept under a typical path MTU so nothing is fragmented, and the
# largest reliable one, which a snapshot of the whole world has to fit in.
net.maxDatagramBytes=1200
net.maxMessageBytes=8388608

# Simulated network conditions on top of the real ones, for playing two instances on one machine as if
# they were across a city. Applied to a copy that joins, both ways - what it sends and what it hears -
# so the round trip is twice latencyMillis; the host's own links stay clean. Zero is off, key by key.
# Latency and jitter apply to every message; loss and duplication only to unreliable ones. The seed
# makes a bad network misbehave the same way twice. latencySteps are the one-way latencies F3 steps a
# joining copy through during a latency playtest; the rest of the conditions stay as set here.
net.conditions.latencyMillis=0
net.conditions.jitterMillis=0
net.conditions.loss=0
net.conditions.duplicate=0
net.conditions.seed=1
net.conditions.latencySteps=0,25,50,100

# The connection log: one file per running instance. The directory is relative to where the game runs;
# the Gradle run task points it at the repo's ai/logs/net instead. traceSize is how many per-message
# events are kept to dump when a link drops - a power of two. statsSeconds is how often each link's
# numbers, and each session's, are written while it runs; zero is never. A link to this same machine -
# the host's own game - writes none, and a paused session writes no session numbers.
net.log.dir=logs/net
net.log.level=INFO
net.log.traceSize=4096
net.log.statsSeconds=1

# How a session paces itself, in ticks (60 a second). Each peer tags its input a lead of ticks ahead and
# adapts the lead - between leadMin and leadMax - so its input reaches the sequencer marginTicks before
# that tick is sealed; the lead is the input delay a player feels. A peer holding more than bufferTicks
# sealed ticks plays faster to catch up, never more than catchUpTicks in one frame, and never skips one.
# Every checksumTicks the peers compare worlds and keep a keyframe for a desync dump. The sequencer keeps
# historyTicks of sealed ticks, which bounds how far behind a peer being handed a snapshot may be.
# Every bundle datagram repeats the newest redundantTicks unacknowledged ticks, so a lost datagram costs
# nothing; an older tick is sent again only once a round trip has passed without its acknowledgement.
# Higher survives more loss and costs one bundle (8 + 18 bytes a seat) per tick per peer each.
net.session.leadMinTicks=2
net.session.leadMaxTicks=30
net.session.marginTicks=1
net.session.bufferTicks=2
net.session.catchUpTicks=4
net.session.checksumTicks=60
net.session.historyTicks=600
net.session.redundantTicks=3

# Finding a session on the local network - a LAN, or Hamachi, which carries broadcasts. A host announces
# itself every announceMillis to every network interface's broadcast address, and to this PC for a copy
# beside it; a joiner listens on port, which several copies on one PC can share, and forgets a host it
# has not heard from in forgetMillis. Windows Firewall asks about this port the first time a copy listens.
net.lan.port=47099
net.lan.announceMillis=1000
net.lan.forgetMillis=3500

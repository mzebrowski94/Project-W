# Controls: every binding and every feel number.
#
# Nothing here can change what the game does - only what asks it to. A binding is not a rendering
# setting and emphatically not a simulation number; the file the balance lives in is game.properties.
#
# Anything missing or misspelt falls back to the value shown as the default and says so in the log,
# so a broken line costs you one binding rather than the game.
#
# The input map in docs/design/README.md is the list of what exists. Adding a binding means a row
# there in the same change - that table is the only guard against two features claiming one input.

# --- Player one: keyboard and mouse ------------------------------------------
# In the alpha, slot zero is the keyboard's and no gamepad ever takes it. Key names are libGDX's
# own: W, A, S, D, Up, Down, Left, Right, Tab, Q, E, F, 1, 2, 3, 4, Space, Shift, and so on.
controls.key.moveUp=W
controls.key.moveUpAlias=Up
controls.key.moveDown=S
controls.key.moveDownAlias=Down
controls.key.moveLeft=A
controls.key.moveLeftAlias=Left
controls.key.moveRight=D
controls.key.moveRightAlias=Right
# LEFT, RIGHT or MIDDLE.
controls.mouse.fire=LEFT
controls.mouse.strike=RIGHT
controls.key.grenade=Q
controls.key.action=E
controls.key.drag=F
# Pulls the view back for a look, and puts it back. One camera frames everybody, so this moves
# everybody's view - including when a pad presses its own zoom button.
controls.key.zoom=Tab
# Swaps the bottom bar between the players' panels and the roll call - a compact row per player for
# games of more than four. The roll call is a placeholder for now.
controls.key.rollCall=`
# Alpha-phase scaffolding, as the input map says: the intended binding is one button and a radial
# menu, and these four keys are what makes the verbs playable until there is an interface for it.
controls.key.orderFollowMe=1
controls.key.orderForward=2
controls.key.orderDefence=3
controls.key.orderCancel=4

# --- Players two to four: gamepads -------------------------------------------
# Buttons are named by WHERE THEY ARE, not by what is printed on them: SOUTH is A on an Xbox pad and
# Cross on a PlayStation one, WEST is X and Square, EAST is B and Circle, NORTH is Y and Triangle.
# One table serves both, and the game shows the player the right label for the pad he is holding.
#
# Names: NONE SOUTH EAST WEST NORTH L1 R1 L3 R3 START SELECT DPAD_UP DPAD_DOWN DPAD_LEFT DPAD_RIGHT
# Axes:  NONE LEFT_X LEFT_Y RIGHT_X RIGHT_Y LEFT_TRIGGER RIGHT_TRIGGER
#
# EVERY action has both a button and a trigger, and either may be NONE. A trigger is not a
# second-class button here - the hand strike is on one, and firing is on a face button and a trigger
# at once.
controls.pad.moveX=LEFT_X
controls.pad.moveY=LEFT_Y
controls.pad.aimX=RIGHT_X
controls.pad.aimY=RIGHT_Y
controls.pad.fire=WEST
controls.pad.fireTrigger=RIGHT_TRIGGER
controls.pad.strike=NONE
controls.pad.strikeTrigger=LEFT_TRIGGER
controls.pad.grenade=EAST
controls.pad.grenadeTrigger=NONE
controls.pad.action=SOUTH
controls.pad.actionTrigger=NONE
controls.pad.drag=R1
controls.pad.dragTrigger=NONE
controls.pad.zoom=L1
controls.pad.zoomTrigger=NONE
controls.pad.pause=START
controls.pad.pauseTrigger=NONE
controls.pad.orderFollowMe=DPAD_UP
controls.pad.orderFollowMeTrigger=NONE
controls.pad.orderForward=DPAD_RIGHT
controls.pad.orderForwardTrigger=NONE
controls.pad.orderDefence=DPAD_DOWN
controls.pad.orderDefenceTrigger=NONE
controls.pad.orderCancel=DPAD_LEFT
controls.pad.orderCancelTrigger=NONE

# --- Facts about the hardware, not about the game ----------------------------
# gdx-controllers' canonical mapping has NO trigger axes - only the two shoulder buttons underneath
# the bumpers, which an XInput pad leaves undefined. So a trigger is read as a raw axis by index,
# and these are SDL's. If the triggers do nothing on a pad, the line logged when it is seated says
# how many axes it has and which the game is reading; change these two to match.
controls.pad.leftTriggerAxis=4
controls.pad.rightTriggerAxis=5
# SDL triggers read zero when released and one when fully squeezed, which is the default. A pad that
# reads -1 when released needs this on, or its triggers will only register past halfway.
controls.pad.triggerRestsAtMinusOne=false

# --- How hard a stick has to be pushed ---------------------------------------
# Radial, not per-axis: testing each axis on its own makes a diagonal cross the line sooner than a
# straight push, which players feel as the stick snapping to the axes.
controls.pad.moveDeadZone=0.2
# Larger than the walking one on purpose. A pointing stick resting slightly off centre must not
# swing his aim across the field while he is walking somewhere.
controls.pad.aimDeadZone=0.3
# How far a trigger counts as squeezed. A pad that reports its triggers as buttons rather than as
# axes reads as fully squeezed or not at all, and this number then makes no difference to it.
controls.pad.triggerThreshold=0.4

# Pages and modals - the pause menu, and the menus to come (docs/ui/menu_layout_agent.md, section 6).
# Arrows (and W/S) move the selection; the mouse hovers and clicks; any seated pad moves it with the
# d-pad or the left stick. Esc, or a pad's pause button, opens the pause menu in a level.
controls.ui.key.confirm=Enter
controls.ui.key.confirmAlias=Space
controls.ui.key.back=Escape
# libGDX names the Backspace key Delete.
controls.ui.key.backAlias=Delete
# Pad buttons by position: SOUTH is A / Cross, EAST is B / Circle.
controls.ui.pad.confirm=SOUTH
controls.ui.pad.back=EAST
# How far a stick must be pushed to move the selection, and how a held direction repeats.
controls.ui.nav.stickThreshold=0.5
controls.ui.nav.repeatDelaySeconds=0.35
controls.ui.nav.repeatIntervalSeconds=0.09
# How far the mouse must move, in screen pixels, before it takes the selection from the keys or a pad.
controls.ui.nav.pointerWakePixels=4

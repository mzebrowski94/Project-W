sim.finale.keep.rules.apart=1.5
sim.finale.keep.rules.gap=2
sim.finale.keep.rules.shapes=bar 3 1; bar 1 3; bar 2 1; ell 2 2; ell 3 2; ell 2 3
sim.finale.keep.rules.cover=2 4 3 11 1 11
sim.finale.keep.rules.turrets=2 2 3 9 2 10
sim.finale.keep.rules.mines=8 12 3 13 -14 8
sim.finale.keep.rules.barrels=4 6 3 11 -13 6
sim.finale.keep.rules.pickups=2 2 2 4 -5 5

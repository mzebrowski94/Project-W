# Simulation tunables, one domain of them. How the files in assets/sim/ are read: world.properties.

# FINALES. Every kind a mission ends on (G0064, missions ticket 04), a block each: a fixed SKELETON and the rules that
# place everything else round it (G0120). Every position is a tile offset "dx dy" from the finale's anchor - its
# middle column (rounded west) and its middle row, (197, 15) on the Adventures' ground. The finale's own stream draws
# the kind, then one bit that flips the skeleton north-south - never east-west, so west stays the way in - and then,
# from streams of their own, what its rules place; none of it moved by the tier (G0063) or the players seated (G0119).
# A new finale is a constant in FinaleKind and a block here, through the new-biome skill.
#
# ground: a biome's ground (biomes.properties) with its width fixed and no dealt coat - no houses, patches, crags or
# outcrops. Its rock is its cover, dealt by its rules.
#
# hold (skeleton): the point that holds afterwards (G0061). post is where the point stands; watch how far round it
# must be clear for it to be held, in world units; mouths=name dx dy width height; ...  where the waves come onto the
# field.
#
# lair (skeleton)=unit|nest <kind> dx dy; ... or hole dx dy  what rises inside the watch at fixed spots - the keep's
# holes and its boss. Left out is none. A hole's strain is dealt from pool.strains, uniformly among those dealt fewer
# than pool.most holes so far (G0120) - every strain a walker with a hole of its own. Its ground is the finale's whole rect: nothing of it is on the field until every commander
# on his feet stands there, and then all of it is - its holes, the gun caches its rules placed, then its boss - each
# creature facing the nearest of them (G0048). The tier reaches it only through health and the nest period.
#
# rules (G0120): everything else, through Scatter, in MIRRORED NORTH-SOUTH PAIRS - one of a pair south of the anchor's
# row, its mirror north - so no flank is bare where the other is full. A lot is "fewest most near far west east": a
# count dealt from fewest to most, both even, in pairs; in a band round the post, near to far tiles from it, on column
# offsets west to east.
#   apart    tiles between any two things the rules put down round the post, edge to edge.
#   gap      tiles a piece of cover keeps off every other piece, the post, the mouths, the lair's spots and the straight
#            routes from each mouth to the post and from the post to the lair's unit - so every piece's LEE, the side
#            away from what it shelters from, is open ground reached from the start.
#   shapes   the pieces cover is dealt from, each equally: bar <across> <up> a straight bar; ell <across> <up> an L one
#            tile thick whose corner turns to what it shelters from - the lair's unit, else the nearest mouth.
#   cover    pieces of cover. turrets: guns on mounts, FIXED - fewest and most the same, never dealt.
#   mines, barrels: dealt. pickups: one of each of pickupKinds, in pairs, in that order.
#   lair     the gun caches the lair raises, a fixed count, each a kind dealt from lairKinds, none twice; 0 0 0 0 0 0
#            and no kinds for none.
#   inReach  whether the cover, the turrets and the lair's caches stand inside the barrage of the lair's unit - the
#            shortest range its patterns fire - so a man who uses them takes the patterns for it.
# Counts start from the hand-made layouts they replaced (G0087): barrels 4-8, a crate and a gun's cache in the hold;
# mines cut to a handful (Mateusz, 2026-11-24: "decrease greatly").
#
# waves=afterSeconds role mouths; ...  in order, held back until the post is taken, each naming a ROLE (G0120) and a
# mouth the hold has - or several joined by +, which come on the same tick as one wave, each mouth sending its own
# count (G0087). roles.<role>=strain countMin countMax; ...  defines each role once - fodder, fast, ranged, heavy -
# and the finale's stream deals one member to each wave; its count is drawn like a roster's and scaled by the tier's
# enemyPercent with no ramp. The timing, the role and the mouths are never tiered; who comes is not learnt, the rhythm
# is. Each finale names its own strains (G0064). No rooted strain (the leech) and no burrower (the worm): neither
# walks out of a mouth.

# The redoubt (Adventure 1). A bare square to see across with four guns round the post, mines across the approaches,
# barrels in the open between the guns, and a crate and a flamer by the post for the man who loses his gun in the first
# wave. Waves from all four corners, alternating, so no side of the square is safe for long; runners among the slow
# ones pull the squad off the line the brutes walk up. Watch 118: past the square's far corners, and about seven tiles
# west of the finale's edge, into the ridge - the last biome keeps everything hostile outside it. Its cover stands
# between the post and the corners, off the diagonals the waves walk in on, each L's corner to its nearest gate.
#
# Harder (G0087, provisional, for review): half its waves, most of them late, come from two mouths at once - opposite
# corners, so the squad faces both ways - each mouth sending about what one did alone, trimmed by up to a fifth where
# two at once would be a wall (the brutes, the late runners and grunts).

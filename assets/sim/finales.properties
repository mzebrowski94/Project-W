# The keep (Adventure 2). The redoubt's ground on burnt earth - somewhere fought over already - with fewer mines, no
# waves, and at its east end the boss grunt rising among a hole of every strain that walks and a cache of every gun, once
# every player is inside. The boss is the fight: one finale, one kind of fight - the redoubt is the waves, the keep the
# boss (Mateusz, 2026-10-06, G0064 amended). He sits inside the watch, so holding the post means killing him and his
# nests; he stands 13 tiles (65 units) from the post, well inside where he notices anybody and his spew reaches (110),
# so his barrage starts when he rises. Its cover and its two guns stand between the post and him, inside his barrage
# (G0120): a gun there is a tool that costs exposure to use, never a seat behind the post. Barrels keep west of six
# columns east, so his first ring never sets one off in his own face. The six lair nests take sim.nest.firstBroodSeconds
# like any nest (G0062): play it before retuning.

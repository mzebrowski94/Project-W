# Simulation tunables, one domain of them. How the files in assets/sim/ are read: world.properties.

# FINALES. Every kind a mission ends on (G0064, missions ticket 04), a block each: a set piece, the same layout every
# time. Every position is a tile offset "dx dy" from the finale's anchor - its middle column (rounded west) and its
# middle row, (197, 15) on the Adventures' ground - and one bit of the finale's stream flips the whole of it
# north-south, never east-west, so west stays the way in. Drawn equally from its own stream, whatever the tier. A new
# finale is a constant in FinaleKind and a block here, through the new-biome skill.
#
# ground: a biome's ground (biomes.properties) with its width fixed and no dealt coat - no houses, patches, crags or
# outcrops. Its rock is pieces=dx dy width height; ...  each rect's south-west corner an offset from the anchor.
#
# hold: the point that holds afterwards (G0061) and what stands round it, none of it scaled by tier. post is where
# the point stands; watch how far round it must be clear for it to be held, in world units; turrets, mines, barrels
# a "dx dy" each; pickups=pickup <kind> dx dy; ...  (a gun's cache may lie here, never in a biome); mouths=name dx dy
# width height; ...  where the waves come onto the field.
#
# waves=afterSeconds strain countMin countMax mouth; ...  in order, held back until the post is taken, each naming a
# mouth the hold has. The count is drawn like a roster's and scaled by the tier's enemyPercent with no ramp; the
# timing, the strain and the mouth are never tiered. Each finale names its own strains.
#
# lair=unit|nest|pickup <kind> dx dy; ...  what rises inside the watch, in the order written - the keep's. Left out
# is none. Its ground is the finale's whole rect: nothing of it is on the field until every commander on his feet
# stands there, and then all of it is, each creature facing the nearest of them (G0048). Positions, never counts: the
# tier reaches it only through health and the nest period.

# The redoubt (Adventure 1). A bare square to see across: four guns round the post at the corners of a square - a gun
# on a diagonal covers two gates - mines across the approaches from each corner rather than round the post, barrels
# in the open between the guns, a crate and a flamer behind the post for the man who loses his gun in the first wave.
# Waves from all four corners, alternating, so no side of the square is safe for long; runners among the slow ones
# pull the squad off the line the brutes walk up. Ported from AdventureScenario's redoubt, offsets from (197, 15);
# each count a range of about +-1 round the Adventure's. Watch 118: past the square's far corners, and about seven
# tiles west of the finale's edge, into the ridge - the last biome keeps everything hostile outside it.
sim.finale.redoubt.ground.widthMin=34
sim.finale.redoubt.ground.widthMax=34
sim.finale.redoubt.ground.regions=3
sim.finale.redoubt.ground.base=dust
sim.finale.redoubt.ground.fallback=ash
sim.finale.redoubt.ground.pieces=-9 -3 2 3; 8 1 2 3; -1 -10 3 1; 0 9 3 1
sim.finale.redoubt.hold.post=0 0
sim.finale.redoubt.hold.watch=118
sim.finale.redoubt.hold.turrets=-5 -5; 5 -5; -5 5; 5 5
sim.finale.redoubt.hold.mines=-9 -8; -6 -6; -11 -4; -7 -10; 9 -8; 6 -6; 11 -4; 7 -10; -9 8; -6 6; -11 4; -7 10; 9 8; 6 6; 11 4; 7 10; -4 0; 4 0; 0 -5; 0 5
sim.finale.redoubt.hold.barrels=-5 -3; 5 -3; -5 3; 5 3; 0 -8; 0 8; -12 0; 12 0
sim.finale.redoubt.hold.pickups=pickup crate -3 0; pickup armoury_flamer 3 0
sim.finale.redoubt.hold.mouths=nw -14 -13 4 4; ne 12 -13 4 4; sw -14 8 4 4; se 12 8 4 4
sim.finale.redoubt.waves=6 grunt 9 11 nw; 5 grunt 9 11 se; 4 runner 7 9 ne; 7 spitter 4 6 sw; 4 runner 7 9 sw; 8 brute 4 6 ne; 5 frog 5 7 se; 4 runner 9 11 nw; 8 grunt 11 13 sw; 4 spitter 4 6 nw; 8 brute 5 7 se; 4 runner 11 13 ne

# The keep (Adventure 2). The redoubt's ground on burnt earth - somewhere fought over already - with fewer mines, no
# guns on mounts, no waves, and at its east end the boss grunt rising among a nest of every strain that walks and a cache of
# every gun, once every player is inside. The boss is the fight: one finale, one kind of fight - the redoubt is the
# waves, the keep the boss, fought with what the squad carries (Mateusz, 2026-10-06, G0064 amended). He sits inside the watch, so holding the post means
# killing him and his nests; he stands 13 tiles (65 units) from the post, a little further than he notices anybody
# (58), so taking the post does not wake his barrage by itself. Ported from AdventureTwoScenario's keep and lair,
# offsets from (197, 15). Dropped: Adventure 2's held-back waves, its four guns round the post, and the two ants asleep in its far corners
# (ticket 04) - the keep's creatures rise from the lair. The six lair nests take sim.nest.firstBroodSeconds like any nest
# (G0062): play it before retuning.
sim.finale.keep.ground.widthMin=34
sim.finale.keep.ground.widthMax=34
sim.finale.keep.ground.regions=3
sim.finale.keep.ground.base=ash
sim.finale.keep.ground.fallback=dust
sim.finale.keep.ground.pieces=-9 -3 2 3; 8 1 2 3; -1 -10 3 1; 0 9 3 1
sim.finale.keep.hold.post=0 0
sim.finale.keep.hold.watch=118
sim.finale.keep.hold.mines=-9 -8; -6 -6; 9 -8; 6 -6; -9 8; -6 6; 9 8; 6 6; -4 0; 4 0
# No east barrel: the boss rises there, and his first ring would set it off in his own face.
sim.finale.keep.hold.barrels=-5 -3; 5 -3; -5 3; 5 3; -12 0
sim.finale.keep.hold.pickups=pickup crate -3 0; pickup armoury_laser 3 0
# Holes first, then the cache, then the boss, as Adventure 2 places them: the boss at the keep's east end, a hole of
# every walking strain round him, a gun of every kind between him and the post.
sim.finale.keep.lair=nest grunt 13 -6; nest spitter 9 -3; nest runner 16 -3; nest frog 10 5; nest ant 16 3; nest brute 13 6; pickup armoury_shotgun 7 -3; pickup armoury_railgun 7 0; pickup armoury_laser 6 3; pickup armoury_flamer 16 0; unit boss_grunt 13 0

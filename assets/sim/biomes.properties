# The cut. Corridors through straight slabs of rock - no getting round anything, so a fist in its face or a barrel
# beside it is the answer (Adventure 2: 2.7% patches, 12.4% rock in nine bars and blocks). Told from the quarry by
# its ground: sand rather than dust, and slabs with no corner bent off them where the quarry's rock turns, a bar
# being a wall to walk the length of - its outline broken (ragged), so from above it reads as split rock rather
# than a block. No house - the quarry is the place with a base in it. Blobs of ash rubble between the slabs. The
# Adventure's shotgun cache is a crate here. Its lone grunt is dropped: every roster line is a pack of its own,
# kept packApart from the others, and with the giants (G0071, 0-1 each) a seventh line did not fit the cut dealt
# first on 9 seeds of 2000 - and its ragged slabs took a little more room again, so brutes, spitters and ants
# were trimmed by one at the top. The slinger (G0074, 0-1) took a brute off the top again. Its 3-5 geysers (G0089,
# provisional, for review) are what the corridors add: a slab's length you cannot go round, and in one of them a
# geyser to time rather than fight through - the squad holds short of an eruption and goes on when it is quiet.

# Simulation tunables, one domain of them. How the files in assets/sim/ are read: world.properties.

# BIOMES. Every kind a mission deals from (missions ticket 03), a block each: ground, roster and furniture. Counts,
# never places - where each thing goes is placement's (G0068, sim.mission.placement.*). A new biome is a constant in
# BiomeKind and a block here, through the new-biome skill.
#
# ground: what map lays, in coats each from its own stream - houses, then patches in order, then crags, then
# outcrops; a coat left out is off. widthMin/Max and regions are geometry, so ground too. How much of a coat is a
# density - a fraction of the biome, laid until reached - never a count; houses are the one count, a house being a
# place. patches=rect|blob <terrain|neighbour> density sizeMin sizeMax; ...  where neighbour is the base of the
# biome on the nearer side, or fallback. crags.terrain is what the masses are: rock, or lava - the caldera's pools
# (G0091, provisional, for review) - never ground something stands on.
#
# roster=loose|nest <strain> min max; ...  Loose is put down unaware, in packs; nest is a hole of that strain. The
# ranges are this biome at the first position on medium: the tier and the ramp scale every count, through
# Roster.count and nothing else (G0063).
#
# furniture: points, barrels, rabbits, boulders and trees as min/max, and pickups=pickup <kind> min max; ...  Never
# scaled by tier or ramp, and never a gun's cache - that is a finale's. treesByNest of the trees stand by each nest
# before the rest go anywhere (G0072); zero is none, which is every biome but the fen. turrets stand each within
# pointReach of a point (G0082); zero is none, which is every biome but the plain. geysers erupt in fire on a cycle
# of their own (G0089, provisional, for review), each kept geyserKeepOff off the points, the nests and the ways in;
# zero is none, which is every biome but the cut and the caldera.
#
# Ported from the Adventures and scaled to the wider biome: 50-58 columns against the Adventure's 29, so every
# furniture range is about 1.8 times the Adventure biome's count, and patches a size bigger so a wide biome is not
# confetti. ROSTERS ARE CUT TO THE ROOM placement leaves (missions stage 7, measured over 2000 seeds): a biome holds
# about 3-7 holes and 35-75 loose creatures at its median seed, and its worst seeds 1-2 and 20-50 - the first biome
# least, since nothing hostile stands within startKeepOff of the start. Every count must fit on hard at the last
# position (x1.625, or x1.25 if it is dealt first), and a seed where one does not is a sweep fault (G0068), so a
# block holds 1-2 holes and at most about 25 loose creatures. The x1.8 ports had 4-8 holes and up to 39.

# The plain. Open, three patches, pebbles of rock (Adventure: 4% patches, 0.6% rock). Rabbits to deny.
# One or two turrets by its points (G0082, provisional): open ground is where a gun's long range pays, and
# with two or three points at most two means one is always held on foot. Fewer than the redoubt's four, so
# the finale is still the place built round guns.

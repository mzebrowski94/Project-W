# The fen. Standing water with islands of reeds - fewer and bigger than the brake's undergrowth, so it is ground
# worth going round rather than ground you wade - and frogs ruining what is left between them, with ants on it
# (Adventure 2: 2.7% patches, 12.5% reeds in three clumps, 0.6% rock). No square anywhere: every patch a blob, its
# pebbles dropped and no house. Its trees are what it has instead (G0072): 5-8, one or two by each hole first, their
# foliage hiding whatever stands beneath it - frogs waiting under it are the fen's ambush. Its boulders kept
# beside them. The only biome on mire, the only one with frogs in it, and the only one with trees. The

# The caldera, new (ticket 16, G0091, provisional, for review): ash with pools of lava nothing stands on, more geysers
# than the cut and magma spitters whose spit leaves fire - where the ground itself is the danger. Told from the cut,
# which has geysers too, by everything else: ash rather than sand, pools rather than slabs, so it is ground to go
# round rather than corridors to go down, and twice its geysers. Its pools are crags of lava - the crag coat's
# repairs keep every pass open and no passage under the clearance, which a patch's would not - fewer and bigger than
# the badlands' rock (smoothing 5 against 4), and no other rock of its own: a boulder or two at most. Blobs of
# neighbour ground between them, as the fen's. No house, no tree. Its barrels kept: a barrel by a pool is a fire you
# light on purpose, and a spitter that eats one is charged. Spitters and magma spitters to hold the ground between the
# pools - lava stops a shot as rock does, so a pool is cover as well as a hole - and grunts and ants to come round
# them at you. Its base is the badlands' ash, so the deal never lays the two side by
# side. The magma spitter is its candidate signature strain (ticket 19, open).

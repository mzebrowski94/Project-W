# Simulation tunables, one domain of them. How the files in assets/sim/ are read: world.properties.

# ---- CASUALTY ----------------------------------------------------------------------------------
# What happens to a man put off his feet: one wound too many, or a blow that puts him down - an
# explosion's (G0053). Claws, a sweep and a leap kill outright. The bleed-out is the window the player has to reach him, so it is really a
# distance: at the commander's 19 units per second, eight seconds is most of the way across a level
# and back. Shorten it and only men who go down beside you are worth going for.
sim.casualty.bleedOutSeconds=8
# Under a second standing still in the open. Brought down from a second and a half on 2026-09-13:
# the price was reading as a commitment the player could not afford to make at all, so men were being
# left rather than fetched. Still long enough that where you do it matters, which is the whole point
# of the number - short enough is not the same as free.
sim.casualty.stabiliseSeconds=0.8
sim.casualty.reviveInvulnerableSeconds=1.0
# How fast his clock runs while he is being hauled. Zero stops it: crossing the ground with him over
# your shoulder is free, and what you pay for it is the far longer patch-up below. Raise it if
# hauling turns out to be the answer to everything.
sim.casualty.draggedBleedFactor=0
# What having been hauled costs at the other end. Above one, so taking a man somewhere quiet is a
# decision against treating him where he fell rather than a strictly better one - but brought down
# from two and a half with the number above, or hauling would have been the branch nobody takes.
sim.casualty.hauledStabiliseFactor=1.6

# ---- WOUNDS ------------------------------------------------------------------------------------
# What a wound does to a man still on his feet (G0053). Every blow says what it does to a man - a
# wound, putting him down, or killing him - and his wounds are counted against sim.commander.maxWounds
# and sim.trooper.maxWounds. Being revived clears them all.
#
# graceSeconds is how long one wound protects him from the next, and from nothing heavier: a pellet
# must never buy him protection from a leap. It is what stops a spatter of venom or a burst of spew
# filling every wound on one tick. Too short and a shotgun spray is a down; too long and standing in
# fire is free.
sim.wound.graceSeconds=0.5
# How long ground that wounds him - fire, venom - throws him off itself for. The throw is
# knockbackSpeed on the ground's own block, bleeding off over exactly this long, so it carries him
# about half of speed x seconds: 30 x 0.3 is four and a half units, a circle's width.
sim.wound.shoveSeconds=0.3
# What a wound costs a man still on his feet: this much of his pace, and his gun's time between shots
# multiplied by this. Mild on purpose - slower is exactly when he most needs to get away, and a death
# spiral is not a mechanic. His hand strike and his grenade are untouched: the sweep is the answer to a
# leap, and a wounded man who cannot answer one is already dead.
sim.wound.speedFactor=0.85
sim.wound.cooldownFactor=1.25
# How long after his LAST wound a man's wounds clear on their own. Zero is never: nobody mends without
# the self-treatment upgrade, which adds to this through the MEND_SECONDS stat.
sim.wound.mendSeconds=0

# ---- MEDKITS -----------------------------------------------------------------------------------
# How many a level that asks for them scatters beside its control points (the Adventures do). What one
# is lives under sim.pickup.medkit in pickups.properties. It clears every wound and is worth nothing to
# a man without one, so he walks over it and it stays for whoever needs it.
sim.medkit.perLevel=3

# ---- ACTIONS -----------------------------------------------------------------------------------
# How close the commander must be, surface to surface, to do anything with his hands. One number for
# every action there is: learning one distance should be enough.
sim.action.reach=2.5
# Hauling. He backs away and nothing else: the part of a step that points at what he is dragging is
# thrown away, the sideways part is kept at a third, and what is left is slowed to well under half
# his pace. That, and having no hand free for the gun, is the whole price of not leaving a man.
sim.action.dragSpeedFactor=0.45
sim.action.dragLateralFactor=0.35
sim.action.dragGap=0.4

# A door: a wall that opens (G0069), in every doorway of a mission's houses and gatehouses, shut at the start and
# never shut again. Opened on stabilise's rules - the action key held at arm's length, standing still, for
# openSeconds; a wound, going down or a step away loses the work - by a commander and at most one trooper together,
# never faster than one. An opened door is seen sinking for sinkSeconds, a look only: its doorway is open ground from
# the tick it opened. Broken by a leap, a blast or a heavy gun and nothing else; health is six grunt leaps of
# leapDamage, one number whatever the strain, and about a second and a half of the flamer held on it (measured
# 2026-10-05: 1.4 s from 3 away, 1.7 s from 14). A blast breaks it outright. A leap landing on it shakes the ground
# for the commanders near it.
sim.door.openSeconds=3
sim.door.sinkSeconds=0.4
sim.door.leapDamage=100
sim.door.health=600
# A trooper whose way runs into a shut door within waitDistance has his way shut by it: the first of them at arm's
# length opens it and the rest stop here and watch their sectors (G0069). Two tiles, so they gather behind him.
sim.door.waitDistance=10
# A creature whose leap lands on a shut door is thrown back off it at throwSpeed, held while it slows to a stop over
# throwSeconds - then it leaps again on its own leap clock (G0069). About a body's length or two.
sim.door.throwSpeed=40
sim.door.throwSeconds=0.25
sim.door.shake.strength=1
sim.door.shake.radius=30
sim.door.shake.seconds=0.2

# Ice (G0115, ADR 0025, provisional, for review): what stands across a chokepoint of the rift's maze - a door nobody
# opens. Its ground stays its own, so generation counts the way it shuts as open. Every shot from the squad's side chips
# it, by that shot's damage: six from the sidearm, a moment of the squad's fire. A blast breaks it outright,
# a leap lands sim.door.leapDamage on it (three leaps), and the swarm's own shots do nothing. A hunter whose way runs
# through it walks up to it and leaps at it, way round or not (G0116, 2026-11-23). A trooper whose way runs into it
# comes within clearDistance of it - from his middle to its nearest part - stands, and shoots it down, while nothing
# of the swarm is his to fight (G0117): nearer, and the squad bunches up against it; further, and his shots go out
# before they reach it.
sim.ice.health=300
sim.ice.clearDistance=10

# The gun on a mount. health is comfortably over three times a trooper's - raised from 300 on
# 2026-09-20, when a level started putting four of them round ground the player has to hold and a
# wave was taking one apart faster than he could get off the last one. A turret is somewhere a level
# tells you to stand, and the other side should have to work to take it away. turnRate is a fraction of the angle
# left per second rather than degrees - it is the same shape as a spitter's, so the two read alike -
# and firingTurnFactor is the number that makes holding the trigger cost you the ability to track,
# which is the whole of what a mount trades for its rate of fire. blastRadius is deliberately far
# short of a barrel's eleven: losing one is an event, not a hole in the level.
# blastResistance is the per cent of a blast's damage it shrugs off (G0082, provisional): at 90 a blast
# takes a hundred of its 1200, so a grenade or a bloat beside it scars it and only the twelfth takes it - a turret is
# taken or shot down, never blown up.
# Only blasts - gunfire, fire and claws land in full - and only the gun: the man on it takes the blast as ever.
sim.turret.radius=2.2
sim.turret.health=1200
sim.turret.blastResistance=90
sim.turret.blastRadius=6
sim.turret.turnRate=2.5
sim.turret.firingTurnFactor=0.3
# What it is worth to a trooper. range is far past a man's own sight - on a gun he answers things that
# are still crossing the ground towards the squad. crewRadius is how far he will divert to get on one,
# and quietSeconds is how long he will sit on it with nothing in reach before he goes back to the
# squad: a man on a quiet gun is a man missing from it.
sim.turret.range=55
sim.turret.crewRadius=26
sim.turret.quietSeconds=6
sim.turret.weapon=turret_gun

# ---- SENTRIES ----------------------------------------------------------------------------------
# A sentry (G0129): a small standing gun on the players' side that nobody crews and nobody hauls - an Engineer sets one
# down at his feet for a grenade. Smaller than a turret (radius), and lighter: health is under a brute's bite or two
# of claws, since the aliens hunt it from the moment it stands - it draws them. It turns onto the nearest alien it has a
# clear shot at within range - a turret's turn, faster (turnRate, firingTurnFactor) - and fires gun. range is near a
# trooper's sight of 27 and well under a turret's 55: it guards a place, it does not reach across the field.
# It stands lifeSeconds and then goes off; destroyed, it goes off the same way: a small ordinary blast - blastRadius,
# blastDamage far under sim.blast.damage's thousand, wounding a man caught in it - and the aliens within stunRadius are
# stunned for stunSeconds, the dash surge's way, never a man.
sim.sentry.radius=1.4
sim.sentry.health=300
sim.sentry.lifeSeconds=60
sim.sentry.range=30
sim.sentry.turnRate=8
sim.sentry.firingTurnFactor=0.6
sim.sentry.gun=sentry_gun
sim.sentry.blastRadius=4
sim.sentry.blastDamage=150
sim.sentry.blastHarm=wound
sim.sentry.stunRadius=10
sim.sentry.stunSeconds=1

# ---- NESTS -------------------------------------------------------------------------------------
# A hole in the ground that keeps sending more of ONE strain out of it. The third way a level puts
# creatures on the field, after "everything is here from the first tick" and a wave schedule - and
# the only one that is a PLACE, so ground you have cleared stays cleared only if you dealt with what
# was filling it in. What comes out of a particular nest is named where the nest is put down, not
# here: one nest is different from another only in that.
#
# health is a JOB, not a stray round. Raised from 200 to 600 on 2026-09-19: at two hundred a nest was
# four sidearm rounds, which made the whole mechanic something you deleted in passing rather than
# something you had to decide to take on. At six hundred it is twelve sidearm rounds - about three and
# a half seconds of holding the trigger with nothing else happening, which never happens - two railgun
# slugs, or four shotgun pulls with the muzzle against it - one bar of them. Twice a turret's three hundred on purpose:
# a turret is yours and losing one is an event, a nest is theirs and leaving one is a decision.
sim.nest.radius=2.4
sim.nest.health=600
sim.nest.periodSeconds=30
# How long after waking the FIRST brood comes; one every periodSeconds after that (G0062). Short,
# because a nest wakes when you arrive in its biome: a first brood a whole period off was a hole you
# walked up to that did nothing. A few seconds, so you see the hole and then see it work. Every nest
# honours it, the lair's included.
sim.nest.firstBroodSeconds=6
# How many come out at a time, drawn between the two from the level seed. A range rather than a
# number, for the reason a control point's crates are: walking up to one to see is worth something.
sim.nest.broodMin=2
sim.nest.broodMax=3
# AND HOW MANY COME OUT WHEN IT DIES. A nest is at its worst the moment you kill it, which is what
# makes destroying one a decision about when rather than a chore you get through.
sim.nest.deathBroodMin=2
sim.nest.deathBroodMax=3
# How far around the hole a brood is put down. Outside its own body, so nothing is hatched inside the
# thing that hatched it, and jittered inside those tiles like everything else (G0009).
sim.nest.hatchRadius=6
# How far off every man on our side - commander or trooper - a hatched creature is put down, and the
# ground nearest the hole is filled first. A brood comes out of the nest, not out of the man who has
# just killed it from point blank: without it the last brood of a nest shot at the muzzle landed on him.
sim.nest.hatchKeepOff=5
# HOW CLOSE SOMEBODY IN ITS BIOME HAS TO COME BEFORE IT STARTS WORKING (G0062). Deliberately large,
# and not a detection range: it is the answer to a long level. A nest working from the first tick on a
# map four screens wide would have sent twenty creatures at empty ground before anybody arrived, and
# the player would meet the pile rather than the nest. Waking LATCHES - backing off does not stop it -
# or a nest would be a thing you could wait out from just outside this.
#
# The radius works INSIDE a biome: a man across a ridge wakes nothing however close he is, so a nest
# wakes when you come through the pass rather than from the biome before. A hundred and forty (raised
# from sixty on 2026-09-19) is most of a thirty-column biome, so on an Adventure coming through the
# wall wakes nearly all of the one ahead; on a mission's wider biomes the far end stays quiet until the
# march gets there.
sim.nest.wakeRadius=140
# How far its cry carries when it is attacked. The same idea as a point's aggroRadius and sized like
# one: taking a nest away should bring the neighbourhood rather than be done quietly from range.
sim.nest.rouseRadius=102
# HOW MUCH FURTHER OFF THAN HIS SIGHT A TROOPER PICKS A NEST OUT, and holds it (ticket 06). A hole is a
# target worth walking to: without it a squad holding a point 30-50 off one ignored it. Zero means a nest is just
# another target. 27 since ticket 18 keeps it picked out at 54 past a trooper's sight of 27.
sim.nest.standsOut=27
# AND WEIGHED AS A THREAT, AND KEPT (ticket 18, amending G0080): threat weighs a nest at its own distance, as
# something coming for somebody is, rather than threatBonus further; kept holds a man on a nest he picked out until
# it dies or something is inside his all-round range - a squad finishes a hole rather than leaving it half shot.
sim.nest.threat=true
sim.nest.kept=true
# A NEST LEFT BEHIND (G0081): an awake nest with no man - trooper or commander - within leftBehindRadius,
# biome or none, breeds leftBehindSlowdown times slower, and is back at its pace the tick a man is that
# near again. Not sleep, which G0031 rules out: it still breeds, so leaving one standing still costs - a
# trickle after the march rather than the pile that would meet it on the way back. The radius is the
# wake radius, so what woke it is what keeps it working. Five turns a thirty-second period into two and a
# half minutes - about a creature a minute per nest behind you. Provisional, for review: the middle of
# the four to six asked for, not yet played. Zero radius is off.
sim.nest.leftBehindRadius=140
sim.nest.leftBehindSlowdown=5
# A NEST THAT HAS BRED ITS FILL (G0093, provisional, for review): once its broods have put activeBrood creatures on
# the field it turns PASSIVE, and its period is passiveSlowdown times as long from then on, for good - stacking with
# the left-behind slowdown. A cap on what one hole can send rather than a sleep: it still breeds, so a passive nest
# is still worth closing, but camping one is no longer an endless stream. Eighteen is the middle of the 15-20 asked
# for - six or seven broods, about three minutes of an attended nest; ten turns thirty seconds into five minutes.
# Its death brood is never counted. Zero activeBrood is off.
sim.nest.activeBrood=18
sim.nest.passiveSlowdown=10

# What it takes to hold a control point. captureSeconds is the number that decides whether a point is
# a formality or a fight: it is the window the level gets to answer the squad with. aggroRadius is
# much longer than a unit's own detection range on purpose - taking a point is meant to bring the
# level to you rather than let you take it quietly, so this reaches well past what a grunt could
# have noticed for itself.
sim.controlPoint.radius=6
sim.controlPoint.captureSeconds=7
sim.controlPoint.aggroRadius=58
# How far from a point the level lays its reinforcements. Outside the point's own radius, so fetching
# one is a step off the ground you are holding rather than something collected by standing still.
sim.controlPoint.reinforcementRadius=12
# How many crates a point is worth, drawn between the two from the level seed. A fixed number makes
# every point on a level worth exactly the same; a range means walking in to see what is there.
sim.controlPoint.reinforcementsMin=2
sim.controlPoint.reinforcementsMax=3
# How many grenade caches a point lays the tick it is taken, for every seated slot (G0078): just outside it, in the
# reinforcements' ring, so a man who has thrown his steps off the ground he took to fill up before what it woke
# arrives. Per slot, so in co-op it is a refill each rather than a race; zero lays none.
sim.controlPoint.grenadeCaches=1
# The chance, per cent, that a point also lays one medkit in that ring the tick it is taken (G0086) - keyed on the
# point, so the same point on the same seed always does or never does. One a point, not a slot: a trooper takes it
# too. Furniture, so a mission's tier does not move it; zero lays none.
sim.controlPoint.medkitChance=35
# How near a post a creature that has noticed nobody stops walking at it and ambles about its own patch
# instead (G0027). Past the post's own radius (sim.controlPoint.radius), so the waves come to the ground you
# hold and mill round it looking for you rather than piling onto its middle. Larger keeps them further off;
# at the radius they stand on its edge.
sim.controlPoint.loiterRadius=18

# What a taken SITE leaves besides the grenade caches and the medkit above, which every site lays as a point does
# (G0110): crates in the same ring, by how many slots are seated, as the caches count them. The list is the fewest
# players for each next crate - 1,3,6,10 is one crate for one or two players, two for three to five, three for six to
# nine, four for ten and more (eight is the most a game seats today, so the last only future-proofs). Starts at 1 and
# strictly increases, or the loader refuses it. The finale's hold point is no biome's site and leaves none.
sim.site.crates.byPlayers=1,3,6,10

# The MAINFRAME (G0111, provisional, for review): a worked site - a big computer inside a house, downloaded by one man
# holding the action key at arm's length of it (sim.action.reach) for workSeconds, a commander or a trooper; letting go,
# stepping away, a dash or a wound starts it again, and each fresh attempt is heard rouseRadius off, as a point's
# (sim.controlPoint.aggroRadius). radius is its body - solid, immovable, no health: 2.4 is 4.8 across, a man and a half
# (a trooper is 3.2), and under half a tile so it stands on the tile beside a wall without touching it. chance is the per cent a biome that lays a house (never a gatehouse) stands one in it in
# place of one of its control points, dealt from the biome's own stream; at most one a biome. Taken, it leaves what a
# taken point leaves (sim.controlPoint.grenadeCaches, medkitChance, sim.site.crates).
sim.site.mainframe.radius=2.4
sim.site.mainframe.workSeconds=6
sim.site.mainframe.rouseRadius=58
sim.site.mainframe.chance=50
sim.site.mainframe.housed=true
sim.site.mainframe.action=download
sim.site.mainframe.look=mainframe
sim.site.mainframe.room=0
sim.site.mainframe.troopersWork=true

# What else a worked site may declare (G0114), each off for the mainframe: room, how far round its middle the ground is
# open sand where it is laid in the open - no rock, no mud, no pass, nothing else laid there - which its guards stand
# inside and what its taking leaves and hatches lies outside (zero is its body alone); guards.kind/offset, an
# emplacement of that kind on each of its four diagonals that far from its middle, woken by its first attempt and
# silenced by its taking (a block left out is none); hatch.strain/min/max/radius, that many of a strain come up round it
# the tick it is taken, outside its room and off the men, within radius of it, as a nest's brood (a block left out is
# none). chance is 0 for one in the open: its biome's furniture counts it (sim.biome.<biome>.furniture.relics).
# troopersWork is whether the squad makes it an objective - walks to it, stands round it, one man works it - as it does
# a point; false leaves it to the commanders, and the squad passes it over for the next site. Round one with guards the
# men stand inside the guards' lanes, never in one.
#
# The RELIC (G0114, provisional, for review): the desert's site - a stone plinth (radius 1.5, 3 across, under a
# trooper's 3.2) with a glowing square over it, extracted as a mainframe is downloaded (6 s held), but each fresh
# attempt is heard twice as far (116). Four wardens on the diagonals 8 from its middle, so each lane runs 5.7 off its
# middle: inside them is a square 11.3 across, round a plinth 3 across - room for the squad's five round it (troopers
# 3.2 across, all inside the lanes touching the plinth) and between two wardens (11.3 apart, 8.9 clear) for anybody.
# room 10 is the wardens' outer edge (9.2) and a little. Taken, two or three snakes come up out to 17 from it, outside
# the ring. The squad extracts it as it downloads a mainframe (troopersWork): one man works it and up to four watch
# from inside the lanes; a man a warden's bead wounds steps off its line (sim.weapon.warden_shot.stepOff).
sim.site.relic.radius=1.5
sim.site.relic.workSeconds=6
sim.site.relic.rouseRadius=116
sim.site.relic.chance=0
sim.site.relic.housed=false
sim.site.relic.action=extract
sim.site.relic.look=relic
sim.site.relic.room=14
sim.site.relic.guards.kind=warden
sim.site.relic.guards.offset=10
sim.site.relic.hatch.strain=snake
sim.site.relic.hatch.min=2
sim.site.relic.hatch.max=3
sim.site.relic.hatch.radius=17
sim.site.relic.troopersWork=true

# EMPLACEMENTS (G0113): standing shooters nobody crews, one block a kind. Solid, immovable and unbreakable - no health
# - on the aliens' side, so their shots pass the aliens and hurt only the men, and never an enemy: nothing counts one,
# aims at one or hunts one. radius is its body; look what it is drawn as; gun what it fires, one shot along each bearing
# of a step, unaimed; periodSeconds between one step and the next. wakeRadius is how near a man on his feet must stand
# for it to fire - asleep, its clock and its cycle stand still; zero is woken by something else. cycle is either
# "dealt <fewest steps> <most steps> <fewest directions> <most directions>": that many steps, each that many different
# ones of the four directions (north, east, south, west) fired together, dealt once when the level is built and fired
# step by step, round and round, never dealt again, so it can be learnt; or "volley <bearings>": every bearing, in
# degrees clockwise from north and separated by commas, fired together every step.
# The SPIRE (provisional, for review): the fen's - a cycle of four to six steps, each one to all four directions, a
# step a second, while a man is
# within 45. The bead reaches 30, so a man just inside its wake is not yet in its reach: the first shots are a warning.
sim.emplacement.spire.radius=1.4
sim.emplacement.spire.look=spire
sim.emplacement.spire.gun=spire_shot
sim.emplacement.spire.periodSeconds=1
sim.emplacement.spire.wakeRadius=45
sim.emplacement.spire.cycle=dealt 4 6 1 4
# The WARDEN (G0114, provisional, for review): a relic's guard - a ringed token of body 1.2, a volley along all four
# compass lines every 0.75 s. Set on a relic's diagonals, the lines cross-hatch its ring: each line runs 5.7 from the
# plinth's middle, so the square inside them is out of every lane and within arm's length of the plinth - the place to
# extract from untouched; crossing a lane to get there is the dodge. wakeRadius 0: nobody's nearness wakes it; its
# relic's first attempt does (sim.site.relic.guards).
sim.emplacement.warden.radius=1.2
sim.emplacement.warden.look=warden
sim.emplacement.warden.gun=warden_shot
sim.emplacement.warden.periodSeconds=0.75
sim.emplacement.warden.wakeRadius=0
sim.emplacement.warden.cycle=volley 0,90,180,270

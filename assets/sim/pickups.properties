# Simulation tunables, one domain of them. How the files in assets/sim/ are read: world.properties.

# Things lying on the field for the first unit that touches them. Only the size and the glow are here:
# what a pickup gives each side is structure rather than tuning and lives in SimConfig, next to which
# strain grows into which. The number that balances an eating evolution is sim.unit.<kind>.feedToEvolve.
#
# shineSeconds is how long one pulse of a pickup's glow takes, and ZERO MEANS IT DOES NOT SHINE, which
# is what most of them say. It is what lets a small thing be findable without a marker drawn over it:
# the things worth crossing a level for catch the eye, and everything else is scenery you notice when
# you are standing on it.
sim.pickup.mushroom.radius=0.9
sim.pickup.mushroom.look=mushroom
sim.pickup.mushroom.playerGrant=none
sim.pickup.mushroom.alienGrant=feed 1
sim.pickup.mushroom.shineSeconds=0
sim.pickup.flower.radius=0.9
sim.pickup.flower.look=flower
sim.pickup.flower.playerGrant=none
sim.pickup.flower.alienGrant=mutate brute
sim.pickup.flower.shineSeconds=0
# Small, because it has to be found rather than avoided, and it glows instead of being big. A crate
# the size of a body read as an obstacle and took up the ground beside a point that men stand on.
sim.pickup.supply_drop.radius=0.9
sim.pickup.supply_drop.shineSeconds=1.8
sim.pickup.supply_drop.look=supply_drop
sim.pickup.supply_drop.playerGrant=reinforce 3
sim.pickup.supply_drop.alienGrant=none
# A medkit (G0053): every wound cleared, to a man who has one. Worth nothing to a man without one, so he
# walks over it and it stays for whoever needs it; nothing to the aliens, and no health, so no weapon
# touches it. It glows, faster than a crate, because a wounded man is scanning the ground for it.
sim.pickup.medkit.radius=0.8
sim.pickup.medkit.shineSeconds=1.2
sim.pickup.medkit.look=medkit
sim.pickup.medkit.playerGrant=mend
sim.pickup.medkit.alienGrant=none
# Its cards in the armoury deck that crates are dealt from (G0056), beside the guns' below.
sim.pickup.medkit.armoury.cards=3
sim.pickup.medkit.armoury.crate=false
# Small: a rabbit is a dot with legs, and a hard target on purpose.
sim.pickup.rabbit.radius=0.8
sim.pickup.rabbit.look=rabbit
sim.pickup.rabbit.playerGrant=none
sim.pickup.rabbit.alienGrant=feed 1
sim.pickup.rabbit.shineSeconds=0
# One cache per gun, all the same size and all pulsing alike - only the colour says what is inside,
# and that colour is in graphic.properties because it is not a number anybody balances. The pulse is
# slower than a supply drop's: a gun is worth noticing and never worth running past a fight for.
#
# armoury is each pickup's part in the armoury deck that CRATES are dealt from (G0056), on a crate's first
# opening. cards is how many of it the deck holds before an upgrade adds more; the deck is a bag, so no
# card comes up twice before every card has. A card is never a crate (crate=false); a crate is never a
# card (cards 0). Anything that is not in the deck and no crate has no armoury block at all.
sim.pickup.armoury_railgun.radius=1.2
sim.pickup.armoury_railgun.shineSeconds=2.6
sim.pickup.armoury_railgun.look=armoury_railgun
sim.pickup.armoury_railgun.playerGrant=arm railgun
sim.pickup.armoury_railgun.alienGrant=none
sim.pickup.armoury_railgun.armoury.cards=3
sim.pickup.armoury_railgun.armoury.crate=false
sim.pickup.armoury_flamer.radius=1.2
sim.pickup.armoury_flamer.shineSeconds=2.6
sim.pickup.armoury_flamer.look=armoury_flamer
sim.pickup.armoury_flamer.playerGrant=arm flamer
sim.pickup.armoury_flamer.alienGrant=none
sim.pickup.armoury_flamer.armoury.cards=3
sim.pickup.armoury_flamer.armoury.crate=false
sim.pickup.armoury_shotgun.radius=1.2
sim.pickup.armoury_shotgun.shineSeconds=2.6
sim.pickup.armoury_shotgun.look=armoury_shotgun
sim.pickup.armoury_shotgun.playerGrant=arm shotgun
sim.pickup.armoury_shotgun.alienGrant=none
sim.pickup.armoury_shotgun.armoury.cards=3
sim.pickup.armoury_shotgun.armoury.crate=false
sim.pickup.armoury_laser.radius=1.2
sim.pickup.armoury_laser.shineSeconds=2.6
sim.pickup.armoury_laser.look=armoury_laser
sim.pickup.armoury_laser.playerGrant=arm laser
sim.pickup.armoury_laser.alienGrant=none
sim.pickup.armoury_laser.armoury.cards=2
sim.pickup.armoury_laser.armoury.crate=false
sim.pickup.armoury_bazooka.radius=1.2
sim.pickup.armoury_bazooka.shineSeconds=2.6
sim.pickup.armoury_bazooka.look=armoury_bazooka
sim.pickup.armoury_bazooka.playerGrant=arm bazooka
sim.pickup.armoury_bazooka.alienGrant=none
sim.pickup.armoury_bazooka.armoury.cards=2
sim.pickup.armoury_bazooka.armoury.crate=false
sim.pickup.armoury_pulse.radius=1.2
sim.pickup.armoury_pulse.shineSeconds=2.6
sim.pickup.armoury_pulse.look=armoury_pulse
sim.pickup.armoury_pulse.playerGrant=arm pulse
sim.pickup.armoury_pulse.alienGrant=none
sim.pickup.armoury_pulse.armoury.cards=3
sim.pickup.armoury_pulse.armoury.crate=false
sim.pickup.armoury_disc.radius=1.2
sim.pickup.armoury_disc.shineSeconds=2.6
sim.pickup.armoury_disc.look=armoury_disc
sim.pickup.armoury_disc.playerGrant=arm disc_gun
sim.pickup.armoury_disc.alienGrant=none
sim.pickup.armoury_disc.armoury.cards=2
sim.pickup.armoury_disc.armoury.crate=false
# The detonator's cache (G0100): as many cards as the disc gun's, the other heavy gun a crate deals.
sim.pickup.armoury_detonator.radius=1.2
sim.pickup.armoury_detonator.shineSeconds=2.6
sim.pickup.armoury_detonator.look=armoury_detonator
sim.pickup.armoury_detonator.playerGrant=arm detonator
sim.pickup.armoury_detonator.alienGrant=none
sim.pickup.armoury_detonator.armoury.cards=2
sim.pickup.armoury_detonator.armoury.crate=false
# A grenade cache (G0077): fills a commander's grenades to his most - a card in the deck, as many as the medkit's,
# so a crate deals grenades about as often as it deals a mend. Turned down while he carries his most.
sim.pickup.armoury_grenades.radius=1.2
sim.pickup.armoury_grenades.shineSeconds=2.6
sim.pickup.armoury_grenades.look=armoury_grenades
sim.pickup.armoury_grenades.playerGrant=grenades
sim.pickup.armoury_grenades.alienGrant=none
sim.pickup.armoury_grenades.armoury.cards=3
sim.pickup.armoury_grenades.armoury.crate=false
# A crate (G0056): a commander opens it with the action key and takes one of what it holds from the cards
# in his top bar. Nothing is taken by walking onto it. Small - a square with a dot, not an obstacle.
sim.pickup.crate.radius=1.0
sim.pickup.crate.shineSeconds=2.6
sim.pickup.crate.look=crate
sim.pickup.crate.playerGrant=none
sim.pickup.crate.alienGrant=none
sim.pickup.crate.armoury.cards=0
sim.pickup.crate.armoury.crate=true
# How many pickups a crate is dealt on its first opening, from a bag over fewest..most: two or three.
# Full Crates raises the fewest to the most a crate can hold, which is four - the cards a top bar shows.
sim.crate.fewest=2
sim.crate.most=3
# A pop (G0078): what the player's side takes by touch - a grenade cache, a medkit, a gun, a supply drop - shown
# rising off the taker for this long. Long enough to catch the eye mid-fight, short enough not to cover him.
sim.pop.seconds=0.5

# A barrel is a target, not cover. Small, and standing in the open.
sim.pickup.barrel.radius=1.0
sim.pickup.barrel.look=barrel
sim.pickup.barrel.playerGrant=none
sim.pickup.barrel.alienGrant=detonate
sim.pickup.barrel.shineSeconds=0

# The rabbit: alien food that walks. Taking one works exactly like any other pickup - what each side
# gets is in SimConfig, and the commander is offered nothing, so his only interest in one is denying
# it. These are the numbers for the half of it that moves.
sim.rabbit.speed=15
sim.rabbit.health=1
sim.rabbit.deathThroesSeconds=0.4
sim.rabbit.wander.enabled=true
sim.rabbit.wander.radius=18
sim.rabbit.wander.speedFactor=0.7
sim.rabbit.wander.arriveRadius=1
sim.rabbit.wander.pauseMinSeconds=0.3
sim.rabbit.wander.pauseMaxSeconds=1.1
sim.rabbit.wander.waypointTimeoutSeconds=3
# Food does not spread through a biome (G0086): its home stays where it was put.
sim.rabbit.wander.driftPerStop=0
# The dodge is deterministic on purpose: perpendicular to the shot, to the side it is already on, the
# same every time, so a player can learn to lead it. commitSeconds is what keeps that from making it
# trivial - once it has broken one way it cannot answer anything else until this runs out, so the
# counter to a dodge is a second shot rather than a perfect first one. margin is how wide of it a shot
# may pass and still count as coming at it; at zero it would only dodge shots that were dead on, which
# reads as clairvoyance rather than as nerves.
sim.rabbit.dodge.enabled=true
sim.rabbit.dodge.reactionRange=26
sim.rabbit.dodge.speed=32
sim.rabbit.dodge.durationSeconds=0.32
sim.rabbit.dodge.commitSeconds=0.9
sim.rabbit.dodge.margin=1.2
# Rabbits are content: a scenario spawns them, so there is no count here.

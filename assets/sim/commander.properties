# Simulation tunables, one domain of them. How the files in assets/sim/ are read: world.properties.

# The player-controlled unit.
# ---------------------------------------------------------------------------------------------
# PACE. Everything that moves was slowed by roughly a third on 2026-09-10, and the guns' rate of
# fire with it, because the game read as too fast to think in. Retuned by hand on 2026-11-12 (ticket 18):
# the men slower, the aliens quicker, so a fight closes in rather than being shot out from afar. The order:
#   commander 13 > runner 12 > trooper 10 = grunt 10 > ant 9 > spitter, sludger 8 > brute 7 > giants, slinger 6
# The commander outruns everything; the runner is the one his squad cannot run from, so it is shot instead;
# a squad no longer walks away from grunts; a brute and the giants are the slow ones. If it needs another
# pass, move this order as a whole rather than one number - a single unit retuned on its own is how a chase
# stops working.
# ---------------------------------------------------------------------------------------------
sim.commander.radius=2.0
sim.commander.speed=13
# How many wounds he carries on his feet (G0053); one more puts him down. He has no health: a spit, a
# spew or a grenade's blast costs one wound whatever its damage, and claws or a leap still kill.
# Raised above one only by an upgrade, never here - one is what makes a second hit matter.
sim.commander.maxWounds=1
# How long he lies on the ground shot off his feet before he is gone. HIS OWN, and deliberately not
# sim.casualty.bleedOutSeconds, which is his men's: what a player actually sits out is this window
# plus the throes plus the respawn below, and three windows sized for a trooper added up to most of a
# fight. Shortening the shared one instead would have shortened every rescue on the field, which is a
# decision about a different mechanic. Still long enough that somebody has to decide whether to come.
sim.commander.bleedOutSeconds=5
# How long the body lies on the field after a killing blow, before it is taken away. The window the
# dying animation will play in; the respawn countdown starts after it, not alongside it.
sim.commander.deathThroesSeconds=1.5
# Brought down from three on 2026-09-18. Being shot off your feet already costs the bleed-out above
# and the throes beside it, and the wait after all of that was being served twice.
sim.commander.respawnDelaySeconds=1.5
# Where he comes back is the rally point, as every man from the reserve does, and it costs the reserve
# a man (G0055): see sim.reserve.* in squad.properties.
# He comes back behind a SHIELD (G0053): it takes the first hit of any kind - a wound, a blast, claws,
# a grab - and breaks, and runs out on its own after this long if nothing hits it first. It replaced
# two seconds of invulnerability: long enough to walk out of the crowd that killed him, and drawn
# running down so he can see when he is on his own again.
sim.commander.respawnShieldSeconds=3
# How far a commander may walk from the middle of the commanders. Past this the step outwards is
# refused - never a shove inwards, so nobody is ever pushed and a man at the end of the rope walks
# home himself. Zero switches it off.
#
# Deliberately FAR wider than the view: a player may go off screen, and this is a backstop against
# two players ending up a level apart rather than a frame the camera has to hold. It started at 30,
# which capped a pair at 60 apart inside the 160x90 the viewport shows - correct for pillar 4 and
# much too tight to play. What that leaves open is what the view does with a player it cannot frame;
# see the open questions in docs/design/README.md.
#
# Still not read from the camera, and that part is not a preference: zoom is a rendering setting and
# a leash that grew with it would make pulling the view back into extra rope.
sim.commander.leashRadius=120

# The gun he spawns and comes back with. The sidearm in every level: a better gun is found on the field
# and lost with him (pillar 3). Only the proving ground names another, for practice (G0060).
sim.commander.weapon=sidearm

# THE DASH (G0107): a short burst along the way he is moving - never his aim - stopped by whatever would stop him
# walking, and no protection while it lasts (pillar 2). Three tiles in a blink: far enough to step out of a leap's
# landing or across a spit, too short to leave the fight. He holds most of them; each one spent comes back after
# rechargeSeconds, one at a time, so two in a row leave him six seconds from full. On ground that slows him -
# thicket, mud, glue - every tick of it goes at slowFactor of the speed, so a dash across a puddle reaches 70 % as
# far; wounds do not shorten it. Retuned by hand 2026-11-22: distance 15 -> 7.5, slowFactor 0.5 -> 0.7. The puff it leaves where it began lasts puffSeconds; how it looks is graphic's.
sim.commander.dash.distance=7.5
sim.commander.dash.durationSeconds=0.15
sim.commander.dash.most=2
sim.commander.dash.rechargeSeconds=1.75
sim.commander.dash.slowFactor=0.7
sim.commander.dash.puffSeconds=0.6
# ROCKETMAN (G0108): with the upgrade held, a dash that launches stuns every alien within its reach of him - the
# surge - for stunSeconds, through the stun-duration fold, and is drawn as a ring there for surgeSeconds. The reach is
# the upgrade's (sim.upgrade.rocketman.effects); a dash refused or a press with none left sets nothing off.
sim.commander.dash.stunSeconds=1
sim.commander.dash.surgeSeconds=0.35

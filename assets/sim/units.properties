# Simulation tunables, one domain of them. How the files in assets/sim/ are read: world.properties.

# The strains that chase it. Every strain is one block under sim.unit.<kind>, with the same keys;
# adding a strain is a constant in UnitKind, a default in SimConfig, and a block here.

# THE SWARM'S HEALTH. Every strain's health below, and the nest's in level.properties,
# is scaled by this whole percentage when a unit arrives, and rounded to a whole hit point by the one
# rule hit points have (G0054: nearest, halves up) - so the ratios between strains survive a retune and
# one key turns them all. Raised to 125 on 2026-09-29 when men stopped having health: a spit now wounds
# rather than downs, so the squad goes down about half as often to gunfire, and the swarm is mostly
# claws, which still kill - the correction is modest. At 125 a grunt (188) takes four sidearm shots instead
# of three and a brute seven instead of five; runners, frogs and spitters keep their two. Barrels,
# mines, rabbits and turrets are not the swarm and are not scaled. The hand strike (sim.melee.damage)
# must stay at or above a grunt's health AFTER this factor - and after a mission's tier.
sim.swarm.healthPercent=125
# A mission's tier, on top of the factor above and rounded with it once (G0063): a hundred everywhere else.
# Not tuned here - a mission sets it from sim.mission.tier.<tier>.healthPercent in missions.properties.
sim.swarm.tierPercent=100
# The basic strain. Slower than the commander on purpose.
sim.unit.grunt.radius=1.8
# Raised from 7.5 on 2026-09-18. A grunt that a walking commander could stroll away from was a threat
# only where it had numbers or a corner. Every ratio in the PACE block in commander.properties survives it: still under
# a runner's 9.5, still well under a trooper's 13.5, still far under his own 19.
sim.unit.grunt.speed=8.25
sim.unit.grunt.count=12
sim.unit.grunt.health=150
# One touch kills a commander outright at these numbers.
sim.unit.grunt.contactDamage=100
# How wide an arc in front of it its claws reach into, centred on the way it is going. Below 360, so
# there is a blind spot behind it and walking into the back of something that has not turned round is
# no longer instant death - which read as the game cheating, because nothing on screen warned you.
# GENEROUS ON PURPOSE: a lunging creature is not precise, and a blind spot narrow enough to rely on
# would turn every fight into a dance round behind things. Set it to 360 for a strain that bites
# anything it touches.
sim.unit.grunt.attackArcDegrees=200
sim.unit.grunt.attackCooldownSeconds=1.3
sim.unit.grunt.victimInvulnerableSeconds=0.6
# How long a landed blow holds both the enemy and its victim still. Matches the commander's death
# throes above, so the kill reads as one beat rather than two - change them together or it will not.
sim.unit.grunt.lockSeconds=1.5
# How long its body lies there afterwards. Matches the commander's melee lock, so a lethal answer to
# a leap holds the two of them together for exactly as long as the commander is held by it - which is
# the clinch. A dying body becomes an obstacle: solid, and immovable, so it stays where it fell.
sim.unit.grunt.deathThroesSeconds=1.0
# How much it must consume before it turns into the next strain. What it turns into is structure
# rather than tuning and lives in SimConfig, not here.
sim.unit.grunt.feedToEvolve=3

# What it can notice. alwaysAggressive is the switch that gives back the standing fight every arena
# built before detection existed was tuned around: on, it hunts from the first tick and the two ranges
# below are ignored. loseRange is deliberately wider than detectionRange - one range would flicker a
# unit standing exactly on the boundary between hunting and idling every tick - but only for something
# that can lose interest at all. Giving up leaves a unit idling where it stood when it gave up, not
# walking back to where it spawned - its patch follows it while it has something better to do. Him
# going down releases everything regardless, whatever these say.
sim.unit.grunt.perception.alwaysAggressive=true
sim.unit.grunt.perception.losesInterest=true
sim.unit.grunt.perception.detectionRange=30
sim.unit.grunt.perception.loseRange=45
sim.unit.grunt.perception.secondaryRange=14
sim.unit.grunt.perception.arcDegrees=360
sim.unit.grunt.perception.requiresClearLine=false

# How it passes the time before it has noticed anybody: pick a spot in its patch, walk there slowly,
# stand a moment, pick again. The patch is centred where the unit was spawned, so losing the commander
# means walking home. speedFactor is well below one on purpose - an ambling unit must not read like
# one that has seen you. waypointTimeoutSeconds is what stops a unit wedged behind a rock leaning into
# it for the rest of the level.
sim.unit.grunt.wander.enabled=true
sim.unit.grunt.wander.radius=12
sim.unit.grunt.wander.speedFactor=0.45
sim.unit.grunt.wander.arriveRadius=1.5
sim.unit.grunt.wander.pauseMinSeconds=0.4
sim.unit.grunt.wander.pauseMaxSeconds=1.4
sim.unit.grunt.wander.waypointTimeoutSeconds=4

# How far ahead it looks for things in its way. Both it and the hazard are projected forward by
# lookaheadSeconds before the gap is measured, which is the whole of what makes the avoidance
# predictive rather than a reaction to a collision that already happened. It never steers around the
# other side - that is what it is trying to reach. weight is how heavily a dangerous direction counts
# against how much it wanted to go that way; far above one and it flinches at everything and never
# arrives.
sim.unit.grunt.avoidance.enabled=true
sim.unit.grunt.avoidance.scanRange=7
sim.unit.grunt.avoidance.lookaheadSeconds=0.35
sim.unit.grunt.avoidance.weight=1.6

# How an enemy closes the last of the distance. The hesitation is the only part of the leap the
# player gets to answer, so it is short: read the tell, or wear it.
sim.unit.grunt.leap.enabled=true
sim.unit.grunt.leap.triggerRange=16
sim.unit.grunt.leap.speed=29
sim.unit.grunt.leap.airborneSeconds=0.28
sim.unit.grunt.leap.sequenceLength=2
sim.unit.grunt.leap.betweenSeconds=0.18
sim.unit.grunt.leap.cooldownSeconds=1.6
sim.unit.grunt.leap.hesitationMinSeconds=0.08
sim.unit.grunt.leap.hesitationMaxSeconds=0.22

# HOW WIDE OF YOU IT CLOSES. Everything hunting one man used to be steered at the same point, and a
# flow field's gradient in the open is grid-shaped, so a pack crossing open ground converged onto his
# row and came down it in single file. Each creature now walks at a point of its own beside him.
# Which side and how much is taken from where it was spawned rather than rolled (G0012's argument,
# applied to an approach), so a pack fans out the same way on every run.
#
# offset is how far to either side of the line, in world units, at full swing - sized against the
# body, or it reads as a wobble rather than as a creature taking its own line. closeRange is where
# the swing has run out and it is walking straight at him again: it is at full swing past twice this
# and closed by this, so the fan is open while the ground is being crossed and shut by the time
# anything arrives. Something that held its offset all the way in would orbit rather than arrive.
# Keep it comfortably inside the detection range above, or a strain spends the whole approach wide.
sim.unit.grunt.approach.enabled=true
sim.unit.grunt.approach.offset=7
sim.unit.grunt.approach.closeRange=12
sim.unit.grunt.evolvesTo=brute
# Whether the pulse rifle's shock builds on it (G0059). Every strain but the boss.
sim.unit.grunt.shockable=true
sim.unit.grunt.look=grunt

# The fast one. Smaller and thinner than a grunt, and it notices you from most of the way across a
# level - it is the strain that comes to find you rather than the one you walk into. What makes it a
# different problem is its line rather than its speed: it weaves as it closes and steps aside from
# shots it sees coming, so it is a target you have to lead.
sim.unit.runner.radius=1.4
sim.unit.runner.speed=9.5
sim.unit.runner.count=6
sim.unit.runner.health=60
sim.unit.runner.contactDamage=100
sim.unit.runner.attackArcDegrees=200
sim.unit.runner.attackCooldownSeconds=1.1
sim.unit.runner.victimInvulnerableSeconds=0.6
sim.unit.runner.lockSeconds=1.5
sim.unit.runner.deathThroesSeconds=0.8
sim.unit.runner.feedToEvolve=0

# Twice a grunt's reach. This is the number that makes it the strain that finds you.
sim.unit.runner.perception.alwaysAggressive=true
sim.unit.runner.perception.losesInterest=true
sim.unit.runner.perception.detectionRange=60
sim.unit.runner.perception.loseRange=80
sim.unit.runner.perception.secondaryRange=14
sim.unit.runner.perception.arcDegrees=360
sim.unit.runner.perception.requiresClearLine=false

sim.unit.runner.wander.enabled=true
sim.unit.runner.wander.radius=16
sim.unit.runner.wander.speedFactor=0.5
sim.unit.runner.wander.arriveRadius=1.5
sim.unit.runner.wander.pauseMinSeconds=0.3
sim.unit.runner.wander.pauseMaxSeconds=1.0
sim.unit.runner.wander.waypointTimeoutSeconds=4

sim.unit.runner.avoidance.enabled=true
sim.unit.runner.avoidance.scanRange=7
sim.unit.runner.avoidance.lookaheadSeconds=0.35
sim.unit.runner.avoidance.weight=1.6

# A shorter, faster dash than a grunt's, with barely any wind-up: it is already on you.
sim.unit.runner.leap.enabled=true
sim.unit.runner.leap.triggerRange=14
sim.unit.runner.leap.speed=34
sim.unit.runner.leap.airborneSeconds=0.24
sim.unit.runner.leap.sequenceLength=2
sim.unit.runner.leap.betweenSeconds=0.14
sim.unit.runner.leap.cooldownSeconds=1.2
sim.unit.runner.leap.hesitationMinSeconds=0.06
sim.unit.runner.leap.hesitationMaxSeconds=0.16

# Narrower than a grunt's, because it weaves on top of it: two wide answers to the same question read
# as a creature that cannot make its mind up rather than as one taking a line.
sim.unit.runner.approach.enabled=true
sim.unit.runner.approach.offset=5
sim.unit.runner.approach.closeRange=10

# How hard it refuses to walk straight at you. amplitude is how far it leans off its course, as a
# fraction of forwards; wavelength is how far it travels through one full left-right-left. Both are
# functions of GROUND COVERED rather than of the clock, so a runner held up by a wall does not weave
# on the spot and a slowed one does not weave faster. Nothing here is rolled (G0012).
sim.unit.runner.weave.enabled=true
sim.unit.runner.weave.amplitude=0.55
sim.unit.runner.weave.wavelength=9

# It steps aside from a shot it sees coming, exactly as a rabbit does - the same definition and the
# same system. reactionRange is what decides whether it has time to think about a shot from across
# the arena; commitSeconds is what makes a second shot the answer to the first.
sim.unit.runner.dodge.enabled=true
sim.unit.runner.dodge.reactionRange=22
sim.unit.runner.dodge.speed=26
sim.unit.runner.dodge.durationSeconds=0.26
sim.unit.runner.dodge.commitSeconds=0.7
sim.unit.runner.dodge.margin=1.4
sim.unit.runner.evolvesTo=none
sim.unit.runner.shockable=true
sim.unit.runner.look=runner

# The heavy units. Slow, tough, and the reason the hand strike needs a stun: a brute survives one.
sim.unit.brute.radius=2.6
sim.unit.brute.speed=4.75
sim.unit.brute.count=3
sim.unit.brute.health=250
sim.unit.brute.contactDamage=100
# The same arc as a grunt. A brute turns more slowly than one, which is punishment enough.
sim.unit.brute.attackArcDegrees=200
sim.unit.brute.attackCooldownSeconds=1.5
sim.unit.brute.victimInvulnerableSeconds=0.6
sim.unit.brute.lockSeconds=1.5
sim.unit.brute.deathThroesSeconds=1.0
# Zero: a brute has nowhere further to go by eating.
sim.unit.brute.feedToEvolve=0

# Heavier and duller: it notices later than a grunt and gives up sooner.
sim.unit.brute.perception.alwaysAggressive=true
sim.unit.brute.perception.losesInterest=true
sim.unit.brute.perception.detectionRange=24
sim.unit.brute.perception.loseRange=36
sim.unit.brute.perception.secondaryRange=10
sim.unit.brute.perception.arcDegrees=360
sim.unit.brute.perception.requiresClearLine=false

# A brute keeps a smaller patch and rests in it longer. Heavy things do not pace.
sim.unit.brute.wander.enabled=true
sim.unit.brute.wander.radius=8
sim.unit.brute.wander.speedFactor=0.35
sim.unit.brute.wander.arriveRadius=2
sim.unit.brute.wander.pauseMinSeconds=0.8
sim.unit.brute.wander.pauseMaxSeconds=2.4
sim.unit.brute.wander.waypointTimeoutSeconds=5

# A brute is wider and slower to turn, so it looks further ahead and commits earlier.
sim.unit.brute.avoidance.enabled=true
sim.unit.brute.avoidance.scanRange=9
sim.unit.brute.avoidance.lookaheadSeconds=0.5
sim.unit.brute.avoidance.weight=1.3

# A brute telegraphs harder and travels further. Its extra health would be unfair otherwise.
sim.unit.brute.leap.enabled=true
sim.unit.brute.leap.triggerRange=22
sim.unit.brute.leap.speed=24
sim.unit.brute.leap.airborneSeconds=0.42
sim.unit.brute.leap.sequenceLength=3
sim.unit.brute.leap.betweenSeconds=0.26
sim.unit.brute.leap.cooldownSeconds=2.4
sim.unit.brute.leap.hesitationMinSeconds=0.18
sim.unit.brute.leap.hesitationMaxSeconds=0.42

# Wider and started further out than a grunt's. A brute is 5.2 across and turns slowly, so two of them
# on lines a grunt's width apart are still shoulder to shoulder by the time they arrive.
sim.unit.brute.approach.enabled=true
sim.unit.brute.approach.offset=9
sim.unit.brute.approach.closeRange=14
sim.unit.brute.evolvesTo=none
sim.unit.brute.shockable=true
sim.unit.brute.look=brute

# The shooting unit. Purple, and a different problem from the two above: it holds ground at a
# distance instead of coming at you, so it has to be gone and dealt with rather than survived.
# Fragile - two sidearm rounds - because a shooter that also soaked damage would just be a wall.
sim.unit.spitter.radius=1.7
sim.unit.spitter.speed=6
sim.unit.spitter.count=4
sim.unit.spitter.health=70
sim.unit.spitter.contactDamage=100
sim.unit.spitter.attackArcDegrees=200
sim.unit.spitter.attackCooldownSeconds=1.3
sim.unit.spitter.victimInvulnerableSeconds=0.6
sim.unit.spitter.lockSeconds=1.5
sim.unit.spitter.deathThroesSeconds=1.0
sim.unit.spitter.feedToEvolve=0

# It notices at a grunt's range and shoots at well under half of it. The gap between the two is the
# ground you cross while it watches you come.
#
# NOT always aggressive, unlike everything that chases. It has to notice you first, and that is what
# gives it a life before the fight: a unit that has noticed nobody ambles and goes for what it can
# eat, and the commander outranks food absolutely, so a spitter that hunted from the first tick could
# never walk over to a barrel. Once it has noticed you it holds its ground and shoots, which is the
# behaviour the always-aggressive switch was hiding the front half of.
sim.unit.spitter.perception.alwaysAggressive=false
sim.unit.spitter.perception.losesInterest=true
sim.unit.spitter.perception.detectionRange=30
sim.unit.spitter.perception.loseRange=45
sim.unit.spitter.perception.secondaryRange=14
sim.unit.spitter.perception.arcDegrees=360
sim.unit.spitter.perception.requiresClearLine=false

# A SHOOTER AMBLES WHILE IT FIGHTS. It will not follow you, so with nothing else driving its legs it
# stood perfectly still for a whole fight and read as a turret. It keeps ambling inside this patch
# while it shoots - and the patch is what "working the ground" looks like, so it is wider and busier
# than a shuffle: short pauses, a fair walk between waypoints, and a new bearing to look along every
# time it picks one. It must stay inside the gap between closeRange and range above, or it would
# amble out of its own reach between shots.
sim.unit.spitter.wander.enabled=true
sim.unit.spitter.wander.radius=7
sim.unit.spitter.wander.speedFactor=0.4
sim.unit.spitter.wander.arriveRadius=0.8
sim.unit.spitter.wander.pauseMinSeconds=0.2
sim.unit.spitter.wander.pauseMaxSeconds=0.7
sim.unit.spitter.wander.waypointTimeoutSeconds=3

sim.unit.spitter.avoidance.enabled=true
sim.unit.spitter.avoidance.scanRange=7
sim.unit.spitter.avoidance.lookaheadSeconds=0.35
sim.unit.spitter.avoidance.weight=1.6

# It does not leap. Nothing that keeps its distance also throws itself at you.
# No sim.unit.spitter.leap block: a block the file leaves out is off.

# How it shoots. The cone is the whole mechanic: at fourteen degrees a shot meant for the commander
# still reaches a man standing beside him, so a firing line hurts a squad rather than one man, and
# no single shot is ever quite aimed. haltsToFire is what makes it hold a line instead of closing.
sim.unit.spitter.ranged.enabled=true
sim.unit.spitter.ranged.range=18
sim.unit.spitter.ranged.spreadDegrees=14
sim.unit.spitter.ranged.haltsToFire=true
# It NEVER advances on what it is hunting. A spitter is a place on the field you have to get past,
# not a thing that comes for you - you are driven off and never followed, which is a different
# problem from everything else on the alien side and the reason the two want different answers.
sim.unit.spitter.ranged.holdsGround=true
# Its field of view, and how fast it swings onto you. Wider than a trooper's hundred degrees, because
# a creature built around a gun should be harder to get behind than a man is - but not all round, so
# stepping past one is a real move. turnRate is a fraction of the remaining angle per second: at
# three it has covered most of a wide swing inside a second, which is long enough to feel and short
# enough that flanking one is a moment rather than a strategy.
sim.unit.spitter.ranged.arcDegrees=150
sim.unit.spitter.ranged.turnRate=3
# THE DISTANCE IT WANTS TO BE AT, and therefore the distance it walks to once it has noticed you.
# Inside it the thing fires faster and straighter by the same factor - it has you at point-blank
# range, and that is one idea rather than two. Half its firing range, so a spitter that has taken its
# position is dangerous and you get half its reach as warning. It has to stay comfortably inside the
# range above, or the amble below carries it back out of its own reach between shots.
sim.unit.spitter.ranged.closeRange=9
sim.unit.spitter.ranged.closeFactor=0.6
# How long it takes to walk its aim in. The first shot is the wild one and by the third the cone is
# down to a third of what it was, so standing in a spitter's sights is the mistake rather than being
# shot at once. Break its line, leave its range or step out of its arc and it starts again.
sim.unit.spitter.ranged.settleShots=3
sim.unit.spitter.ranged.settledSpreadFactor=0.35
sim.unit.spitter.ranged.gun=spit
sim.unit.spitter.ranged.chargedGun=charged_spit
# Off: it takes its own ground and holds it rather than closing on him, so there is no queue for a
# spread to break up. What keeps two spitters apart is the patch each ambles around.
# No sim.unit.spitter.approach block: a block the file leaves out is off.
# It is far hungrier for a barrel than anything that closes and claws, because a barrel is what turns
# its gun into an artillery piece. Standing one next to a barrel is a decision a level makes.
sim.unit.spitter.chances.bite_a_barrel=8
sim.unit.spitter.evolvesTo=none
sim.unit.spitter.shockable=true
sim.unit.spitter.look=spitter

# THE FROG. A shooter like a spitter and a different problem from one: what it throws is not a shot
# to be hit by but a spatter to be standing in, so what the player has to read is the ground rather
# than the creature. Green, and everything it does is green - the shot and the stain are the same
# family, which is the whole of what has to be learnt about it.
sim.unit.frog.radius=1.6
sim.unit.frog.speed=7.5
sim.unit.frog.count=4
sim.unit.frog.health=60
sim.unit.frog.contactDamage=100
sim.unit.frog.attackArcDegrees=200
sim.unit.frog.attackCooldownSeconds=1.3
sim.unit.frog.victimInvulnerableSeconds=0.6
sim.unit.frog.lockSeconds=1.5
sim.unit.frog.deathThroesSeconds=1.0
sim.unit.frog.feedToEvolve=0

# IT GIVES UP EASILY, and this pair of numbers is the whole of how. Everything else on the field
# keeps hunting you fifteen world units past the range it noticed you at; a frog keeps hunting you
# four. Back off half a dozen strides and it loses you - which makes it the one creature worth
# leaving alone rather than clearing, and the only lever the player has against it that is not a
# gun. The gap is still a gap on purpose: with one number a frog standing exactly on the boundary
# would flicker between hunting and idling every tick.
sim.unit.frog.perception.alwaysAggressive=false
sim.unit.frog.perception.losesInterest=true
sim.unit.frog.perception.detectionRange=26
sim.unit.frog.perception.loseRange=30
sim.unit.frog.perception.secondaryRange=12
sim.unit.frog.perception.arcDegrees=360
sim.unit.frog.perception.requiresClearLine=false

# It ambles inside a patch while it fights, like every other shooter - and the patch has to stay
# inside the gap between closeRange and range, or it would amble out of its own reach between shots.
sim.unit.frog.wander.enabled=true
sim.unit.frog.wander.radius=9
sim.unit.frog.wander.speedFactor=0.5
sim.unit.frog.wander.arriveRadius=1.5
sim.unit.frog.wander.pauseMinSeconds=0.5
sim.unit.frog.wander.pauseMaxSeconds=1.6
sim.unit.frog.wander.waypointTimeoutSeconds=4

sim.unit.frog.avoidance.enabled=true
sim.unit.frog.avoidance.scanRange=7
sim.unit.frog.avoidance.lookaheadSeconds=0.35
sim.unit.frog.avoidance.weight=1.6

# It does not leap AT you. The hop below is how it gets about, which is a different thing entirely.
# No sim.unit.frog.leap block: a block the file leaves out is off.

# THE GAIT. A quarter of a second in the air and rather more than that sitting, so what a player
# reads is a creature that is repeatedly not going anywhere - which is when it is worth shooting.
# It is NOT a speed change: over one whole hop-and-sit it covers exactly what speed above says, so a
# frog can be tuned against a grunt without arithmetic. Shorten restSeconds and it becomes a nervous
# thing that is always moving; lengthen it and it becomes a statue that lurches.
sim.unit.frog.hop.enabled=true
sim.unit.frog.hop.hopSeconds=0.26
sim.unit.frog.hop.restSeconds=0.42

# How it shoots. Middle range - well past a spitter's eighteen and well short of a runner's sixty -
# and it does NOT hold its ground: it walks up to the distance it likes and keeps working the ground
# from there, which is what makes the hop worth watching. settleShots is zero because its aim hardly
# matters: it is throwing at a piece of floor, not at a man.
sim.unit.frog.ranged.enabled=true
sim.unit.frog.ranged.range=26
sim.unit.frog.ranged.spreadDegrees=10
sim.unit.frog.ranged.haltsToFire=true
sim.unit.frog.ranged.holdsGround=false
sim.unit.frog.ranged.arcDegrees=160
sim.unit.frog.ranged.turnRate=3
sim.unit.frog.ranged.closeRange=16
sim.unit.frog.ranged.closeFactor=0.7
sim.unit.frog.ranged.settleShots=0
sim.unit.frog.ranged.settledSpreadFactor=1
sim.unit.frog.evolvesTo=none
sim.unit.frog.ranged.gun=venom
sim.unit.frog.ranged.chargedGun=none
sim.unit.frog.shockable=true
sim.unit.frog.look=frog

# The ant (G0045). Two segments, and the front one turns a bullet: shooting it in the face does nothing,
# so a squad in a line in front of it is a squad doing nothing - somebody gets round it, or puts a fist
# in its face. Its leap does not kill: it takes a man and carries him off, and the clock on him is the
# threat. Tanky from behind on purpose - three hand strikes, nine sidearm rounds - because the only way
# to reach its soft end is to have got round it, and that should be the whole of the cost.
sim.unit.ant.radius=2.0
# Slower than a grunt: it is the thing you get round, and you cannot get round something faster than you.
sim.unit.ant.speed=7.5
sim.unit.ant.count=0
# Three hand strikes at 150 - "several", from a man in its jaws or from the man who came for him.
sim.unit.ant.health=450
# On the ground it bites like anything else; only its leap grips. This is also the blow that finishes a
# man at the end of the carry, with the lethality claws have (G0020).
sim.unit.ant.contactDamage=100
sim.unit.ant.attackArcDegrees=200
sim.unit.ant.attackCooldownSeconds=1.3
sim.unit.ant.victimInvulnerableSeconds=0.6
sim.unit.ant.lockSeconds=1.5
sim.unit.ant.deathThroesSeconds=1.0
sim.unit.ant.feedToEvolve=0
sim.unit.ant.perception.alwaysAggressive=true
sim.unit.ant.perception.losesInterest=true
sim.unit.ant.perception.detectionRange=28
sim.unit.ant.perception.loseRange=40
sim.unit.ant.perception.secondaryRange=12
sim.unit.ant.perception.arcDegrees=360
sim.unit.ant.perception.requiresClearLine=false
sim.unit.ant.wander.enabled=true
sim.unit.ant.wander.radius=10
sim.unit.ant.wander.speedFactor=0.4
sim.unit.ant.wander.arriveRadius=1.5
sim.unit.ant.wander.pauseMinSeconds=0.6
sim.unit.ant.wander.pauseMaxSeconds=1.8
sim.unit.ant.wander.waypointTimeoutSeconds=4
sim.unit.ant.avoidance.enabled=true
sim.unit.ant.avoidance.scanRange=7
sim.unit.ant.avoidance.lookaheadSeconds=0.35
sim.unit.ant.avoidance.weight=1.6
# One leap, not a sequence, and a long wind-up: the tell for the one attack in the game that takes a
# man out of the fight rather than killing him. Answered like any other leap - step aside, or put a
# fist in it (the head is soft to a fist). ONE leap has to cover the whole gap from where it commits:
# speed times airborneSeconds (12.8) must beat triggerRange less the two bodies (13 - 4 = 9), or it
# lands short, walks in and bites like a grunt - which is exactly what it did at 18 and 10.5.
sim.unit.ant.leap.enabled=true
sim.unit.ant.leap.triggerRange=13
sim.unit.ant.leap.speed=32
sim.unit.ant.leap.airborneSeconds=0.4
sim.unit.ant.leap.sequenceLength=1
sim.unit.ant.leap.betweenSeconds=0.2
sim.unit.ant.leap.cooldownSeconds=3
sim.unit.ant.leap.hesitationMinSeconds=0.25
sim.unit.ant.leap.hesitationMaxSeconds=0.45
sim.unit.ant.approach.enabled=true
sim.unit.ant.approach.offset=6
sim.unit.ant.approach.closeRange=12
# What its leap does instead of biting. carrySpeed is how fast it goes with a man in its jaws - well
# under a trooper's 13.5 and the commander's 19, so whoever goes after him catches up; the chase is the
# point, not the race. holdSeconds is how long he has: the window for the rescue, and for his own
# three swings (sim.ai.chance.struggle). Shorter and a man taken is simply a man lost.
sim.unit.ant.grip.enabled=true
sim.unit.ant.grip.carrySpeed=6
sim.unit.ant.grip.holdSeconds=8
# Killing it with him still in its jaws gets him out with escapeHarm - a wound (G0053, G0057) - thrown
# clear of it at this speed for sim.wound.shoveSeconds. Carried to the end, its own bite still kills him.
sim.unit.ant.grip.escapeKnockbackSpeed=30
sim.unit.ant.grip.escapeHarm=wound
# The head: how wide an arc round its facing a shot glances off, judged by the way the shot is flying.
# 140 leaves the flanks open - square on from the side works - and everything behind.
sim.unit.ant.armour.enabled=true
sim.unit.ant.armour.headArcDegrees=140
sim.unit.ant.evolvesTo=none
sim.unit.ant.shockable=true
sim.unit.ant.look=ant
# Off: it shoots at ground rather than at a man, so there is no queue for a spread to break up.
# No sim.unit.frog.approach block: a block the file leaves out is off.

# THE BOSS GRUNT (G0048). What is at the end of Adventure 2: a grunt grown too big to walk, sat among
# holes that keep sending more of everything, shooting in patterns. It is a place rather than a
# creature - you cannot get round it and it never comes to you - so the fight is reading the gap in
# the next salvo and walking into it with your gun on.
# Four times a nest across, so it reads from a screen away as the thing everything else is about.
sim.unit.boss_grunt.radius=6
# ZERO: it never walks. Rooted - the solver pushes whatever it meets out of its way, and a fist or a
# blow never throws it. Everything that would steer it (a hunt, a post, food) asks it for nothing.
sim.unit.boss_grunt.speed=0
sim.unit.boss_grunt.count=0
# Fifty grunts' worth (50 x 150). About 150 sidearm hits, or a squad of five on it for half a minute.
# The charge core in the middle of it is this, read down: how much of it is left (pillar 5).
sim.unit.boss_grunt.health=7500
# Claws all the way round: standing against it is not a way to be under its patterns.
sim.unit.boss_grunt.contactDamage=100
sim.unit.boss_grunt.attackArcDegrees=360
sim.unit.boss_grunt.attackCooldownSeconds=0.9
sim.unit.boss_grunt.victimInvulnerableSeconds=0.6
sim.unit.boss_grunt.lockSeconds=0.4
sim.unit.boss_grunt.deathThroesSeconds=3
sim.unit.boss_grunt.feedToEvolve=0
# detectionRange is how close you walk before the barrage starts. A little under the distance from the
# keep's point to where it sits, so taking the point does not wake it - shooting at it does, from
# anywhere: a hit it cannot answer is answered at the place it came from.
sim.unit.boss_grunt.perception.alwaysAggressive=true
sim.unit.boss_grunt.perception.losesInterest=true
sim.unit.boss_grunt.perception.detectionRange=58
sim.unit.boss_grunt.perception.loseRange=95
sim.unit.boss_grunt.perception.secondaryRange=20
sim.unit.boss_grunt.perception.arcDegrees=360
sim.unit.boss_grunt.perception.requiresClearLine=false
# THE BARRAGE. Four patterns in this order, each told by windUpSeconds of the winding-up tint and
# followed by restSeconds of nothing - the gap to walk in through. Below enragedBelow of its health
# every wait (wind-up, rest, between salvos) is multiplied by enragedFactor: the same patterns, faster.
sim.unit.boss_grunt.barrage.enabled=true
sim.unit.boss_grunt.barrage.windUpSeconds=0.9
sim.unit.boss_grunt.barrage.restSeconds=1.2
sim.unit.boss_grunt.barrage.enragedBelow=0.4
sim.unit.boss_grunt.barrage.enragedFactor=0.65
# A boss never walks and nothing interrupts it, so it starts a pattern at any distance, has no standing still to
# do, takes no stun out of it and does not roar: the giants' keys (G0071), all off.
sim.unit.boss_grunt.barrage.reach=0
sim.unit.boss_grunt.barrage.holdsStill=false
sim.unit.boss_grunt.barrage.stunCancels=false
# RING: a full circle, four times, each turned half a gap from the last - so the safe line moves and
# you step sideways between rings rather than standing still in one lane. More shots closes the gaps:
# at twenty there is a man's width between two of them from about twenty units out.
sim.unit.boss_grunt.barrage.ring.enabled=true
sim.unit.boss_grunt.barrage.ring.gun=spew
sim.unit.boss_grunt.barrage.ring.shots=20
sim.unit.boss_grunt.barrage.ring.arcDegrees=360
sim.unit.boss_grunt.barrage.ring.aimed=false
sim.unit.boss_grunt.barrage.ring.turnDegrees=9
sim.unit.boss_grunt.barrage.ring.salvos=4
sim.unit.boss_grunt.barrage.ring.intervalSeconds=0.6
sim.unit.boss_grunt.barrage.ring.burstSeconds=0
# FAN: a wall of seven at whoever it is hunting, three times. Wide enough that side-stepping one shot
# is not enough - you get out of the fan, or you get close enough that it passes either side of you.
sim.unit.boss_grunt.barrage.fan.enabled=true
sim.unit.boss_grunt.barrage.fan.gun=spew
sim.unit.boss_grunt.barrage.fan.shots=7
sim.unit.boss_grunt.barrage.fan.arcDegrees=70
sim.unit.boss_grunt.barrage.fan.aimed=true
sim.unit.boss_grunt.barrage.fan.turnDegrees=0
sim.unit.boss_grunt.barrage.fan.salvos=3
sim.unit.boss_grunt.barrage.fan.intervalSeconds=0.45
sim.unit.boss_grunt.barrage.fan.burstSeconds=0
# SPIRAL: five arms turning, three and a half seconds of it. Each arm is a string of shots with room
# between them - intervalSeconds times the spew's speed is the gap you step through, so do not shorten
# it without slowing the turn. The turn flips every time round the cycle, so the way to circle with it
# is the way you learnt last time only half the time.
sim.unit.boss_grunt.barrage.spiral.enabled=true
sim.unit.boss_grunt.barrage.spiral.gun=spew
sim.unit.boss_grunt.barrage.spiral.shots=5
sim.unit.boss_grunt.barrage.spiral.arcDegrees=360
sim.unit.boss_grunt.barrage.spiral.aimed=false
sim.unit.boss_grunt.barrage.spiral.turnDegrees=15
sim.unit.boss_grunt.barrage.spiral.salvos=12
sim.unit.boss_grunt.barrage.spiral.intervalSeconds=0.3
sim.unit.boss_grunt.barrage.spiral.burstSeconds=0
# STREAM: a tight three-shot burst of spit at whoever it is hunting, fast and hard. The one pattern
# that follows you - keep moving across it, not away from it.
sim.unit.boss_grunt.barrage.stream.enabled=true
sim.unit.boss_grunt.barrage.stream.gun=spit
sim.unit.boss_grunt.barrage.stream.shots=3
sim.unit.boss_grunt.barrage.stream.arcDegrees=10
sim.unit.boss_grunt.barrage.stream.aimed=true
sim.unit.boss_grunt.barrage.stream.turnDegrees=0
sim.unit.boss_grunt.barrage.stream.salvos=14
sim.unit.boss_grunt.barrage.stream.intervalSeconds=0.16
sim.unit.boss_grunt.barrage.stream.burstSeconds=0
sim.unit.boss_grunt.evolvesTo=none
# Shock never builds on it (G0059): a stun would not pause its barrage (G0048), so a stunned boss
# would be a state drawn on it that does nothing.
sim.unit.boss_grunt.shockable=false
sim.unit.boss_grunt.look=boss_grunt
# It does not wander, leap, hop, weave, dodge, grip or shoot a gun of its own: every block left out is off.

# THE GIANTS (G0071). A brute's body half as big again (radius 3.9: 7.8 across, inside the strip's ten-unit
# clearance and a doorway's fifteen), four times its health, slower than anything else that walks, and no leap.
# What each adds is a barrage of ONE pattern: it stands still and ROARS for windUpSeconds - the winding-up tint,
# and the ground shaking for every commander within roar.radius - then fires, then walks on through
# restSeconds. It starts only once what it hunts is within reach, and a declared stun - the pulse rifle's
# shock above all - breaks the pattern off, to be roared again from the start (stunCancels). A fist's stagger
# does not: up close is claw range.
#
# THE SEARER: a stream of short beams at whoever it hunts, one every 0.05 s for a second and a half, each thrown
# at random inside the sear's 75-degree cone - a flamethrower of lasers, re-aimed beam by beam. Each beam that
# lands wounds a man and slows him. reach is a little inside the sear's 26, so it starts where the cone lands.
sim.unit.searer.radius=3.9
sim.unit.searer.speed=3.5
sim.unit.searer.count=1
sim.unit.searer.health=1000
sim.unit.searer.contactDamage=100
# A brute's claws: one touch kills. What it adds is the barrage below; it has no leap - a block left out is off.
sim.unit.searer.attackArcDegrees=200
sim.unit.searer.attackCooldownSeconds=1.5
sim.unit.searer.victimInvulnerableSeconds=0.6
sim.unit.searer.lockSeconds=1.5
sim.unit.searer.deathThroesSeconds=1.0
# Zero: a giant has nowhere further to go by eating.
sim.unit.searer.feedToEvolve=0

# Duller still than a brute: it notices later, and gives up six units past where it noticed you where a
# brute keeps on for twelve - the one way out of a giant that is not killing it. Still more than a frog's
# four (aliens invariants).
sim.unit.searer.perception.alwaysAggressive=true
sim.unit.searer.perception.losesInterest=true
sim.unit.searer.perception.detectionRange=22
sim.unit.searer.perception.loseRange=28
sim.unit.searer.perception.secondaryRange=10
sim.unit.searer.perception.arcDegrees=360
sim.unit.searer.perception.requiresClearLine=false


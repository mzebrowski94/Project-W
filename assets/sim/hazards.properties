# Simulation tunables, one domain of them. How the files in assets/sim/ are read: world.properties.

# What an explosion does, wherever it came from. The radius is deliberately not here: a grenade and a
# barrel make blasts of different sizes and each names its own. Damage is far above any unit's health
# on purpose - a blast is fatal inside one circle and harmless outside it, and a number that left a
# brute standing would quietly turn one readable rule into a damage curve the player cannot see.
# durationSeconds is only the flash; a blast is dangerous for exactly one tick, on the tick it appears.
# Every source's blast takes this, but a gun's: a rocket's and a limpet's are their gun's, moved by what moves its
# damage - Firepower's ranks raise them (G0127, G0130).
sim.blast.damage=1000
sim.blast.durationSeconds=0.25
# How hard the ground moves, in world units, and how far past the killing circle that is felt. The
# simulation says how violent the event was and stops there; what the view does about it is entirely
# the client's, under graphic.camera.shake* - which is why a number here is a distance rather than a
# number of pixels. The reach is well over one on purpose: hearing an explosion you were not close
# enough to be killed by is most of what tells you one went off where you were not looking.
sim.blast.shakeStrength=3
sim.blast.shakeRadiusFactor=2.5
# What a blast does to a man it catches (G0053): puts him down, whatever his wounds, where he can be
# fetched. Every explosive's blast unless it names its own - only the grenade does.
sim.blast.harm=down

# What the commander throws. range is a DISTANCE and not a countdown: a bounce changes a grenade's
# direction and never its speed, so every throw covers the same ground however many walls it comes
# off - which is what makes banking one off a corner worth learning. It is spent along the aim
# direction and never towards the aim point, so pulling the view back with Tab can never reach
# further. range is comfortably longer than blastRadius, or every throw would be suicide; the two
# together are what decide how close the commander has to be standing when it goes off.
sim.grenade.cooldownSeconds=1.2
sim.grenade.speed=38
sim.grenade.range=34
sim.grenade.radius=0.55
sim.grenade.blastRadius=6
# How many grenades a commander carries at most, and starts a level and every return with (G0077). A throw spends
# one and none left throws nothing; a grenade cache from a crate fills him again, and Bandolier raises it. A
# trooper's throws are not counted (G0051).
sim.grenade.most=3
# What the grenade's own blast does to a man: WOUNDS him, where every other blast puts him down. A
# grenade is the weapon meant to wound that G0018's revisit asked for - still on nobody's side, so a
# throw at your own feet costs a wound, and a second puts you down. It kills every alien it catches
# exactly as before: they read sim.blast.damage.
sim.grenade.blastHarm=wound

# ---- FIRE --------------------------------------------------------------------------------------
# What an explosion leaves burning where it was. One block for every fire in the game: what makes a
# barrel's fire worse than a grenade's is that the barrel's blast was wider, because every size here
# is a FRACTION of the blast's own radius. A new explosive therefore gets fire without naming a
# single number, and the flamethrower gets none, because it leaves no blast at all.
#
# It is ruined ground with a different declaration rather than a second mechanic (G0035), so all the
# slick rules hold: each circle is an ordinary body carrying an ordinary blow, the blow is the
# wounding kind, and the circle that burns you is the circle you can see. The one difference from
# venom is the side - a blast is on nobody's, so its fire catches the commander as readily as it
# catches what he threw it at, and everything steers round it.
#
# blobs is what makes it read as a fire rather than as a second explosion; one circle would be walked
# round. spreadFactor is well under one on purpose: the fire has to sit INSIDE the ground the blast
# already took, or an explosion would be reaching further after it was over.
sim.fire.blobs=5
sim.fire.radiusFactor=0.3
sim.fire.spreadFactor=0.65
# How long the ground burns. Drawn per circle between the two, so a fire goes out in patches rather
# than all at once - and long enough that a grenade thrown at your own feet fences you in for a
# while, which is the whole cost of the mechanic.
sim.fire.minSeconds=5
sim.fire.maxSeconds=10
# Far above any health in the game, exactly as a blast's is, for anything with health. A man it WOUNDS
# (G0053) and throws off itself at knockbackSpeed, for sim.wound.shoveSeconds - so a spread of five
# circles costs one wound a grace, not five on one tick. victimInvulnerableSeconds is an alien's; a
# man's protection is his own grace.
sim.fire.damage=1000
sim.fire.victimInvulnerableSeconds=1.6
sim.fire.knockbackSpeed=30
# How much of its life a circle spends swelling, and how much collapsing again. THE BODY IS THE
# DRAWING, so these are reach as well as picture: a fire that is still growing has not reached you
# yet, and one that is dying lets go of the ground as it shrinks. Raise growFraction if fire catches
# people who thought they were clear; raise fadeFraction if it reads as snapping out of existence.
sim.fire.growFraction=0.15
sim.fire.fadeFraction=0.45

# ---- GEYSER -------------------------------------------------------------------------------------
# A brown circle on the ground that lies dormant, fills and erupts in fire, over and over (G0089, provisional, for
# review): the second source of fire beside a blast, and the same fire in every way - laid through the one slick
# path, sized as a blast of the geyser's own radius (sim.fire.* above, swell and collapse included), on nobody's
# side, wounding and shoving, steered round. Dormant it is walkable ground: nothing steers round it or stops on it.
# How many a biome holds is its furniture.geysersMin/Max - only the cut has any.
#
# radius in world units, as a boulder's and a trunk's are (a tile is 5), drawn per geyser from its placement pass.
sim.geyser.radiusMin=5
sim.geyser.radiusMax=13
# How long it lies quiet, drawn per geyser per cycle, keyed off the geyser itself so no two keep time. Refused under
# 4 at load: shorter and a man who waited out one eruption meets the next on the way across.
sim.geyser.dormantMinSeconds=4
sim.geyser.dormantMaxSeconds=9
# The warning: its fire mark pulses for this long before it goes. Lower it and geysers catch men who were watching.
sim.geyser.fillingSeconds=1.5
# How long one eruption's fire burns, swell and collapse included; it counts as dormant only once it is out.
# Shorter than a blast's fire on purpose - a geyser goes off again, so it is a rhythm to time, not a wall.
sim.geyser.burnSeconds=5

# What an alien leaves where it dies (G0076): a spatter of its own venom, on its side, so the swarm wades
# through it and the player's men go round it. One block for every strain, as fire is for every blast.
# HOW MANY circles is not here - it is each strain's sim.unit.<strain>.deathSlicks (zero for all of them)
# plus what the toxic_blood adaptation adds, so a shipped game leaves nothing until the swarm adapts.
#
# Smaller and shorter-lived than a frog's spatter on purpose: it is litter left by every kill, not a
# weapon aimed at you, and a field of dead aliens should be ground to pick through rather than a wall.
sim.blood.radius=1.5
sim.blood.spread=1.2
sim.blood.seconds=4
sim.blood.secondsMax=4
# Venom's blow: a man it catches is WOUNDED (G0053) and shoved off at knockbackSpeed.
sim.blood.damage=1000
sim.blood.victimInvulnerableSeconds=1.6
sim.blood.knockbackSpeed=30
sim.blood.fadeFraction=0.3
# The chance a trooper gives one spatter room, drawn once per man per spatter: he goes round all of it or
# walks through all of it. Lower it and men blunder into the litter of a fight more often.
sim.blood.heeded=0.85

# The explosive barrel. It is a pickup rather than an obstacle on purpose: avoidance steers a unit
# around anything solid EXCEPT a pickup, so as an obstacle the aliens would carefully walk round it.
# Health is one because a barrel is a trigger standing in the open, not something to grind down -
# anything that touches it at all sets it off. blastRadius is the number that decides whether one is
# scenery or a reason to move: it is well over five times the barrel itself.
sim.barrel.health=1
sim.barrel.blastRadius=11
# How wide it goes off when something BIT INTO it rather than shooting it. Far smaller, on purpose:
# whatever set it off that way had its mouth on the thing and takes most of the blast itself, so a
# barrel the aliens blunder into is a gift rather than a disaster. Shooting one is still the full
# circle above, which is what keeps a barrel worth aiming at instead of worth waiting beside.
sim.barrel.bittenBlastRadius=4

# ---- MINE --------------------------------------------------------------------------------------
# The barrel's opposite number. A barrel is a thing standing in the open that the player sets off at
# the right moment; a mine is a thing lying in the open that decides for itself, so what one is worth
# is entirely where it was put. ONLY THE OTHER SIDE ARMS ONE - a commander and his troopers walk over
# them - but the blast, like every blast, is on nobody's side, so standing beside one when it goes is
# still his own doing.
#
# radius is small because it has to read as a dot on the ground rather than as something standing on
# it. triggerRadius is barely past the thing itself: a mine that reached out would be a grenade the
# player did not have to aim, and a creature is meant to nearly stand on one. blastRadius is well
# under a barrel's, because a level lays these in numbers.
sim.mine.radius=0.7
sim.mine.triggerRadius=2.0
# The moment. Long enough that the player sees it start and something nearby might still walk clear,
# short enough that whatever set it off is usually still standing on it. This is the number to turn
# if minefields read as free kills or as free warnings.
#
# Raised from 1.1 on 2026-09-20: at that length a mine read as going off the instant anything came
# near, so the fuse was a thing you were told about afterwards rather than a moment you got to watch.
# It is still a trap rather than a fence - much past this and whatever armed one has walked out of
# the blast before it goes, which makes a minefield ground nobody can cross rather than ground the
# other side dies on. triggerRadius came down with it: a longer fuse reaching further out would let
# a creature arm one from a stride away and be gone, so now it has to nearly stand on the thing.
sim.mine.fuseSeconds=2.5
sim.mine.health=1
sim.mine.blastRadius=4.5
# How long one flash of the fuse lasts at the start and at the end. It QUICKENS, and that acceleration
# is the whole tell - the number it is counting is never shown, because a player doing arithmetic
# mid-fight is pillar 1's problem.
# Widened with the fuse: the tell is the QUICKENING, and over two and a half seconds a flash that
# starts at a third of a second has barely anywhere to accelerate from.
sim.mine.flashFromSeconds=0.55
sim.mine.flashToSeconds=0.08

# ---- BLOAT -------------------------------------------------------------------------------------
# What a beam held on a body does to it. One block for every unit in the game rather than a number
# per strain, because what already varies between a grunt and a brute is the BODY: the same rise
# applied to a bigger corpse makes a bigger thing with nothing said about either.
#
# WHAT FILLS IS DRAWN ON IT, NOT DONE TO IT. The tell is a bright ring growing over the thing, sized
# in graphic.properties; the body itself is never touched. A corpse that physically swelled shoved
# everything standing near it around and quietly changed what a doorway was worth, which is a great
# deal of consequence for a tell.
#
# livingFactor is where "partly charged beforehand and finished later" lives: a thing still on its
# feet banks only this fraction of each shot. One would mean anything burnt to death arrives nearly
# full and there is no decision left about the body; too little and the kill counts for nothing and
# every corpse starts from scratch. At 0.6, burning a grunt down banks about four tenths of a ring
# and finishing it costs about another second of beam.
#
# settlePerSecond is what LETTING GO costs, and it runs only on a tick nothing was pointed at it - a
# thing being charged does not settle. Draining it while the beam was on it was the bug that made
# this read as broken: a grunt's corpse gained two hundredths of a ring per second and a brute's,
# whose bigger body takes the beam more slowly, actually went DOWN while it was being burnt.
#
# referenceRadius is the body a gun's bloatPerShot is quoted against, so A BIGGER THING TAKES LONGER
# in proportion to its radius. Set to the grunt's 1.8: one shot against a grunt is worth exactly what
# the gun says, and a brute is proportionally more work. In proportion to the radius rather than to
# the area on purpose - squaring it would make a brute four times the job rather than half again,
# and what the player has to feel is that a bigger creature is A BIT dearer, not that it is a
# different mechanic.
#
# settlePerSecond is what letting go costs: from full it takes about three seconds to come back to
# nothing, so walking away really is walking away and coming back is still worth it. holdSeconds is
# the least a charged body has left to lie there, refreshed every tick while there is any charge at
# all - it is what makes a half-filled corpse something to come back to rather than something you
# had to finish in one go.
#
# blastFactor is how wide the circle is as a MULTIPLE OF THE BODY'S OWN RADIUS, so a brute leaves a
# bigger bang than a grunt for the same reason it took longer to fill. Five puts a grunt's corpse at
# a mine's nine and a brute's at thirteen, past a barrel - raised from four because at twice the
# body's diameter a grunt's flash was smaller than the ring that charged it and went unnoticed. It
# is drawn in the RING'S OWN COLOUR rather than an explosion's, so the flash reads as that ring's
# payoff rather than as something else going off in the same place, and it leaves nothing burning,
# which no other explosion in the game can say - a corpse bomb that fenced off the ground it went
# off on is a tool you cannot use twice in the same place. Zero turns the mechanic off entirely.
#
# HOW LONG the flash lasts is sim.blast.durationSeconds, shared with every other explosion.
sim.bloat.referenceRadius=1.8
sim.bloat.livingFactor=0.6
sim.bloat.settlePerSecond=0.15
sim.bloat.blastFactor=5
sim.bloat.holdSeconds=1.2

# SHOCK (G0059): what a gun that stuns only once enough of it has landed builds on a body - the pulse
# rifle. BY THE SIZE OF THE BODY - its area: a gun's stunAfterHits is quoted against smallestRadius (the leech, 0.8)
# and the largest body, largestRadius (the giants, 3.9), takes growth times that, along a straight line by area in
# between and no more past it. The pulse rifle's 2 makes it 2 bolts at a leech, about 3 at a runner or a grunt, 5 at a
# brute, 6 at a slinger, 10 at a searer or a thumper (2026-11-15; was in proportion to the radius from the grunt).
# drainPerSecond is what comes off on a tick no hit builds it: from half full, a second and a quarter. Raise it and
# only a trigger held on one body stuns; lower it and sweeping a crowd stuns them one after another.
sim.shock.smallestRadius=1.0
sim.shock.largestRadius=3.9
sim.shock.growth=5
sim.shock.drainPerSecond=0.4

# ---- GROUND ------------------------------------------------------------------------------------
# What standing on a kind of ground costs whatever is standing on it. ONE MEANS NOTHING HAPPENS,
# which is what every terrain here declares but one - the same "not for me" the rest of this file
# says with a zero, said with a number whose neutral value happens to be one. A kind of ground is
# otherwise a colour and a mood; these two numbers are the only thing that makes one a decision.
#
# THE TWO SIDES FEEL IT DIFFERENTLY, AND THAT IS THE MECHANIC. A thicket that slowed everybody
# equally would be scenery: both sides arrive at the fight in the same order they would have on open
# ground and the only thing that changed is how long the walk took. Slowing the player's side
# harder is what makes it ground he has to decide about - going round costs seconds, going through
# costs the seconds AND the exchange he has to have while wading - and it is the first thing on the
# field that is worse for him than for them by declaration.
#
# Nothing is closed off: a thicket is passable ground and every route, every flow field and every
# reachability check treats it as the open ground it is. What it changes is the pace and never the
# course, exactly as a slow from the beam does, and the two multiply.
#
# playerFactor is the number to turn if the thicket reads as a wall rather than as a decision; raise
# alienFactor towards one if it reads as somewhere the aliens are also stuck, which is not what it
# is for.
sim.ground.thicket.playerFactor=0.45
sim.ground.thicket.alienFactor=0.82
# The desert's mud: undergrowth's numbers, so a patch of it is the same decision in a biome with no undergrowth.
sim.ground.mud.playerFactor=0.45
sim.ground.mud.alienFactor=0.82

sim.weapon.detonator.heat.resumeBelow=0
sim.weapon.detonator.recoilSpeed=0
sim.weapon.detonator.recoilSeconds=0
sim.weapon.detonator.muzzleOffset=0
sim.weapon.detonator.pierceIntervalSeconds=0
sim.weapon.detonator.slowFactor=1
sim.weapon.detonator.slowSeconds=0
sim.weapon.detonator.selfSlowFactor=1
sim.weapon.detonator.selfSlowSeconds=0
sim.weapon.detonator.trailLength=0

# How far the cry of it sticking carries (G0016): every enemy within this goes to look at the place, once. Smaller
# than a nest's cry on purpose - it is a decoy, not an alarm. Zero is silent.
sim.weapon.detonator.limpet.rouseRadius=34

# ---- THE PULSE RIFLE ----------------------------------------------------------------------------
# Two pistols' worth of bolts, one from each hand: muzzleOffset throws them from alternate sides of the
# line of fire, as the turret's twin mount does, wide enough to read as two guns. Slower than the
# sidearm and under a quarter of its damage a bolt - what it buys is SHOCK (G0059): every bolt that
# lands builds it on what it hit, and full shock is a stun of stunSeconds.
#
# stunAfterHits is how many bolts fill the SMALLEST body (sim.shock.smallestRadius), and a bigger body takes more BY
# ITS SIZE, up to sim.shock.growth times that at the largest (sim.shock.*, G0095): 2 at a leech or anything that small,
# about 2.5 at a runner, 3 at a grunt, 5 at a brute, 6 at a slinger, 10 at a searer or a thumper. Shock drains at
# sim.shock.drainPerSecond between bolts too, so held on one body it takes a few more. Damage 12 since 2026-11-15
# (was 10), asked for a bit more: SimConfigTest.stunsWithThePulseRifleBeforeItKills holds that it stuns before it
# kills whatever it does not kill in three bolts anyway - the easy tier's runner, 32 as it arrives, dies on the third.
# Raise damage or cooldownSeconds and it is the first thing to check. A sprayed crowd builds
# little on any one of them. The stun empties it, and nothing builds while the stun runs: a held
# trigger stuns, lets go, and has to build again.
#
# It runs hot, but SLOWER THAN THE BEAM (combat: the beam runs out sooner than anything else he can pick
# up): about seven seconds of trigger against the beam's four, then nearly three of nothing.
sim.weapon.pulse.cooldownSeconds=0.2
sim.weapon.pulse.projectileSpeed=110
sim.weapon.pulse.projectileRadius=0.4
sim.weapon.pulse.projectileRange=0
sim.weapon.pulse.damage=12
sim.weapon.pulse.pellets=1
sim.weapon.pulse.spreadDegrees=0
sim.weapon.pulse.projectileLook=bolt
sim.weapon.pulse.stunSeconds=1
sim.weapon.pulse.stunAfterHits=2
sim.weapon.pulse.bounces=0
sim.weapon.pulse.type=energy

# ---- THE DISC GUN -------------------------------------------------------------------------------
# One disc a pull, and it COMES BACK OFF WHAT IT HITS: rock, the arena's edge, scenery and anything alive
# of the other side alike, landing a full blow on every body it comes off and passing straight through his
# own men. bounces is how many things it comes off; the next one stops it. projectileRange is the whole of
# its flight, counted along every leg, so a disc rattling round a corner still goes out - it is what stops
# one bouncing up and down a corridor for ever.
#
# Two blows kill a grunt, so what one disc is worth is entirely how many bodies its path finds: a straight
# miss into open ground is one wasted reload, and a disc into a crowd in a corridor can take two of them
# apart. It never hurts his own side, which is the whole of its difference from the bazooka - a
# gun you can fire into a scrum.
#
# THE RELOAD IS THE HEAT BAR, as the bazooka's is (G0058): perShot=1 runs it to the stop with every disc,
# and from full at coolPerSecond 0.5 the next one is two seconds off - half a second sooner than a rocket.
# The kick and the shake are the bazooka's, lighter: a pull throws him back about two-thirds as hard, for
# a shorter moment.
sim.weapon.disc_gun.cooldownSeconds=0.3

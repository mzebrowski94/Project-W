sim.weapon.charged_spit.trailLength=0
sim.weapon.charged_spit.bloatPerShot=0
sim.weapon.charged_spit.stunSeconds=0

# What the boss throws in its patterns (G0048). Slow on purpose - slower than the commander walks -
# because a pattern is read and walked through, not reacted to, and it comes twenty at a time. Half a
# spit: two of them put a man down, so one mistake in a ring is a lesson rather than the end.
# projectileRange is the size of the boss's fight: a pattern fades out this far from its body, so what
# is drawn is a ring round him rather than the whole keep full of shots - and it stops short of the
# keep's east barrels and guns, which his patterns would otherwise pop on their first pass.
# cooldownSeconds is never read - a barrage has its own timing - and is here because every gun has one.
sim.weapon.spew.cooldownSeconds=1

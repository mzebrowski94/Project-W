# The commander's hand strike: short, fast, and lethal to an enemy but not to a brute. Every value
# here is what will differ between melee weapons - a heavier one winds up, sweeps wider and shoves
# harder, and no code changes.
sim.melee.cooldownSeconds=0.6
sim.melee.windupSeconds=0
# How long the sweep lingers. It is most of the window the player has: a leap flies into a sweep that
# is still out. Raised from 0.12 on 2026-09-27 together with the reach below - measured against a
# charging grunt, the old numbers left exactly no tick on which a single press both landed and won,
# and a runner three ticks (50 ms). These give both about eight (130 ms): a reflex, not a guess.
sim.melee.activeSeconds=0.2
# Still short on purpose. A commander is 2.0 across the middle and an enemy 1.8, so they touch at 3.8
# apart; this reaches 5.6 (reach plus radius plus his own), which means the sweep still cannot land
# until whatever it is answering is nearly on him. This number decides when he must press, not how
# long he has to press it.
sim.melee.reach=2.4
sim.melee.radius=1.6
# At least a grunt's health, always - SimConfigTest.deletesAnOrdinaryEnemyWithOneSwing holds it, on the
# health the grunt ARRIVES with: its own scaled by sim.swarm.healthPercent. It sat at 120 after grunts went
# to 150, so one swing never killed the thing it was built to answer and the enemy's claws landed while
# it was still standing. Raised from 150 to 190 on 2026-09-29 with the swarm's factor (188 a grunt,
# 313 a brute), so a brute still takes two. Raised to 220 with a mission's tiers (G0063): the guarantee holds
# on every tier's numbers too, and hard's grunt is 216; easy's brute is 266, so it still takes two. Raised to 300
# with the grunt's 200 (ticket 18): hard's grunt is 288, easy's brute 478, so a brute takes two still.
sim.melee.damage=300
sim.melee.arcDegrees=180
# What a connecting sweep costs. It is spent only when the sweep kills - then both of them are held
# and tangled together. A target that survives is staggered for this long and the commander is not
# held at all: he shoved something away rather than grappling with it, and is free to follow up.
# Spent only on a target that had already committed to attacking - answering a leap tangles the two of
# them together, and swatting something that was only walking costs him nothing but the cooldown.
sim.melee.locksCommittedOnly=true
sim.melee.lockSeconds=1.0
# How a lethal answer to a leap finishes. The body keeps going along the line it died on, decaying,
# and the solver does the rest: a corpse is immovable and the commander is not, so the body arriving
# shoves him back and the two travel the last of it together. It must carry further than the sweep
# out-reaches a touch - reach plus radius minus his own radius, 2.0 at these numbers - or the clinch
# ends with a gap in it; SimConfig refuses one that does not. 21 carries 2.2.
sim.melee.clinchCarrySpeed=21
sim.melee.clinchCarryDecay=100
sim.melee.knockbackSpeed=45
sim.melee.knockbackDecay=120


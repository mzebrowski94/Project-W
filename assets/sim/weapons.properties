# The shotgun. Six pellets thrown wide, slowly. The cone is the same width at every distance - it is
# applied by turning each pellet rather than by aiming it somewhere else - so how much of a pull lands
# is entirely how close he got: all six kill a grunt outright, and one or two at range annoy it.
# Its reach is short but comfortably past the flamer's: the two are the same trade at different
# distances, and a gap between them would leave a band nothing covers.
#
# FOUR PULLS, THEN A RELOAD (G0079). The heat bar is worth four pulls fired close together: the fourth
# stops it, the third never does - even at Weapon Handling's shortest cadence, where less comes off
# between pulls (SimConfigTest). resumeBelow=0 is the reload: stopped, it waits for the bar to cool all
# the way down, from full at coolPerSecond 0.35 a little under three seconds, drawn as the arc over him.
# Pulls spaced a second or more apart never fill it - cooling outruns them - so the stop is the price of
# emptying it in a rush, not of using it. perShot sits in a narrow band (about 0.38-0.41 against this
# cadence and cooling): retune the three together.
# damage 48 (was 22, then 36): a whole pull is 288, so all six kill a grunt outright - as it arrives, 200 x
# sim.swarm.healthPercent, on every tier up to hard's 288 (SimConfigTest) - and one at range kills a runner.
# Sustained it deals a little more than it did - four pulls every four and a half seconds - and the burst
# more than twice that, which is what the rework asked for.
# THE KICK is a light one (G0058): about half a unit of ground a pull against the disc gun's one and a

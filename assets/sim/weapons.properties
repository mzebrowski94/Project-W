# WHAT A FROG THROWS. The shot itself does NOTHING - its damage is zero and its harm none on purpose,
# because what a frog does to you is the ground and not the hit. It still LANDS (G0057): it breaks a
# shield, and a man it hits turns towards the frog. projectileRange is what makes it a middle-range
# weapon: a miss bursts short of you rather than flying on, so standing in the wrong place is the
# mistake rather than failing to dodge.
#
# THE SLICK IS THE WEAPON. blobs circles of radius, thrown inside spread of where it burst, lying
# there for seconds. spread below radius is what makes them read as one ruined shape rather than as
# a rosette of puddles. damage is far above any health in the game, exactly as a blast's is, for
# anything with health. A man it WOUNDS (G0053) and throws off itself at slicks.knockbackSpeed; his
# grace, not victimInvulnerableSeconds, is what stops the rest of the spatter landing on the same
# tick. victimInvulnerableSeconds is an alien's, and venom never touches an alien.

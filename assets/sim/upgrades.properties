# Simulation tunables, one domain of them. How the files in assets/sim/ are read: world.properties.

# ---- UPGRADES ----------------------------------------------------------------------------------
# What the players earn on the field and hold for the rest of the level (ADR 0017, G0049), and how it
# is earned. An upgrade changes numbers, never what anything is made of; every number it may move is
# a stat below, read in exactly one place.

# How drafts are earned. A control point taken, a hold wave cleared and a boss killed each earn one:
# the FIRST of each at once, then one every so many - so a level with about 25 sources gives about five
# drafts. Zero switches a source off. options is cards per draft; a small pool deals fewer.
# tierFrom is how many drafts must have been earned before tier 1, 2 and 3 are dealt, so the strong
# cards come later in the level without a timer.
sim.upgrade.draft.options=3
sim.upgrade.draft.pointsPerDraft=4
sim.upgrade.draft.wavesPerDraft=8
sim.upgrade.draft.bossesPerDraft=2
sim.upgrade.draft.tierFrom=0,3,6

# How far each stat may be moved, whatever is held. A scaled stat has a range for the sum of its
# percentages, a count a floor; the keys a stat does not use stay zero, or the catalogue check refuses
# them. The cooldown floor of -50 is what keeps Weapon Handling a rate and not a hose: heat per shot
# never scales, so a hot gun overheats sooner - it buys bursts, not sustained fire.
sim.upgrade.stat.fire_cooldown.minPercent=-50
sim.upgrade.stat.fire_cooldown.maxPercent=100
sim.upgrade.stat.fire_cooldown.min=0
sim.upgrade.stat.gun_damage.minPercent=-50
sim.upgrade.stat.gun_damage.maxPercent=100
sim.upgrade.stat.gun_damage.min=0
sim.upgrade.stat.men_per_crate.minPercent=0
sim.upgrade.stat.men_per_crate.maxPercent=0
sim.upgrade.stat.men_per_crate.min=1
sim.upgrade.stat.squad_headroom.minPercent=0
sim.upgrade.stat.squad_headroom.maxPercent=0
sim.upgrade.stat.squad_headroom.min=0
sim.upgrade.stat.grenade_cooldown.minPercent=-50
sim.upgrade.stat.grenade_cooldown.maxPercent=100
sim.upgrade.stat.grenade_cooldown.min=0
# How many grenades a commander carries at most (G0077), never below one: Bandolier.
sim.upgrade.stat.grenade_most.minPercent=0
sim.upgrade.stat.grenade_most.maxPercent=0
sim.upgrade.stat.grenade_most.min=1
sim.upgrade.stat.chance.minPercent=0
sim.upgrade.stat.chance.maxPercent=0
sim.upgrade.stat.chance.min=0
sim.upgrade.stat.speed.minPercent=-50
sim.upgrade.stat.speed.maxPercent=50
sim.upgrade.stat.speed.min=0
sim.upgrade.stat.stabilise_speed.minPercent=-50
sim.upgrade.stat.stabilise_speed.maxPercent=100
sim.upgrade.stat.stabilise_speed.min=0
# A leap's speed, the range it commits from and its time in the air (Long Leap); speed and time together
# are how far it goes. The bases are each strain's sim.unit.<strain>.leap.*. How many leaps a sequence at a
# man strings together is a count (Chain Leap), never below one; a leap at a door is always one (G0069).
sim.upgrade.stat.leap_speed.minPercent=-50
sim.upgrade.stat.leap_speed.maxPercent=100
sim.upgrade.stat.leap_speed.min=0
sim.upgrade.stat.leap_trigger_range.minPercent=-50
sim.upgrade.stat.leap_trigger_range.maxPercent=100
sim.upgrade.stat.leap_trigger_range.min=0
sim.upgrade.stat.leap_airborne_ticks.minPercent=-50
sim.upgrade.stat.leap_airborne_ticks.maxPercent=100
sim.upgrade.stat.leap_airborne_ticks.min=0
sim.upgrade.stat.leap_sequence_length.minPercent=0
sim.upgrade.stat.leap_sequence_length.maxPercent=0
sim.upgrade.stat.leap_sequence_length.min=1
# What an alien notices from, gives up past and ambles about in (Bloodhound): the bases are each strain's
# sim.unit.<strain>.perception.* and .wander.radius. A lose range is never shorter than the detection range
# at any rank (SimConfigTest), so detection may rise no further than lose may.
sim.upgrade.stat.wander_radius.minPercent=-50
sim.upgrade.stat.wander_radius.maxPercent=200
sim.upgrade.stat.wander_radius.min=0
sim.upgrade.stat.detection_range.minPercent=-50
sim.upgrade.stat.detection_range.maxPercent=100
sim.upgrade.stat.detection_range.min=0
sim.upgrade.stat.lose_range.minPercent=-50
sim.upgrade.stat.lose_range.maxPercent=100
sim.upgrade.stat.lose_range.min=0
# How many a nest's brood holds: the size it drew from sim.nest.broodMin..broodMax, plus what Larger Brood
# adds. A count, never below one; the brood it leaves when it dies is not moved.
sim.upgrade.stat.nest_brood_size.minPercent=0
sim.upgrade.stat.nest_brood_size.maxPercent=0
sim.upgrade.stat.nest_brood_size.min=1
# How many circles of venom an alien leaves where it dies (G0076): its strain's deathSlicks, zero for all
# of them, plus what Toxic Blood adds. A count, never below none.
sim.upgrade.stat.death_slicks.minPercent=0
sim.upgrade.stat.death_slicks.maxPercent=0
sim.upgrade.stat.death_slicks.min=0
# How long a stun leaves the one it lands on unable to act (G0053). No upgrade moves it yet; the floor
# of -75 keeps even the best of them a stun rather than a flinch.
sim.upgrade.stat.stun_duration.minPercent=-75
sim.upgrade.stat.stun_duration.maxPercent=100
sim.upgrade.stat.stun_duration.min=0
# How many wounds a man carries on his feet, and how long after his last one they clear on their own
# (G0053). Counts: the base is sim.commander.maxWounds / sim.trooper.maxWounds and sim.wound.mendSeconds.
sim.upgrade.stat.max_wounds.minPercent=0
sim.upgrade.stat.max_wounds.maxPercent=0
sim.upgrade.stat.max_wounds.min=0
sim.upgrade.stat.mend_seconds.minPercent=0
sim.upgrade.stat.mend_seconds.maxPercent=0
sim.upgrade.stat.mend_seconds.min=0
# How many cards of one cache the armoury deck holds (G0056). A count, moved only by a deal, which only
# ever adds: the base is each cache's sim.pickup.<cache>.armoury.cards.
sim.upgrade.stat.armoury_cards.minPercent=0
sim.upgrade.stat.armoury_cards.maxPercent=0
sim.upgrade.stat.armoury_cards.min=0
# The fewest pickups a crate is dealt (G0056): a count whose base is sim.crate.fewest; the most rises with
# it, and neither passes the four a crate can hold. And how many of one card every crate holds at least,
# moved only by a stock, whose base is none.
sim.upgrade.stat.crate_least.minPercent=0
sim.upgrade.stat.crate_least.maxPercent=0
sim.upgrade.stat.crate_least.min=1
sim.upgrade.stat.crate_stock.minPercent=0
sim.upgrade.stat.crate_stock.maxPercent=0
sim.upgrade.stat.crate_stock.min=0

# The catalogue, one block per upgrade under sim.upgrade.<kind>. side is player (an upgrade) or alien
# (an adaptation); weight how likely it is dealt against the others, zero off; ranks how many times it
# can be taken; tier which tierFrom entry unlocks it; requires an upgrade that must be held first, or
# none; group above zero makes the upgrades sharing it exclusive; answers is, for an adaptation, the
# players' upgrade it is an answer to (sim.adaptation.answerWeight), and none for every upgrade.
# effects is what ONE rank does, separated by ";", each naming whom it reaches: squad, commanders,
# chooser (a personal upgrade, ranked per player), team (squad and commanders) or side (a number no one
# unit reads) - or, for an adaptation, aliens (every one of them) or one strain of alien
# (breed <strain> <stat> <percent>).

# Larger Army: each rank is one more man per crate and room for two more in the squad, so the extra
# men are not wasted at the ceiling.
sim.upgrade.larger_army.side=player
sim.upgrade.larger_army.weight=10
sim.upgrade.larger_army.ranks=3
sim.upgrade.larger_army.tier=1
sim.upgrade.larger_army.requires=none
sim.upgrade.larger_army.group=0
sim.upgrade.larger_army.answers=none
sim.upgrade.larger_army.effects=count men_per_crate side 1; count squad_headroom side 2

# Weapon Handling Training: a shorter wait between shots for the squad and every commander, whatever
# gun they are holding. Twelve percent a rank, so three ranks are a third off the cooldown and the
# floor above is never reached by this alone.
sim.upgrade.weapon_handling.side=player
sim.upgrade.weapon_handling.weight=10
sim.upgrade.weapon_handling.ranks=3
sim.upgrade.weapon_handling.tier=1
sim.upgrade.weapon_handling.requires=none
sim.upgrade.weapon_handling.group=0
sim.upgrade.weapon_handling.answers=none
sim.upgrade.weapon_handling.effects=scale fire_cooldown team -12

# Marksmen: the squad's shots hit harder, whatever gun each man holds - a man who picked up a crate's
# gun included. The commander's own aim is his, so it does not reach him.
sim.upgrade.marksmen.side=player
sim.upgrade.marksmen.weight=10
sim.upgrade.marksmen.ranks=2
sim.upgrade.marksmen.tier=1
sim.upgrade.marksmen.requires=none
sim.upgrade.marksmen.group=0
sim.upgrade.marksmen.answers=none
sim.upgrade.marksmen.effects=scale gun_damage squad 15

# Field Medicine: a trooper goes for a man who is down more readily - per second of opportunity, on
# top of sim.ai.chance.aid_a_trooper (0.4) and aid_the_commander (1.5), so the commander stays first.
sim.upgrade.field_medicine.side=player
sim.upgrade.field_medicine.weight=10
sim.upgrade.field_medicine.ranks=2
sim.upgrade.field_medicine.tier=1
sim.upgrade.field_medicine.requires=none
sim.upgrade.field_medicine.group=0
sim.upgrade.field_medicine.answers=none
sim.upgrade.field_medicine.effects=chance aid_a_trooper squad 0.2; chance aid_the_commander squad 0.5

# Grenadier: PERSONAL - it reaches only the commander of the slot that took it, and its ranks count per
# player, so two players' kits can differ (G0049). A fifth off the wait between grenades each rank.
sim.upgrade.grenadier.side=player
sim.upgrade.grenadier.weight=10
sim.upgrade.grenadier.ranks=3
sim.upgrade.grenadier.tier=1
sim.upgrade.grenadier.requires=none
sim.upgrade.grenadier.group=0
sim.upgrade.grenadier.answers=none
sim.upgrade.grenadier.effects=scale grenade_cooldown chooser -20

# Forced March: a faster squad. The commander's pace is his own and this never reaches it, and the
# squad at its last rank must still be slower than he is (SimConfigTest) - a squad following him
# strings out behind rather than crowding him.
sim.upgrade.forced_march.side=player
sim.upgrade.forced_march.weight=10
sim.upgrade.forced_march.ranks=2
sim.upgrade.forced_march.tier=1
sim.upgrade.forced_march.requires=none
sim.upgrade.forced_march.group=0
sim.upgrade.forced_march.answers=none
sim.upgrade.forced_march.effects=scale speed squad 10

# First Aid: a man is back on his feet sooner, whoever is working on him. A quarter more work per tick
# is a fifth off sim.casualty.stabiliseSeconds - the time standing still in the open that is the price.
sim.upgrade.first_aid.side=player
sim.upgrade.first_aid.weight=10
sim.upgrade.first_aid.ranks=2
sim.upgrade.first_aid.tier=1
sim.upgrade.first_aid.requires=none
sim.upgrade.first_aid.group=0
sim.upgrade.first_aid.answers=none
sim.upgrade.first_aid.effects=scale stabilise_speed team 25

# Thick Skin: one more wound on his feet, per rank, for the squad and every commander (G0053). Tier 2,
# because a second wound is a second chance at every spit in the level - it is the strongest card here.
sim.upgrade.thick_skin.side=player
sim.upgrade.thick_skin.weight=8
sim.upgrade.thick_skin.ranks=2
sim.upgrade.thick_skin.tier=2
sim.upgrade.thick_skin.requires=none
sim.upgrade.thick_skin.group=0
sim.upgrade.thick_skin.answers=none
sim.upgrade.thick_skin.effects=count max_wounds team 1

# Self-Treatment Training: PERSONAL - the commander of the slot that took it has his wounds clear on
# their own ten seconds after his last one (G0053). A new wound starts the ten seconds again, so it
# rewards getting out of the fight rather than standing in it.
sim.upgrade.self_treatment.side=player
sim.upgrade.self_treatment.weight=10
sim.upgrade.self_treatment.ranks=1
sim.upgrade.self_treatment.tier=1
sim.upgrade.self_treatment.requires=none
sim.upgrade.self_treatment.group=0
sim.upgrade.self_treatment.answers=none
sim.upgrade.self_treatment.effects=count mend_seconds chooser 10

# Bandolier (G0077): PERSONAL, as Grenadier - the chooser's commander carries one more grenade per rank, 4 and then 5,
# and the grenade it adds is in his hand the moment he takes it. Beside Grenadier, which shortens the wait: this
# buys a longer burst before he needs a crate.
sim.upgrade.bandolier.side=player
sim.upgrade.bandolier.weight=10
sim.upgrade.bandolier.ranks=2
sim.upgrade.bandolier.tier=1
sim.upgrade.bandolier.requires=none
sim.upgrade.bandolier.group=0
sim.upgrade.bandolier.answers=none
sim.upgrade.bandolier.effects=count grenade_most chooser 1

# Firepower: every crate opened after the pick holds a flamer per rank (G0056) - swapped in for what the
# deck dealt, from the last card back - and a flamer hits a quarter harder per rank for whoever holds one,
# the squad included. A crate dealt before the pick keeps what it holds; the caches laid by hand keep
# their guns.
sim.upgrade.firepower.side=player
sim.upgrade.firepower.weight=10
sim.upgrade.firepower.ranks=2
sim.upgrade.firepower.tier=1
sim.upgrade.firepower.requires=none
sim.upgrade.firepower.group=0
sim.upgrade.firepower.answers=none
sim.upgrade.firepower.effects=stock armoury_flamer 1; gun flamer gun_damage team 25

# Explosives: the squad throws grenades (G0051) - the commander's throw, into a pack of at least
# sim.trooper.grenade.minCluster, never where the blast could reach one of ours, at most one per squad
# gap. The chance is per second of such an opportunity, on top of sim.ai.chance.throw_a_grenade (0).
# Tier 2: a squad that grenades packs is the strongest card after Thick Skin.
sim.upgrade.explosives.side=player
sim.upgrade.explosives.weight=10
sim.upgrade.explosives.ranks=1
sim.upgrade.explosives.tier=2
sim.upgrade.explosives.requires=none
sim.upgrade.explosives.group=0
sim.upgrade.explosives.answers=none
sim.upgrade.explosives.effects=chance throw_a_grenade squad 0.3

# Full Crates: every crate opened after the pick holds four - the most a crate can hold, and every card a
# top bar shows (G0056). A count on the fewest a crate is dealt: two plus two. A crate dealt before the
# pick keeps what it holds.
sim.upgrade.full_crates.side=player
sim.upgrade.full_crates.weight=10
sim.upgrade.full_crates.ranks=1
sim.upgrade.full_crates.tier=1
sim.upgrade.full_crates.requires=none
sim.upgrade.full_crates.group=0
sim.upgrade.full_crates.answers=none
sim.upgrade.full_crates.effects=count crate_least side 2

# ---- ADAPTATIONS -------------------------------------------------------------------------------
# What the swarm takes on the field (ADR 0017): an upgrade on the aliens' side, with nobody choosing - one
# card at a time from the aliens' blocks below, on a schedule. Both halves are off at zero, and a level
# may turn either on (the Adventure levels do). everySeconds is one every so much level time, the first
# after it rather than at once; perPlayerUpgrades one every so many cards the players take. answerWeight
# makes an adaptation that answers an upgrade the players hold likelier to be dealt - its weight times
# one plus this, per rank they hold; zero is off, and nothing answers anything yet. An adaptation's tier
# counts adaptations taken against the draft's tierFrom.
sim.adaptation.everySeconds=0
sim.adaptation.perPlayerUpgrades=0
sim.adaptation.answerWeight=0

# Rapid Spit: every alien spits more often, whatever it spits - nearly a sixth off the wait between spits
# a rank, so three ranks bring a spitter's 1.1 s down to about 0.6 s, just above the cooldown floor of -50.
sim.upgrade.rapid_spit.side=alien
sim.upgrade.rapid_spit.weight=10
sim.upgrade.rapid_spit.ranks=3
sim.upgrade.rapid_spit.tier=1
sim.upgrade.rapid_spit.requires=none
sim.upgrade.rapid_spit.group=0
sim.upgrade.rapid_spit.answers=none
sim.upgrade.rapid_spit.effects=scale fire_cooldown aliens -15

# Swift Movement: the swarm walks faster - the speed stat Forced March moves for the squad, nearly a sixth a
# rank, so three ranks are under half again, inside the speed range of +50. A leap's flight is not walking and
# is Long Leap's.
sim.upgrade.swift_movement.side=alien
sim.upgrade.swift_movement.weight=10
sim.upgrade.swift_movement.ranks=3
sim.upgrade.swift_movement.tier=1
sim.upgrade.swift_movement.requires=none
sim.upgrade.swift_movement.group=0
sim.upgrade.swift_movement.answers=none
sim.upgrade.swift_movement.effects=scale speed aliens 15

# Long Leap: a leaper commits from a fifth farther a rank, and flies a tenth faster for a tenth longer - a
# fifth farther, and less time to sidestep it. The tell is not shortened: the hesitation stays what it was.
sim.upgrade.long_leap.side=alien
sim.upgrade.long_leap.weight=10
sim.upgrade.long_leap.ranks=3
sim.upgrade.long_leap.tier=1
sim.upgrade.long_leap.requires=none
sim.upgrade.long_leap.group=0
sim.upgrade.long_leap.answers=none
sim.upgrade.long_leap.effects=scale leap_speed aliens 10; scale leap_trigger_range aliens 20; scale leap_airborne_ticks aliens 10

# Chain Leap: one more leap strung onto every sequence at a man, a rank. Only the first still hesitates, so the
# chain is what grows, not the tell. A leap at a door stays one.
sim.upgrade.chain_leap.side=alien
sim.upgrade.chain_leap.weight=10
sim.upgrade.chain_leap.ranks=2
sim.upgrade.chain_leap.tier=1
sim.upgrade.chain_leap.requires=none
sim.upgrade.chain_leap.group=0
sim.upgrade.chain_leap.answers=none
sim.upgrade.chain_leap.effects=count leap_sequence_length aliens 1

# Bloodhound: the swarm notices from a quarter farther a rank, gives up three tenths later - lose rises faster
# than detection, so it never falls inside it - and ambles about a patch two fifths wider while idle. Only for
# strains that can be unaware at all: an always-aggressive one hunts from the first tick whatever these say.
sim.upgrade.bloodhound.side=alien
sim.upgrade.bloodhound.weight=10
sim.upgrade.bloodhound.ranks=3
sim.upgrade.bloodhound.tier=1
sim.upgrade.bloodhound.requires=none
sim.upgrade.bloodhound.group=0
sim.upgrade.bloodhound.answers=none
sim.upgrade.bloodhound.effects=scale wander_radius aliens 40; scale detection_range aliens 25; scale lose_range aliens 30

# Larger Brood: one more in every brood a nest sends, a rank - a nest that drew two sends three. The brood a
# nest leaves when it dies is its own and not moved.
sim.upgrade.larger_brood.side=alien
sim.upgrade.larger_brood.weight=10
sim.upgrade.larger_brood.ranks=2
sim.upgrade.larger_brood.tier=1
sim.upgrade.larger_brood.requires=none
sim.upgrade.larger_brood.group=0
sim.upgrade.larger_brood.answers=none
sim.upgrade.larger_brood.effects=count nest_brood_size aliens 1

# Toxic Blood (G0076): every alien leaves a spatter of its own venom where it dies, however it dies - the
# shape is sim.blood. Two circles a rank, so the second rank is a bigger spatter rather than a longer one.
# A trooper goes round a spatter only on sim.blood.heeded, so a fight leaves litter men sometimes blunder into.
sim.upgrade.toxic_blood.side=alien
sim.upgrade.toxic_blood.weight=10
sim.upgrade.toxic_blood.ranks=2
sim.upgrade.toxic_blood.tier=1
sim.upgrade.toxic_blood.requires=none
sim.upgrade.toxic_blood.group=0
sim.upgrade.toxic_blood.answers=none
sim.upgrade.toxic_blood.effects=count death_slicks aliens 2

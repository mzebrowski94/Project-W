# Simulation tunables, one domain of them. How the files in assets/sim/ are read: world.properties.

# MISSIONS. What a mission is built with that no other level has, read by MissionConfig alone (G0063).

# The ramp: a biome's roster counts rise by this per cent for each position it stands at in the march, so the
# first biome is at x1.0 and the fourth at x1.3. The same for every tier; the finale is not ramped. Hard's last
# biome is x1.625 its block - recalibrate after play (missions ticket 07).
sim.mission.rampPercent=10

# THE TIERS. Four numbers on the swarm and nothing about the player's side: a man reads a blow's harm, never its
# amount, so there is no damage key (G0063). enemyPercent scales every roster count, loose and nest;
# healthPercent every strain's and nest's health, on top of sim.swarm.healthPercent and rounded with it once;
# nestPeriodPercent the time between broods (sim.nest.periodSeconds); adaptation.* is the swarm's pace, both
# halves off at zero, and replaces whatever a level would have had. wakeRadius and firstBroodSeconds are the
# same on every tier (G0062). Every relation SimConfigTest holds holds on every tier: a hard grunt is
# 150 x 125% x 115% = 216, still one swing of sim.melee.damage; an easy brute 266, still more than one.
#
# Weak until the pool grows: the swarm has one adaptation (rapid_spit, three ranks), so hard runs it dry in
# about seven minutes and medium in about twelve.

# Easy: fewer, softer, a nest every 39 seconds, and a swarm that never adapts.
sim.mission.tier.easy.enemyPercent=75
sim.mission.tier.easy.healthPercent=85
sim.mission.tier.easy.nestPeriodPercent=130
sim.mission.tier.easy.adaptation.everySeconds=0
sim.mission.tier.easy.adaptation.perPlayerUpgrades=0

# Medium: the biomes' blocks as written - they are ported at this strength.
sim.mission.tier.medium.enemyPercent=100
sim.mission.tier.medium.healthPercent=100
sim.mission.tier.medium.nestPeriodPercent=100
sim.mission.tier.medium.adaptation.everySeconds=240
sim.mission.tier.medium.adaptation.perPlayerUpgrades=4

# Hard: more, tougher, a nest every 22.5 seconds, and a swarm that adapts sooner.
sim.mission.tier.hard.enemyPercent=125
sim.mission.tier.hard.healthPercent=115
sim.mission.tier.hard.nestPeriodPercent=75
sim.mission.tier.hard.adaptation.everySeconds=150
sim.mission.tier.hard.adaptation.perPlayerUpgrades=3

# THE STRIP. A mission deals this many biomes west to east, none twice and never two of one base side by side, then
# its finale. The pool (biomes.properties) holds at least this many. The same on every tier.
sim.mission.biomes=4

# The ground every mission is laid on (missions tickets 03, 12, 13), in tiles. 30 rows with the rock border, as the
# Adventures; apron is how far past a pass's mouth its biome keeps base ground; clearance is the narrowest passage
# left anywhere - two tiles is ten world units, and a brute is 5.2 across.
sim.mission.ground.rows=30
sim.mission.ground.apron=3
sim.mission.ground.clearance=2
# A ridge between every two biomes and before the finale: a solid core ridgeWidth columns wide whose faces wander
# up to ridgeRough columns into the biome either side - into the finale from the west only, so its west edge is
# straight. Crossed by passesMin-passesMax passes passWidth rows wide (a key's width), at least passApart rows of
# rock apart, each bending up to passJog rows on its way through. A ridge's first pass is entered at least snake
# rows from where the last ridge's came out, so the route snakes.
sim.mission.ground.ridgeWidth=3
sim.mission.ground.ridgeRough=3
sim.mission.ground.passWidth=4
sim.mission.ground.passesMin=1
sim.mission.ground.passesMax=2
sim.mission.ground.passApart=6
sim.mission.ground.passJog=4
sim.mission.ground.snake=8
# Every house (ticket 12): 8-12 x 7-10 tiles with its wall, so 6-10 x 5-8 inside; exactly two doorways 3 wide - one
# over the clearance, a squeeze rather than a jam - in two different walls, never at a corner. How many a biome has
# is its own (houses.min/max in biomes.properties). A gatehouse is a house built into a ridge, on about one ridge in
# four (never the one before the finale): 8 x 9 inside, its pass entering by the west wall and leaving by the east.
# Its doorways are as wide as a house's, so one door fits every doorway.
sim.mission.ground.houses.widthMin=8
sim.mission.ground.houses.widthMax=12
sim.mission.ground.houses.heightMin=7
sim.mission.ground.houses.heightMax=10
sim.mission.ground.houses.doorways=2
sim.mission.ground.houses.doorwayWidth=3
sim.mission.ground.houses.gatehouseShare=0.25
sim.mission.ground.houses.gatehouseWidth=8
sim.mission.ground.houses.gatehouseHeight=9

# PLACEMENT inside a biome (missions ticket 14, G0068): ordered Scatter passes, each keeping off what went down
# before it by these, crow-flies - the measure a nest's wakeRadius uses. World units; a tile is 5.
#
# Nothing hostile within startKeepOff of the start, above sim.nest.wakeRadius, so nothing wakes on the first
# tick; packs keep it off every pass their biome is entered by as well, so the fights come once you are through.
sim.mission.placement.startKeepOff=150
# One point to each equal band of columns, so the goal line leads east; two across a band edge stand pointApart.
sim.mission.placement.pointApart=60
# A nest keeps pointKeepOff off every point - above sim.controlPoint.aggroRadius, so starting a capture rouses no
# hole - nestKeepOff off the passes into its biome and nestApart off every other nest. nestKeepOff is under
# wakeRadius on purpose: a nest in the west half may wake as you come in; one beyond a ridge sleeps till you cross.
sim.mission.placement.pointKeepOff=50
sim.mission.placement.nestKeepOff=80
sim.mission.placement.nestApart=50
# Loose creatures go down in packs of packMin-packMax round anchors packApart apart, a pack spread over half of it,
# each anchor nestKeepOff off the passes in and the start's startKeepOff off it: fights come as encounters, not a
# carpet. packApart was 40 as grilled; at 40, and with anchors kept startKeepOff off every pass, a biome has room for
# about 20 creatures in its worst seeds - fewer than a ported block deals on easy (missions stage 7, measured).
sim.mission.placement.packMin=2
sim.mission.placement.packMax=5
sim.mission.placement.packApart=30
# A house holds up to houseStock of its biome's crates, then medkits - a cache you open, nothing hostile in it. The
# crates left over stand within pointReach of a point, the reward where the fight is (G0030).
sim.mission.placement.houseStock=2
sim.mission.placement.pointReach=25
# Every pickup keeps pickupKeepOff off every nest; a barrel stands within barrelReach of a nest or a pack's anchor, so
# a shot sets one off among them.
sim.mission.placement.pickupKeepOff=40
sim.mission.placement.barrelReach=25
# A nest or a boulder never moves, so it stands rockMargin off rock and a boulder rockMargin off everything else:
# wider than a brute, 5.2 across, so the slot it leaves is never one to be stuck in (G0042). The strip's clearance,
# 10, left the quarry no room for its boulders, and 7 a rocky first biome none for its hole (measured, stage 7).
sim.mission.placement.rockMargin=6

# THE FINALE. The last biome's last point stands in its last approachColumns columns, by the finale
# (G0064): taking it moves the rally point there.
sim.mission.finale.approachColumns=8

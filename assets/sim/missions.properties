# Simulation tunables, one domain of them. How the files in assets/sim/ are read: world.properties.

# MISSIONS. What a mission is built with that no other level has, read by MissionConfig alone (G0063).

# The ramp: a biome's roster counts rise by this per cent for each position it stands at in the march, so the
# first biome is at x1.0 and the fourth at x1.3. The same for every tier; the finale is not ramped. Hard's last
# biome is x1.625 its block - recalibrate after play (missions ticket 07).
sim.mission.rampPercent=10

# THE TIERS. Four numbers on the swarm and nothing about the player's side: a man reads a blow's harm, never its
# amount, so there is no damage key (G0063). enemyPercent scales every roster count, loose and nest;
# healthPercent every strain's and nest's health, on top of sim.swarm.healthPercent and rounded with it once;
# nestPeriodPercent the time between broods (sim.nest.periodSeconds); adaptation.* is the swarm's pace, both
# halves off at zero, and replaces whatever a level would have had. wakeRadius and firstBroodSeconds are the
# same on every tier (G0062). Every relation SimConfigTest holds holds on every tier: a hard grunt is
# 150 x 125% x 115% = 216, still one swing of sim.melee.damage; an easy brute 266, still more than one.
#
# Weak until the pool grows: the swarm has one adaptation (rapid_spit, three ranks), so hard runs it dry in
# about seven minutes and medium in about twelve.

# Easy: fewer, softer, a nest every 39 seconds, and a swarm that never adapts.
sim.mission.tier.easy.enemyPercent=75
sim.mission.tier.easy.healthPercent=85
sim.mission.tier.easy.nestPeriodPercent=130
sim.mission.tier.easy.adaptation.everySeconds=0
sim.mission.tier.easy.adaptation.perPlayerUpgrades=0

# Medium: the biomes' blocks as written - they are ported at this strength.
sim.mission.tier.medium.enemyPercent=100
sim.mission.tier.medium.healthPercent=100
sim.mission.tier.medium.nestPeriodPercent=100
sim.mission.tier.medium.adaptation.everySeconds=240
sim.mission.tier.medium.adaptation.perPlayerUpgrades=4

# Hard: more, tougher, a nest every 22.5 seconds, and a swarm that adapts sooner.
sim.mission.tier.hard.enemyPercent=125
sim.mission.tier.hard.healthPercent=115
sim.mission.tier.hard.nestPeriodPercent=75
sim.mission.tier.hard.adaptation.everySeconds=150
sim.mission.tier.hard.adaptation.perPlayerUpgrades=3
